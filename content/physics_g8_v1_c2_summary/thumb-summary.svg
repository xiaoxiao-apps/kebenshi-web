<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- c2 本章小结缩略图：知识清单卡+音叉/波形/音调响度音色三小标（原创矢量） -->
  <defs>
    <linearGradient id="bgS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#e8f0f8"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bgS)"/>
  <!-- 知识清单卡 -->
  <rect x="60" y="72" width="330" height="216" rx="18" fill="#ffffff" stroke="#dbe4ee" stroke-width="2"/>
  <rect x="60" y="72" width="330" height="52" rx="18" fill="#2563eb"/>
  <rect x="60" y="106" width="330" height="18" fill="#2563eb"/>
  <text x="225" y="106" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="sans-serif">📋 本章小结</text>
  <!-- 清单行：勾+文字条 -->
  <g font-family="sans-serif">
    <circle cx="96" cy="164" r="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <path d="M91 164 l4 4 l7 -8" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <text x="118" y="170" font-size="17" fill="#334155">声音产生 · 振动 · 介质</text>
    <circle cx="96" cy="208" r="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <path d="M91 208 l4 4 l7 -8" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <text x="118" y="214" font-size="17" fill="#334155">音调 · 响度 · 音色</text>
    <circle cx="96" cy="252" r="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <path d="M91 252 l4 4 l7 -8" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <text x="118" y="258" font-size="17" fill="#334155">超声波 · 次声波 · 回声</text>
  </g>
  <!-- 右上左：音叉（叉股朝上+手柄） -->
  <g>
    <path d="M452 96 L452 158 Q452 174 467 174 Q482 174 482 158 L482 96" fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <line x1="467" y1="176" x2="467" y2="206" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <circle cx="467" cy="210" r="5" fill="#475569"/>
    <path d="M440 108 q-7 16 0 32" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <path d="M494 108 q7 16 0 32" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <text x="467" y="238" font-size="14" fill="#64748b" text-anchor="middle" font-family="sans-serif">音叉振动发声</text>
  </g>
  <!-- 右上右：波形曲线 -->
  <g>
    <path d="M518 138 q12 -30 24 0 q12 30 24 0 q12 -30 24 0 q12 30 24 0" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round"/>
    <text x="566" y="182" font-size="14" fill="#64748b" text-anchor="middle" font-family="sans-serif">波形看三特性</text>
  </g>
  <!-- 右下：音调/响度/音色三小标 -->
  <g font-family="sans-serif">
    <rect x="440" y="256" width="58" height="34" rx="17" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="469" y="278" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">音调</text>
    <rect x="508" y="256" width="58" height="34" rx="17" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="537" y="278" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">响度</text>
    <rect x="576" y="256" width="58" height="34" rx="17" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="605" y="278" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">音色</text>
  </g>
  <text x="320" y="44" font-size="26" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="sans-serif">第二章「声现象」知识速记</text>
  <text x="320" y="330" font-size="16" fill="#64748b" text-anchor="middle" font-family="sans-serif">纯概念零题目 · 配套题目见本章练习</text>
</svg>
