    <rect x="196" y="122" width="56" height="56" fill="#c89b5f" stroke="#8a6739" stroke-width="3"/>
    <polygon points="196,122 210,110 266,110 252,122" fill="#d9b379" stroke="#8a6739" stroke-width="3"/>
    <polygon points="252,122 266,110 266,166 252,178" fill="#a87f49" stroke="#8a6739" stroke-width="3"/>
  </g>
