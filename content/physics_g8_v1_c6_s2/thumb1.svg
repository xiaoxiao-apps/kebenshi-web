    <polygon points="292,208 304,198 356,198 344,208" fill="#e8ebef" stroke="#8a9099" stroke-width="3"/>
    <polygon points="344,208 356,198 356,250 344,260" fill="#a7adb6" stroke="#8a9099" stroke-width="3"/>
  </g>
