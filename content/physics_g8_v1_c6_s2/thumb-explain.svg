<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf8ef"/><stop offset="1" stop-color="#f0e9da"/></linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a94a8"/><stop offset="1" stop-color="#5b616b"/></linearGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2e8f0"/><stop offset="1" stop-color="#aab4c0"/></linearGradient>
    <linearGradient id="wd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9b57f"/><stop offset="1" stop-color="#a9834f"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9a071"/><stop offset="1" stop-color="#a97c50"/></linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- 桌面 -->
  <rect x="0" y="290" width="640" height="70" fill="url(#wood)"/>
  <rect x="0" y="290" width="640" height="6" fill="#d8b184"/>
  <!-- 铁块（左，等轴测立方） -->
  <g>
    <polygon points="90,222 168,222 168,290 90,290" fill="url(#iron)"/>
    <polygon points="90,222 122,196 200,196 168,222" fill="#a8b0be"/>
    <polygon points="168,222 200,196 200,264 168,290" fill="#454b54"/>
    <text x="132" y="264" font-size="20" font-weight="700" fill="#f0f3f7" text-anchor="middle" font-family="sans-serif">铁</text>
  </g>
  <!-- 铝块（中） -->
  <g>
    <polygon points="268,222 346,222 346,290 268,290" fill="url(#alu)"/>
    <polygon points="268,222 300,196 378,196 346,222" fill="#f2f5f8"/>
    <polygon points="346,222 378,196 378,264 346,290" fill="#8a94a2"/>
    <text x="310" y="264" font-size="20" font-weight="700" fill="#3d4653" text-anchor="middle" font-family="sans-serif">铝</text>
  </g>
  <!-- 木块（右） -->
  <g>
    <polygon points="446,222 524,222 524,290 446,290" fill="url(#wd)"/>
    <polygon points="446,222 478,196 556,196 524,222" fill="#e8cd9c"/>
    <polygon points="524,222 556,196 556,264 524,290" fill="#8a6238"/>
    <line x1="462" y1="240" x2="508" y2="240" stroke="#8a6238" stroke-width="2" opacity=".6"/>
    <line x1="462" y1="258" x2="508" y2="258" stroke="#8a6238" stroke-width="2" opacity=".6"/>
    <text x="488" y="278" font-size="20" font-weight="700" fill="#4a3a10" text-anchor="middle" font-family="sans-serif">木</text>
  </g>
  <!-- 同体积标注括线 -->
  <g stroke="#8a6238" stroke-width="2.5" fill="none">
    <line x1="90" y1="170" x2="90" y2="160"/><line x1="90" y1="160" x2="556" y2="160"/><line x1="556" y1="160" x2="556" y2="170"/>
  </g>
  <rect x="252" y="144" width="136" height="30" rx="8" fill="#fdf8ef"/>
  <text x="320" y="166" font-size="18" font-weight="700" fill="#8a6238" text-anchor="middle" font-family="sans-serif">体积相同 V</text>
  <!-- 质量对比条（示意，铁最重） -->
  <g>
    <rect x="90" y="322" width="150" height="14" rx="4" fill="#5b616b"/>
    <rect x="268" y="322" width="80" height="14" rx="4" fill="#aab4c0"/>
    <rect x="446" y="322" width="38" height="14" rx="4" fill="#d9b57f"/>
    <text x="320" y="312" font-size="14" fill="#6b4a2f" text-anchor="middle" font-family="sans-serif">质量 m：铁 ＞ 铝 ＞ 木</text>
  </g>
  <!-- 标题 -->
  <text x="320" y="72" font-size="23" font-weight="700" fill="#3d4653" text-anchor="middle" font-family="sans-serif">同体积不同物质 · 质量一般不同</text>
  <text x="320" y="104" font-size="17" fill="#8a6238" text-anchor="middle" font-family="sans-serif">ρ = m / V</text>
</svg>
