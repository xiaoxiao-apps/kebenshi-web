<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef6fb"/><stop offset="1" stop-color="#d7e8f4"/></linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- 远景地面雪线 -->
  <path d="M0 320 Q160 306 320 318 T640 312 L640 360 L0 360 Z" fill="#f4f9fc"/>
  <!-- 枯枝（写实深棕，横斜构图） -->
  <g stroke="#6b4a2f" stroke-linecap="round" fill="none">
    <path d="M74 268 Q220 236 380 196 Q480 170 566 128" stroke-width="16"/>
    <path d="M250 228 Q266 190 258 152" stroke-width="7"/>
    <path d="M380 196 Q404 224 442 236" stroke-width="7"/>
    <path d="M470 174 Q478 140 464 108" stroke-width="6"/>
    <path d="M160 248 Q150 224 156 200" stroke-width="5"/>
  </g>
  <!-- 枝上霜凇（白色冰晶簇，沿枝分布） -->
  <g fill="#ffffff" stroke="#cfe2ee" stroke-width="1.5">
    <path d="M140 250 l-8 -18 l10 6 l4 -14 l6 13 l10 -7 l-6 18 Z"/>
    <path d="M214 232 l-7 -16 l9 5 l4 -13 l5 12 l9 -6 l-5 16 Z"/>
    <path d="M300 210 l-8 -18 l10 6 l4 -14 l6 13 l10 -7 l-6 18 Z"/>
    <path d="M420 182 l-7 -15 l8 5 l4 -12 l5 11 l8 -6 l-5 15 Z"/>
    <path d="M508 152 l-8 -17 l9 6 l5 -13 l5 12 l9 -6 l-5 16 Z"/>
    <path d="M254 152 l-6 -14 l8 5 l3 -11 l5 10 l8 -5 l-5 14 Z"/>
    <path d="M466 108 l-6 -14 l8 5 l3 -11 l5 10 l8 -5 l-5 14 Z"/>
  </g>
  <!-- 霜特写（右下放大圆窗：六角冰晶） -->
  <g>
    <circle cx="498" cy="266" r="72" fill="#ffffff" stroke="#7d97ab" stroke-width="4"/>
    <g stroke="#5fa8d3" stroke-width="3.5" stroke-linecap="round">
      <line x1="498" y1="218" x2="498" y2="314"/>
      <line x1="456" y1="242" x2="540" y2="290"/>
      <line x1="456" y1="290" x2="540" y2="242"/>
      <path d="M498 234 l-9 -8 M498 234 l9 -8 M498 298 l-9 8 M498 298 l9 8" fill="none" stroke-width="3"/>
      <path d="M470 250 l-11 2 M470 250 l-2 -10 M526 282 l11 -2 M526 282 l2 10" fill="none" stroke-width="3"/>
      <path d="M470 282 l-11 -2 M470 282 l-2 10 M526 250 l11 2 M526 250 l2 -10" fill="none" stroke-width="3"/>
    </g>
  </g>
  <!-- 凝华示意箭头：空气中水蒸气 → 霜 -->
  <g>
    <text x="120" y="86" font-size="17" font-weight="700" fill="#5b7186" font-family="sans-serif" text-anchor="middle">空气中的水蒸气</text>
    <path d="M150 100 Q180 150 202 196" fill="none" stroke="#dc2626" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M190 186 L210 214 L216 182 Z" fill="#dc2626"/>
    <text x="120" y="128" font-size="16" font-weight="700" fill="#dc2626" font-family="sans-serif" text-anchor="middle">遇冷凝华（放热）</text>
  </g>
</svg>
