<div class="container">

<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var from = params.get('from');
  var tab = params.get('tab');
  if (from || tab) {
    var qs = '?' + (from ? 'from=' + encodeURIComponent(from) : '') + (from && tab ? '&' : '') + (tab ? 'tab=' + encodeURIComponent(tab) : '');
    document.querySelectorAll('.nav-card').forEach(function(link){
      var base = link.getAttribute('href').split('?')[0];
      link.setAttribute('href', base + qs);
    });
  }
})();
</script>
<script src="exp-back.js?v=20260920r5"></script>
