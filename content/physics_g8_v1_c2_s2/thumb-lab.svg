<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#5ad7ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#5ad7ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 深底 -->
  <rect x="0" y="0" width="600" height="360" rx="0" fill="#0b0e13"/>
  <rect x="0" y="0" width="600" height="360" fill="url(#glow)"/>

  <!-- 示波器（左上）：屏幕上一疏一密两条波形 -->
  <g>
    <!-- 机身 -->
    <rect x="44" y="34" width="286" height="196" rx="14" fill="#131a2a" stroke="#2a3550" stroke-width="4"/>
    <!-- 屏幕 -->
    <rect x="62" y="52" width="250" height="140" rx="8" fill="#0d1420" stroke="#2f3c58" stroke-width="2"/>
    <!-- 屏幕网格线 -->
    <g stroke="rgba(90,215,255,0.14)" stroke-width="1">
      <line x1="62" y1="87" x2="312" y2="87"/>
      <line x1="62" y1="122" x2="312" y2="122"/>
      <line x1="62" y1="157" x2="312" y2="157"/>
      <line x1="124" y1="52" x2="124" y2="192"/>
      <line x1="187" y1="52" x2="187" y2="192"/>
      <line x1="250" y1="52" x2="250" y2="192"/>
    </g>
    <!-- 疏波形（低频·低音调，青） -->
    <path d="M70 86 Q95 58 120 86 T170 86 T220 86 T270 86 T306 86"
          fill="none" stroke="#5ad7ff" stroke-width="3" stroke-linecap="round"/>
    <!-- 密波形（高频·高音调，蓝） -->
    <path d="M70 158 q6 -18 12 0 q6 18 12 0 q6 -18 12 0 q6 18 12 0 q6 -18 12 0 q6 18 12 0 q6 -18 12 0 q6 18 12 0 q6 -18 12 0 q6 18 12 0 q6 -18 12 0 q6 18 12 0 q6 -18 12 0 q6 18 12 0 q6 -18 12 0 q6 18 12 0 q6 -18 12 0 q6 18 12 0 q6 -18 12 0 q6 18 12 0"
          fill="none" stroke="#4a9eff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 机身旋钮 -->
    <circle cx="92" cy="212" r="9" fill="#1d2432" stroke="#5a6a85" stroke-width="2"/>
    <circle cx="124" cy="212" r="9" fill="#1d2432" stroke="#5a6a85" stroke-width="2"/>
    <rect x="240" y="204" width="56" height="14" rx="7" fill="#1d2432" stroke="#2f3c58" stroke-width="2"/>
    <!-- 电源指示灯 -->
    <circle cx="312" cy="211" r="4" fill="#5ad7ff"/>
  </g>

  <!-- 桌子与钢尺（右下）：钢尺伸出桌边 -->
  <g>
    <!-- 桌面与桌腿 -->
    <rect x="300" y="268" width="300" height="16" rx="4" fill="#2a3550"/>
    <rect x="540" y="284" width="20" height="62" fill="#222c44"/>
    <!-- 钢尺：左段压在桌上，右段伸出桌边微下垂 -->
    <g transform="rotate(4 470 262)">
      <rect x="330" y="252" width="248" height="20" rx="3" fill="#8fa2c0"/>
      <rect x="330" y="252" width="248" height="7" rx="3" fill="#b8c7dd"/>
      <!-- 尺面刻度 -->
      <g stroke="#41506e" stroke-width="1.5">
        <line x1="350" y1="252" x2="350" y2="263"/>
        <line x1="370" y1="252" x2="370" y2="263"/>
        <line x1="390" y1="252" x2="390" y2="263"/>
        <line x1="410" y1="252" x2="410" y2="263"/>
        <line x1="430" y1="252" x2="430" y2="263"/>
        <line x1="450" y1="252" x2="450" y2="263"/>
        <line x1="470" y1="252" x2="470" y2="263"/>
        <line x1="490" y1="252" x2="490" y2="263"/>
        <line x1="510" y1="252" x2="510" y2="263"/>
        <line x1="530" y1="252" x2="530" y2="263"/>
        <line x1="550" y1="252" x2="550" y2="263"/>
      </g>
    </g>
    <!-- 桌边压尺的重物（书本） -->
    <rect x="332" y="238" width="86" height="24" rx="4" fill="#e06a6a"/>
    <rect x="332" y="238" width="86" height="8" rx="4" fill="#f08c8c"/>
    <!-- 拨动方向箭头（青色点缀） -->
    <path d="M560 300 q10 12 0 24" fill="none" stroke="#5ad7ff" stroke-width="3" stroke-linecap="round"/>
    <polygon points="554,320 566,320 560,332" fill="#5ad7ff"/>
  </g>

  <!-- 点缀星芒 -->
  <g fill="#5ad7ff" opacity="0.7">
    <circle cx="380" cy="60" r="3"/>
    <circle cx="556" cy="120" r="2.5"/>
    <circle cx="40" cy="290" r="2.5"/>
    <circle cx="264" cy="316" r="2.5"/>
  </g>
</svg>
