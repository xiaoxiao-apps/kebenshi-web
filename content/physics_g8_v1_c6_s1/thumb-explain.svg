<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf8ef"/><stop offset="1" stop-color="#f0e9da"/></linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8c96a"/><stop offset=".5" stop-color="#c9a53f"/><stop offset="1" stop-color="#9c7c28"/></linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8d6e4c"/><stop offset="1" stop-color="#6b4a2f"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8dee6"/><stop offset="1" stop-color="#9aa1ab"/></linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- 砝码盒（打开，木框绒布内衬） -->
  <rect x="70" y="96" width="500" height="212" rx="10" fill="url(#box)" stroke="#5c452c" stroke-width="4"/>
  <rect x="88" y="114" width="464" height="176" rx="6" fill="#3f4a3a"/>
  <rect x="88" y="114" width="464" height="176" rx="6" fill="#4a5544" opacity=".9"/>
  <!-- 盒盖搭扣 -->
  <rect x="300" y="88" width="40" height="14" rx="4" fill="#c9a53f"/>
  <!-- 大砝码（上排，铜质带提钮） -->
  <g>
    <rect x="120" y="146" width="86" height="52" rx="6" fill="url(#brass)" stroke="#7c6220" stroke-width="2"/>
    <rect x="150" y="132" width="26" height="16" rx="7" fill="url(#brass)" stroke="#7c6220" stroke-width="2"/>
    <text x="163" y="179" font-size="17" font-weight="700" fill="#4a3a10" text-anchor="middle" font-family="sans-serif">100g</text>
  </g>
  <g>
    <rect x="234" y="150" width="78" height="48" rx="6" fill="url(#brass)" stroke="#7c6220" stroke-width="2"/>
    <rect x="260" y="136" width="24" height="16" rx="7" fill="url(#brass)" stroke="#7c6220" stroke-width="2"/>
    <text x="273" y="181" font-size="17" font-weight="700" fill="#4a3a10" text-anchor="middle" font-family="sans-serif">50g</text>
  </g>
  <g>
    <rect x="340" y="156" width="70" height="42" rx="6" fill="url(#brass)" stroke="#7c6220" stroke-width="2"/>
    <rect x="364" y="142" width="22" height="16" rx="7" fill="url(#brass)" stroke="#7c6220" stroke-width="2"/>
    <text x="375" y="183" font-size="16" font-weight="700" fill="#4a3a10" text-anchor="middle" font-family="sans-serif">20g</text>
  </g>
  <!-- 小砝码（下排，钢质） -->
  <g>
    <rect x="120" y="222" width="58" height="36" rx="5" fill="url(#steel)" stroke="#6b7280" stroke-width="2"/>
    <text x="149" y="246" font-size="15" font-weight="700" fill="#2f3a48" text-anchor="middle" font-family="sans-serif">20g</text>
  </g>
  <g>
    <rect x="196" y="226" width="52" height="32" rx="5" fill="url(#steel)" stroke="#6b7280" stroke-width="2"/>
    <text x="222" y="248" font-size="15" font-weight="700" fill="#2f3a48" text-anchor="middle" font-family="sans-serif">10g</text>
  </g>
  <g>
    <rect x="266" y="230" width="44" height="28" rx="5" fill="url(#steel)" stroke="#6b7280" stroke-width="2"/>
    <text x="288" y="250" font-size="14" font-weight="700" fill="#2f3a48" text-anchor="middle" font-family="sans-serif">5g</text>
  </g>
  <!-- 镊子（右下，斜放） -->
  <g transform="rotate(-16 470 250)">
    <path d="M400 258 L520 244 L520 250 L404 264 Z" fill="url(#steel)" stroke="#6b7280" stroke-width="1.5"/>
    <path d="M400 258 L520 272 L520 266 L404 252 Z" fill="url(#steel)" stroke="#6b7280" stroke-width="1.5"/>
    <path d="M520 244 Q544 258 520 272 Z" fill="#9aa1ab"/>
  </g>
  <!-- 标注 -->
  <text x="320" y="60" font-size="22" font-weight="700" fill="#3d4653" text-anchor="middle" font-family="sans-serif">砝码盒：质量的标尺</text>
  <text x="320" y="340" font-size="15" fill="#6b4a2f" text-anchor="middle" font-family="sans-serif">质量是物体所含物质的多少 · 单位 kg / g</text>
</svg>
