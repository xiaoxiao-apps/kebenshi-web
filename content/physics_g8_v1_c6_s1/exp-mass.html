<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>天平实验室 — 质量</title>
<link rel="stylesheet" href="../_lib/guide/guide-core.css?v=20261028v2">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;-webkit-tap-highlight-color:transparent}
  body{font-family:"Yuanti SC","YouYuan","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f2ec;color:#3d3830;overflow:hidden}
  header{position:fixed;top:0;left:0;right:0;height:34px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f5f2ec;border-bottom:1px solid rgba(0,0,0,0.12);z-index:10}
  .back{font-size:13px;color:#2563eb;text-decoration:none;white-space:nowrap}
  .back:hover{text-decoration:underline}
  .title{font-size:13px;font-weight:600;color:#2b2620;white-space:nowrap}
  .scene-wrap{position:fixed;top:34px;left:0;right:0;bottom:0}
  canvas#scene{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
  .ctrlbar{position:fixed;left:0;right:0;bottom:0;min-height:96px;background:linear-gradient(to top,rgba(238,233,224,.80),rgba(238,233,224,.44) 70%,rgba(238,233,224,0));pointer-events:none;display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;gap:6px;padding:8px 12px;font-family:"Yuanti SC","YouYuan","PingFang SC","Microsoft YaHei",sans-serif;z-index:20}
  .ctrlbar>*{pointer-events:auto}
  .group{display:flex;flex-direction:column;gap:4px;background:rgba(255,255,255,.86);border:1px solid #ddd5c4;border-radius:10px;padding:5px 9px}
  .glabel{font-size:14px;color:#8a7c66;white-space:nowrap;letter-spacing:.5px;line-height:1}
  .gctrl{display:flex;align-items:center;gap:6px;flex:1;min-height:40px}
  button{border:0;border-radius:8px;padding:9px 13px;font-size:14px;font-family:inherit;cursor:pointer;background:#2563eb;color:#fff;transition:background .15s;white-space:nowrap}
  button:hover{background:#1d4ed8}
  button.secondary{background:#6b7280}
  button.secondary:hover{background:#4b5563}
  button.step{padding:6px 10px}
  /* 引入式工具按钮=物理按压两态（凸起/凹陷 .on） */
  button.btn2{border:1px solid #94a3b8;background:linear-gradient(#fdfefe,#dbe4ee);color:#334155;box-shadow:0 2px 3px rgba(30,41,59,.25);transition:all .12s}
  button.btn2:hover{background:linear-gradient(#f8fafc,#d2deeb)}
  button.btn2.on{background:#b9c7d6;border-color:#64748b;box-shadow:inset 0 2px 5px rgba(30,41,59,.35);transform:translateY(1px)}
  input#rng-rider{width:150px;accent-color:#d97706}
  #lbl-rider{font-size:15px;color:#854d0e;min-width:86px;text-align:right;font-variant-numeric:tabular-nums}
  /* R13 未调平警示读数：红色 */
  .bad{color:#dc2626 !important}
  /* 重力滑杆卡：画布右侧 DOM 幽灵化浮卡（.45 白底/16px 圆角/禁 blur） */
  .gcard{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:158px;background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.85);border-radius:16px;padding:12px 14px;z-index:15;display:flex;flex-direction:column;gap:8px}
  .gcard .gtitle{font-size:14px;color:#8a7c66;letter-spacing:.5px;white-space:nowrap}
  .gcard input#rng-g{width:100%;accent-color:#2563eb}
  .gcard .gpres{display:flex;gap:6px}
  .gcard .gpres button{flex:1;padding:6px 4px;font-size:12px}
  #lbl-g{font-size:15px;color:#1e293b;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
  /* 小窗紧凑档（core resize 判定 H<600 加 .compact） */
  .ctrlbar.compact .glabel{font-size:12px}
  .ctrlbar.compact .gctrl{min-height:32px}
  .ctrlbar.compact button{padding:5px 7px;font-size:13px}
  .ctrlbar.compact input#rng-rider{width:110px}
  .ctrlbar.compact #lbl-rider{font-size:13px;min-width:0}
  /* 读数面板（幽灵化：.45 白底/16px 圆角/禁 blur/三级色阶/无格线淡横线）
     R30：只读面板永久 pointer-events:none（吞事件零收益，开关在控制栏钮）；固定宽 300px+fixed 表格+折行=长后缀不撑宽挡天平 */
  .rec-panel{display:none;position:absolute;top:12px;left:12px;width:300px;pointer-events:none;background:rgba(255,255,255,0.45);border-radius:16px;padding:16px 20px;z-index:15}
  .rec-panel.show{display:block}
  .rec-panel .rp-title{font-size:18px;font-weight:600;color:#b45309;margin-bottom:10px}
  table.rec{border-collapse:collapse;font-size:16px;background:transparent;width:100%;table-layout:fixed}
  table.rec th,table.rec td{border:none;border-bottom:1px solid rgba(0,0,0,.08);padding:9px 13px;text-align:left;white-space:nowrap;color:#1e293b}
  table.rec th{background:transparent;font-weight:400;width:88px;color:#64748b}
  table.rec td{font-weight:600;word-break:break-all;white-space:normal;line-height:1.4}
  html.pseudo-fs{width:100%;height:100%}
  html.pseudo-fs body{position:fixed;top:0;left:0;right:0;bottom:0;width:100vw;height:100vh;height:100dvh;z-index:2147483000;overflow:hidden}
  /* R3 橡皮泥放大揉捏模态窗：遮罩+亮底卡片居中 */
  #knead-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:30;align-items:center;justify-content:center}
  #knead-mask.show{display:flex}
  #knead-card{position:relative;background:#fffef9;border-radius:16px;padding:16px 20px 18px;box-shadow:0 10px 34px rgba(0,0,0,.28);text-align:center}
  #knead-title{font-size:17px;font-weight:600;color:#5b3a00;margin-bottom:6px}
  #knead-tip{font-size:12px;color:#8a7c66;margin:6px 0 10px}
  #knead-cv{display:block;margin:0 auto;touch-action:none;cursor:grab}
  #knead-done{margin-top:4px;padding:9px 26px;font-size:15px}
  #knead-x{position:absolute;top:8px;right:8px;background:transparent;color:#8a7c66;font-size:20px;line-height:1;padding:4px 9px}
  #knead-x:hover{background:rgba(0,0,0,.06);color:#3d3830}
</style>
</head>
<body>
<header>
  <div class="title">质量 · 天平实验室</div>
  <a class="back" href="./index.html">← 返回实验卡页</a>
</header>
<div class="scene-wrap">
<canvas id="scene"></canvas>
<div class="gcard" id="card-g">
  <div class="gtitle">重力环境（位置）</div>
  <input type="range" id="rng-g" min="0.5" max="12" step="0.1" value="9.8">
  <div class="gpres">
    <button id="btn-g-earth" class="btn2 on">🌍 地球 9.8</button>
    <button id="btn-g-moon" class="btn2">🌙 月球 1.6</button>
  </div>
  <div id="lbl-g">g = 9.8 N/kg</div>
</div>
<div class="rec-panel" id="panel-read">
  <div class="rp-title">读数面板</div>
  <table class="rec"><tbody>
    <tr><th>被测物</th><td id="pe-obj">—</td></tr>
    <tr><th>砝码合计</th><td id="pe-wts">—</td></tr>
    <tr><th>游码示数</th><td id="pe-rider">—</td></tr>
    <tr><th>物体质量 m</th><td id="pe-mass">—</td></tr>
    <tr><th>横梁状态</th><td id="pe-beam">—</td></tr>
    <tr><th>重力环境 g</th><td id="pe-g">—</td></tr>
  </tbody></table>
</div>
<div id="knead-mask">
  <div id="knead-card">
    <button id="knead-x" title="完成并关闭">×</button>
    <div id="knead-title">揉捏橡皮泥</div>
    <canvas id="knead-cv"></canvas>
    <div id="knead-tip">按住拖动揉捏：竖向拖→压成饼 · 横向拖→拉成条</div>
    <button id="knead-done">完成</button>
  </div>
</div>
</div>
<div class="ctrlbar">
  <div class="group" id="grp-obj">
    <div class="glabel">被测物</div>
    <div class="gctrl">
      <button id="btn-obj-clay" class="btn2">橡皮泥 🟤</button>
      <button id="btn-obj-ice" class="btn2">冰水烧杯 🧊</button>
      <button id="btn-obj-pencil" class="btn2">铅笔 ✏️</button>
    </div>
  </div>
  <div class="group" id="grp-level">
    <div class="glabel">调平与游码</div>
    <div class="gctrl">
      <button id="btn-nut-l" class="secondary step" title="平衡螺母左旋">◀ 螺母</button>
      <button id="btn-nut-r" class="secondary step" title="平衡螺母右旋">螺母 ▶</button>
      <input type="range" id="rng-rider" min="0" max="5" step="0.1" value="0.5">
      <span id="lbl-rider">游码 0.5 g</span>
    </div>
  </div>
  <div class="group" id="grp-label">
    <div class="glabel">标注</div>
    <div class="gctrl">
      <button id="btn-labels" class="btn2">🏷 标注</button>
    </div>
  </div>
  <div class="group" id="grp-sys">
    <div class="glabel">系统</div>
    <div class="gctrl">
      <button id="btn-panel" class="btn2">读数面板</button>
      <button id="btn-reset" class="secondary">重置</button>
      <button id="btn-mute">🔊</button>
      <button id="btn-full" class="secondary">全屏</button>
    </div>
  </div>
</div>
<div id="guide-layer"><!-- 语音讲解层容器：内容由 _lib/guide/vB-core.js 运行时注入 --></div>
<script src="../_lib/v1/props.js?v=20261027r1"></script>
<script src="../_lib/v1/props-optics.js?v=20261027r1"></script>
<script src="../_lib/v1/props-density.js?v=20261027r1"></script>
<script src="../_lib/v1/sfx.js?v=20261027r1"></script>
<script src="exp-mass-core.js?v=20261028v1"></script>
<script>window.GUIDE_CFG={state:window.C6S1_STATE};</script>
<script src="guide/guide-data.js?v=20261028r7"></script>
<script src="../_lib/guide/engine-core.js?v=20261028v5"></script>
<script src="../_lib/guide/vB-core.js?v=20261028v3"></script>
</body>
</html>
