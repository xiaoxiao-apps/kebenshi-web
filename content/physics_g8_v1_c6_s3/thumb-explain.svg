<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf8ef"/><stop offset="1" stop-color="#f0e9da"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd0ee"/><stop offset="1" stop-color="#5aa8d8"/></linearGradient>
    <linearGradient id="glassw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset=".5" stop-color="#dcecf6" stop-opacity=".25"/><stop offset="1" stop-color="#ffffff" stop-opacity=".5"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9a071"/><stop offset="1" stop-color="#a97c50"/></linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- 桌面 -->
  <rect x="0" y="304" width="640" height="56" fill="url(#wood)"/>
  <rect x="0" y="304" width="640" height="6" fill="#d8b184"/>
  <!-- 量筒（居中偏左） -->
  <g>
    <rect x="196" y="60" width="112" height="244" rx="8" fill="url(#glassw)" stroke="#7d8aa0" stroke-width="3"/>
    <rect x="184" y="292" width="136" height="14" rx="6" fill="#9aa1ab"/>
    <!-- 水（凹液面） -->
    <path d="M200 150 Q252 168 304 150 L304 296 L200 296 Z" fill="url(#water)" opacity=".85"/>
    <path d="M200 150 Q252 168 304 150" fill="none" stroke="#dff2ff" stroke-width="3"/>
    <!-- 刻度（右侧壁） -->
    <g stroke="#5b616b" stroke-width="2">
      <line x1="278" y1="96" x2="300" y2="96"/><line x1="286" y1="120" x2="300" y2="120"/>
      <line x1="278" y1="144" x2="300" y2="144"/><line x1="286" y1="168" x2="300" y2="168"/>
      <line x1="278" y1="192" x2="300" y2="192"/><line x1="286" y1="216" x2="300" y2="216"/>
      <line x1="278" y1="240" x2="300" y2="240"/><line x1="286" y1="264" x2="300" y2="264"/>
    </g>
    <g font-family="sans-serif" font-size="13" fill="#5b616b" text-anchor="end">
      <text x="272" y="100">100</text><text x="272" y="148">80</text><text x="272" y="196">60</text><text x="272" y="244">40</text>
    </g>
    <text x="252" y="84" font-size="14" fill="#5b616b" text-anchor="middle" font-family="sans-serif">mL</text>
    <!-- 嘴口 -->
    <path d="M196 66 L172 58 L196 80" fill="url(#glassw)" stroke="#7d8aa0" stroke-width="3"/>
  </g>
  <!-- 视线水平虚线 → 凹液面底部 -->
  <line x1="60" y1="159" x2="252" y2="159" stroke="#dc2626" stroke-width="3" stroke-dasharray="10 8"/>
  <circle cx="252" cy="159" r="6" fill="#dc2626"/>
  <text x="120" y="142" font-size="16" font-weight="700" fill="#dc2626" font-family="sans-serif">视线与凹液面底部相平</text>
  <!-- 烧杯（右，静物） -->
  <g>
    <path d="M400 168 L400 292 Q400 300 410 300 L520 300 Q530 300 530 292 L530 168" fill="url(#glassw)" stroke="#7d8aa0" stroke-width="3"/>
    <path d="M530 182 L556 176 L530 198" fill="none" stroke="#7d8aa0" stroke-width="3"/>
    <path d="M404 226 L526 226 L526 292 Q526 296 520 296 L410 296 Q404 296 404 292 Z" fill="url(#water)" opacity=".7"/>
    <line x1="404" y1="226" x2="526" y2="226" stroke="#dff2ff" stroke-width="3"/>
    <g stroke="#7d8aa0" stroke-width="2">
      <line x1="410" y1="200" x2="428" y2="200"/><line x1="410" y1="240" x2="428" y2="240"/><line x1="410" y1="280" x2="428" y2="280"/>
    </g>
  </g>
  <text x="468" y="150" font-size="17" font-weight="700" fill="#3f6fb5" text-anchor="middle" font-family="sans-serif">烧杯盛待测液体</text>
  <!-- 标题 -->
  <text x="320" y="40" font-size="21" font-weight="700" fill="#3d4653" text-anchor="middle" font-family="sans-serif">量筒测体积 V · 天平测质量 m · ρ=m/V</text>
</svg>
