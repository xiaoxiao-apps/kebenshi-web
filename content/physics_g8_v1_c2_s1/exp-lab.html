<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-store">
<meta http-equiv="Pragma" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>声音实验室</title>
  <link rel="stylesheet" href="lab.css?v=20261024" />
</head>
<body>
  <header id="shell-header">
    <a id="back-to-index" href="index.html">‹ 返回本节</a>
    <div class="header-mid">
      <div class="header-title">声音实验室</div>
      <nav id="mode-tabs">
        <button class="mode-tab active" data-mode="vibrate">① 发声体振动台</button>
        <button class="mode-tab" data-mode="amp">② 振动放大器</button>
        <button class="mode-tab" data-mode="wave">③ 声波可视化</button>
        <button class="mode-tab" data-mode="vacuum">④ 真空罩模拟</button>
        <button class="mode-tab" data-mode="medium">⑤ 介质传声对比台</button>
        <button class="mode-tab" data-mode="dual">⑥ 双声到达模拟</button>
        <button class="mode-tab" data-mode="speed">⑦ 声速排序游戏</button>
        <button class="mode-tab" data-mode="echo">⑧ 回声测距计算器</button>
      </nav>
      <div id="mode-subtitle">一切发声体都在振动——看音叉击水溅起水花。</div>
    </div>
  </header>

  <main id="shell-content">
    <div class="frame-card">
      <iframe class="mode-frame active" data-mode="vibrate" data-src="exp-vibrate.html?v=20261024" title="发声体振动台" allowfullscreen allow="fullscreen"></iframe>
      <iframe class="mode-frame" data-mode="amp"    data-src="exp-amp.html?v=20261024"    title="振动放大器" allowfullscreen allow="fullscreen"></iframe>
      <iframe class="mode-frame" data-mode="wave"   data-src="exp-wave.html?v=20261024"   title="声波可视化" allowfullscreen allow="fullscreen"></iframe>
      <iframe class="mode-frame" data-mode="vacuum" data-src="exp-vacuum.html?v=20261024" title="真空罩模拟" allowfullscreen allow="fullscreen"></iframe>
      <iframe class="mode-frame" data-mode="medium" data-src="exp-medium.html?v=20261024" title="介质传声对比台" allowfullscreen allow="fullscreen"></iframe>
      <iframe class="mode-frame" data-mode="dual"   data-src="exp-dual.html?v=20261024"   title="双声到达模拟" allowfullscreen allow="fullscreen"></iframe>
      <iframe class="mode-frame" data-mode="speed"  data-src="exp-speed.html?v=20261024"  title="声速排序游戏" allowfullscreen allow="fullscreen"></iframe>
      <iframe class="mode-frame" data-mode="echo"   data-src="exp-echo.html?v=20261024"   title="回声测距计算器" allowfullscreen allow="fullscreen"></iframe>
    </div>
  </main>

  <script src="lab.js?v=20261024"></script>
</body>
</html>
