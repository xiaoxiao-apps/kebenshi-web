<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfefe"/><stop offset="1" stop-color="#dbe6ef"/>
    </linearGradient>
    <linearGradient id="frame8" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9c1c8"/><stop offset="0.5" stop-color="#e3e8ec"/><stop offset="1" stop-color="#9aa3ab"/>
    </linearGradient>
    <linearGradient id="glass8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe6f2"/><stop offset="0.5" stop-color="#eaf5fb"/><stop offset="1" stop-color="#bcd9ea"/>
    </linearGradient>
  </defs>

  <!-- 亮底渐变 -->
  <rect width="640" height="360" fill="url(#bg8)"/>

  <!-- 墙体（左右两侧剖面） -->
  <rect x="0" y="60" width="120" height="260" fill="#e6ddcf"/>
  <rect x="520" y="60" width="120" height="260" fill="#e6ddcf"/>
  <g stroke="#d3c7b4" stroke-width="2">
    <line x1="0" y1="120" x2="120" y2="120"/><line x1="0" y1="180" x2="120" y2="180"/>
    <line x1="0" y1="240" x2="120" y2="240"/><line x1="0" y1="300" x2="120" y2="300"/>
    <line x1="60" y1="60" x2="60" y2="120"/><line x1="30" y1="120" x2="30" y2="180"/>
    <line x1="90" y1="180" x2="90" y2="240"/><line x1="40" y1="240" x2="40" y2="300"/>
    <line x1="520" y1="120" x2="640" y2="120"/><line x1="520" y1="180" x2="640" y2="180"/>
    <line x1="520" y1="240" x2="640" y2="240"/><line x1="520" y1="300" x2="640" y2="300"/>
    <line x1="580" y1="60" x2="580" y2="120"/><line x1="610" y1="120" x2="610" y2="180"/>
    <line x1="550" y1="180" x2="550" y2="240"/><line x1="600" y1="240" x2="600" y2="300"/>
  </g>

  <!-- 窗框（剖面，双层玻璃中间空气层） -->
  <rect x="112" y="52" width="416" height="276" rx="6" fill="url(#frame8)" stroke="#7e878f" stroke-width="2"/>
  <rect x="128" y="68" width="384" height="244" rx="4" fill="#8d959c"/>
  <!-- 外层玻璃 -->
  <rect x="140" y="76" width="56" height="228" fill="url(#glass8)" stroke="#9ab6c8" stroke-width="1.5"/>
  <!-- 空气层 -->
  <rect x="196" y="76" width="248" height="228" fill="#f4f9fc"/>
  <!-- 内层玻璃 -->
  <rect x="444" y="76" width="56" height="228" fill="url(#glass8)" stroke="#9ab6c8" stroke-width="1.5"/>
  <!-- 玻璃高光 -->
  <line x1="152" y1="84" x2="152" y2="296" stroke="#ffffff" stroke-width="5" opacity="0.7"/>
  <line x1="456" y1="84" x2="456" y2="296" stroke="#ffffff" stroke-width="5" opacity="0.7"/>
  <!-- 中梃密封条 -->
  <rect x="312" y="68" width="16" height="244" fill="#6f777e"/>

  <!-- 窗外噪声声波（左侧红色，强） -->
  <g fill="none" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round">
    <path d="M24 150 Q44 190 24 230" opacity="0.9"/>
    <path d="M56 132 Q86 190 56 248" opacity="0.65"/>
    <path d="M88 116 Q126 190 88 264" opacity="0.4"/>
  </g>

  <!-- 空气层内减弱的声波（虚线，弱） -->
  <g fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6 7" stroke-linecap="round">
    <path d="M232 158 Q248 190 232 222" opacity="0.45"/>
    <path d="M276 168 Q288 190 276 212" opacity="0.3"/>
  </g>

  <!-- 室内侧几乎无声（极弱一段） -->
  <path d="M556 176 Q564 190 556 204" fill="none" stroke="#2f6fb5" stroke-width="2" stroke-dasharray="4 5" opacity="0.5"/>

  <!-- 衰减示意箭头 -->
  <g>
    <line x1="322" y1="342" x2="286" y2="342" stroke="#33506b" stroke-width="3" stroke-linecap="round"/>
    <polygon points="286,342 298,336.5 298,347.5" fill="#33506b"/>
    <text x="336" y="347" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#33506b">声能逐层减弱</text>
  </g>

  <!-- 说明 -->
  <text x="320" y="34" font-family="-apple-system,'PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#33506b" text-anchor="middle">传播过程中控制噪声 · 双层中空隔音窗剖面</text>
</svg>
