<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 348" width="1600" height="348">
  <!-- 四联噪声源图标（自绘 flat 风）：汽车 / 塔吊 / 工厂 / 音箱，各带杂乱波形示意无规则振动 -->
  <rect x="0" y="0" width="1600" height="348" fill="#faf8f5"/>

  <!-- ===== 1. 汽车（鸣喇叭） ===== -->
  <g>
    <path d="M90 236 L130 236 L156 200 L246 200 Q264 200 264 218 L264 236 L286 236 L286 258 Q286 268 276 268 L96 268 Q86 268 86 258 Z" fill="#2980b9"/>
    <rect x="160" y="206" width="38" height="26" rx="5" fill="#e8f4fd"/>
    <rect x="206" y="206" width="34" height="26" rx="5" fill="#e8f4fd"/>
    <circle cx="132" cy="268" r="20" fill="#2c2c2c"/>
    <circle cx="240" cy="268" r="20" fill="#2c2c2c"/>
    <circle cx="132" cy="268" r="8" fill="#8a8a8a"/>
    <circle cx="240" cy="268" r="8" fill="#8a8a8a"/>
    <!-- 喇叭声（杂乱） -->
    <g fill="none" stroke="#c0392b" stroke-width="5" stroke-linecap="round">
      <path d="M306 208 Q326 196 320 178 Q340 186 352 168"/>
      <path d="M312 240 Q334 244 344 228 Q360 240 376 226"/>
    </g>
    <text x="200" y="322" text-anchor="middle" font-size="22" fill="#5a5a5a" font-family="sans-serif">交通鸣笛</text>
  </g>

  <!-- ===== 2. 塔吊（施工） ===== -->
  <g>
    <rect x="560" y="90" width="18" height="200" fill="#8b6914"/>
    <g stroke="#6b4f0e" stroke-width="4">
      <line x1="560" y1="120" x2="578" y2="150"/>
      <line x1="578" y1="120" x2="560" y2="150"/>
      <line x1="560" y1="180" x2="578" y2="210"/>
      <line x1="578" y1="180" x2="560" y2="210"/>
      <line x1="560" y1="240" x2="578" y2="270"/>
      <line x1="578" y1="240" x2="560" y2="270"/>
    </g>
    <rect x="470" y="78" width="220" height="14" rx="4" fill="#8b6914"/>
    <rect x="556" y="52" width="26" height="28" rx="4" fill="#5a5a5a"/>
    <line x1="660" y1="92" x2="660" y2="160" stroke="#2c2c2c" stroke-width="4"/>
    <rect x="642" y="160" width="36" height="30" rx="4" fill="#c0392b"/>
    <rect x="470" y="288" width="220" height="10" rx="4" fill="#8a8a8a"/>
    <!-- 敲击声（杂乱） -->
    <g fill="none" stroke="#c0392b" stroke-width="5" stroke-linecap="round">
      <path d="M706 150 Q724 138 718 120 Q738 130 750 112"/>
      <path d="M712 186 Q732 192 742 174 Q758 188 774 172"/>
    </g>
    <text x="580" y="322" text-anchor="middle" font-size="22" fill="#5a5a5a" font-family="sans-serif">施工机械</text>
  </g>

  <!-- ===== 3. 工厂 ===== -->
  <g>
    <rect x="920" y="180" width="240" height="110" rx="6" fill="#c8d2e8" stroke="#5a5a5a" stroke-width="3"/>
    <polygon points="920,180 960,150 1000,180" fill="#8a8a8a"/>
    <polygon points="1000,180 1040,150 1080,180" fill="#8a8a8a"/>
    <polygon points="1080,180 1120,150 1160,180" fill="#8a8a8a"/>
    <rect x="950" y="216" width="34" height="34" rx="3" fill="#faf8f5"/>
    <rect x="1010" y="216" width="34" height="34" rx="3" fill="#faf8f5"/>
    <rect x="1070" y="216" width="34" height="34" rx="3" fill="#faf8f5"/>
    <!-- 烟囱 -->
    <rect x="1180" y="120" width="34" height="170" rx="4" fill="#6b6b6b"/>
    <rect x="1174" y="112" width="46" height="14" rx="4" fill="#5a5a5a"/>
    <!-- 机器轰鸣（杂乱） -->
    <g fill="none" stroke="#c0392b" stroke-width="5" stroke-linecap="round">
      <path d="M1232 140 Q1252 128 1246 108 Q1268 118 1282 98"/>
      <path d="M1236 178 Q1258 184 1268 164 Q1286 180 1304 162"/>
    </g>
    <rect x="920" y="288" width="300" height="10" rx="4" fill="#8a8a8a"/>
    <text x="1060" y="322" text-anchor="middle" font-size="22" fill="#5a5a5a" font-family="sans-serif">工厂机器</text>
  </g>

  <!-- ===== 4. 音箱 ===== -->
  <g>
    <rect x="1390" y="120" width="120" height="170" rx="12" fill="#2c2c2c"/>
    <circle cx="1450" cy="176" r="26" fill="#0f1522" stroke="#5ad7ff" stroke-width="4"/>
    <circle cx="1450" cy="176" r="9" fill="#5ad7ff"/>
    <circle cx="1450" cy="246" r="16" fill="#0f1522" stroke="#4a9eff" stroke-width="3"/>
    <!-- 大音量（杂乱） -->
    <g fill="none" stroke="#c0392b" stroke-width="5" stroke-linecap="round">
      <path d="M1530 150 Q1550 136 1544 116 Q1566 128 1580 108"/>
      <path d="M1534 200 Q1556 208 1566 188 Q1582 204 1596 186"/>
      <path d="M1530 250 Q1550 264 1544 282 Q1564 272 1578 288"/>
    </g>
    <rect x="1380" y="288" width="140" height="10" rx="4" fill="#8a8a8a"/>
    <text x="1450" y="322" text-anchor="middle" font-size="22" fill="#5a5a5a" font-family="sans-serif">音箱轰鸣</text>
  </g>
</svg>
