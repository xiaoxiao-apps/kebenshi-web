<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- c7_s3 重力 缩略图（原创矢量：左=测力计挂钩码+G箭头，右=G-m 过原点直线图） -->
  <rect x="0" y="0" width="640" height="360" fill="#eef2f6"/>
  <rect x="0" y="306" width="640" height="54" fill="#c9a876"/>
  <rect x="0" y="306" width="640" height="8" fill="#b08a5a"/>
  <!-- 左：支架 + 弹簧测力计 -->
  <rect x="40" y="40" width="180" height="10" rx="4" fill="#9aa1ab" stroke="#7d838c"/>
  <rect x="52" y="46" width="10" height="262" rx="4" fill="#9aa1ab" stroke="#7d838c"/>
  <rect x="30" y="300" width="120" height="10" rx="4" fill="#9aa1ab" stroke="#7d838c"/>
  <circle cx="140" cy="60" r="7" fill="none" stroke="#5b6068" stroke-width="4"/>
  <line x1="140" y1="67" x2="140" y2="78" stroke="#5b6068" stroke-width="4"/>
  <rect x="112" y="78" width="56" height="126" rx="12" fill="#fbf7ea" stroke="#8a8266" stroke-width="3"/>
  <rect x="126" y="90" width="28" height="98" rx="4" fill="#ffffff" stroke="#b7ae92"/>
  <g stroke="#3f4650" stroke-width="2">
    <line x1="150" y1="96" x2="142" y2="96"/><line x1="150" y1="115" x2="142" y2="115"/>
    <line x1="150" y1="134" x2="142" y2="134"/><line x1="150" y1="153" x2="142" y2="153"/>
    <line x1="150" y1="172" x2="142" y2="172"/>
  </g>
  <line x1="128" y1="124" x2="152" y2="124" stroke="#d64545" stroke-width="3"/>
  <path d="M152 124 L144 119 L144 129 Z" fill="#d64545"/>
  <line x1="140" y1="204" x2="140" y2="218" stroke="#5b6068" stroke-width="4"/>
  <!-- 钩码 100g -->
  <circle cx="140" cy="224" r="5" fill="none" stroke="#6b7280" stroke-width="3"/>
  <rect x="122" y="230" width="36" height="34" rx="5" fill="url(#wg)" stroke="#5b6068" stroke-width="2"/>
  <ellipse cx="140" cy="232" rx="18" ry="4" fill="#e2e6ea" stroke="#5b6068" stroke-width="2"/>
  <text x="140" y="253" font-size="12" font-weight="700" fill="#3f4650" text-anchor="middle" font-family="sans-serif">100 g</text>
  <!-- G 红色箭头（竖直向下） -->
  <line x1="140" y1="270" x2="140" y2="322" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
  <path d="M140 336 L129 316 L151 316 Z" fill="#dc2626"/>
  <text x="160" y="312" font-size="22" font-weight="700" fill="#dc2626" font-family="sans-serif">G</text>
  <!-- 右：G-m 图（白区+过原点直线+描点） -->
  <rect x="300" y="52" width="308" height="230" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="396" y1="80" x2="396" y2="240"/><line x1="452" y1="80" x2="452" y2="240"/>
    <line x1="508" y1="80" x2="508" y2="240"/><line x1="564" y1="80" x2="564" y2="240"/>
    <line x1="340" y1="192" x2="584" y2="192"/><line x1="340" y1="144" x2="584" y2="144"/>
    <line x1="340" y1="96" x2="584" y2="96"/>
  </g>
  <line x1="340" y1="80" x2="340" y2="240" stroke="#64748b" stroke-width="2.5"/>
  <line x1="340" y1="240" x2="584" y2="240" stroke="#64748b" stroke-width="2.5"/>
  <line x1="340" y1="240" x2="556" y2="92" stroke="#dc2626" stroke-width="3" opacity="0.8"/>
  <g fill="#2563eb" stroke="#ffffff" stroke-width="1.5">
    <circle cx="396" cy="202" r="6"/><circle cx="452" cy="164" r="6"/><circle cx="508" cy="125" r="6"/>
  </g>
  <text x="344" y="72" font-size="14" font-weight="700" fill="#64748b" font-family="sans-serif">G/N</text>
  <text x="560" y="262" font-size="14" font-weight="700" fill="#64748b" text-anchor="end" font-family="sans-serif">m/kg</text>
  <text x="454" y="292" font-size="17" font-weight="700" fill="#15803d" text-anchor="middle" font-family="sans-serif">G = mg（g ≈ 9.8 N/kg）</text>
  <text x="320" y="34" font-size="20" font-weight="700" fill="#8a7c66" text-anchor="middle" font-family="sans-serif">重力跟质量成正比</text>
  <defs>
    <linearGradient id="wg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f979f"/><stop offset="0.45" stop-color="#d6dade"/><stop offset="1" stop-color="#7e868e"/>
    </linearGradient>
  </defs>
</svg>
