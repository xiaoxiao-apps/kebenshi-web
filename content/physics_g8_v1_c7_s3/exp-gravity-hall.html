<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>重力探究馆 — 重力</title>
<link rel="stylesheet" href="../_lib/guide/guide-core.css?v=20261102v2">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;-webkit-tap-highlight-color:transparent}
  body{font-family:"Yuanti SC","YouYuan","PingFang SC","Microsoft YaHei",sans-serif;background:#eef2f6;color:#3d3830;overflow:hidden}
  header{position:fixed;top:0;left:0;right:0;height:34px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#eef2f6;border-bottom:1px solid rgba(0,0,0,0.12);z-index:10}
  .back{font-size:13px;color:#2563eb;text-decoration:none;white-space:nowrap}
  .back:hover{text-decoration:underline}
  .title{font-size:13px;font-weight:600;color:#2b2620;white-space:nowrap}
  .scene-wrap{position:fixed;top:34px;left:0;right:0;bottom:0}
  canvas#scene{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
  .ctrlbar{position:fixed;left:0;right:0;bottom:0;min-height:96px;background:linear-gradient(to top,rgba(232,237,242,.80),rgba(232,237,242,.44) 70%,rgba(232,237,242,0));pointer-events:none;display:flex;flex-wrap:nowrap;overflow-x:auto;justify-content:center;justify-content:safe center;align-items:stretch;gap:8px;padding:8px 12px;font-family:inherit;z-index:20}
  .ctrlbar>*{pointer-events:auto;flex:0 0 auto}
  .group{display:flex;flex-direction:column;gap:4px;background:rgba(255,255,255,.86);border:1px solid #cdd6de;border-radius:10px;padding:5px 9px}
  .glabel{font-size:14px;color:#6d7c8a;white-space:nowrap;letter-spacing:.5px;line-height:1}
  .gctrl{display:flex;align-items:center;gap:6px;flex:1;min-height:40px}
  .gctrl label{font-size:14px;cursor:pointer;white-space:nowrap;color:#3d3830}
  button{border:0;border-radius:8px;padding:9px 13px;font-size:14px;font-family:inherit;cursor:pointer;background:#2563eb;color:#fff;transition:background .15s;white-space:nowrap}
  button:hover{background:#1d4ed8}
  button.secondary{background:#6b7280}
  button.secondary:hover{background:#4b5563}
  button:disabled{opacity:.35;cursor:default}
  button.wt{border:1px solid #94a3b8;background:linear-gradient(#fdfefe,#dbe4ee);color:#334155;box-shadow:0 2px 3px rgba(30,41,59,.25);transition:all .12s;padding:7px 11px}
  button.wt:hover{background:linear-gradient(#f8fafc,#d2deeb)}
  button.wt.on{background:#b9c7d6;border-color:#64748b;box-shadow:inset 0 2px 5px rgba(30,41,59,.35);transform:translateY(1px)}
  input[type=checkbox]{accent-color:#d97706;width:16px;height:16px}
  input[type=range]{accent-color:#d97706}
  .ctrlbar.compact .glabel{font-size:12px}
  .ctrlbar.compact .gctrl{min-height:32px}
  .ctrlbar.compact .gctrl label{font-size:12px}
  .ctrlbar.compact button{padding:5px 7px;font-size:13px}
  :fullscreen .ctrlbar,html.pseudo-fs .ctrlbar{flex-wrap:nowrap;gap:6px;padding:6px 10px;overflow-x:auto}
  :fullscreen .ctrlbar .glabel,html.pseudo-fs .ctrlbar .glabel{font-size:11px}
  :fullscreen .ctrlbar button,html.pseudo-fs .ctrlbar button{padding:4px 8px;font-size:13px}
  html.pseudo-fs{width:100%;height:100%}
  html.pseudo-fs body{position:fixed;top:0;left:0;right:0;bottom:0;width:100vw;height:100vh;height:100dvh;z-index:2147483000;overflow:hidden}
  .scene-btn{border:2px solid transparent;border-radius:12px;padding:8px 16px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;background:linear-gradient(#fdfefe,#e2e8f0);color:#334155;box-shadow:0 2px 6px rgba(30,41,59,.18);transition:all .2s}
  .scene-btn:hover{background:linear-gradient(#f8fafc,#d2deeb)}
  .scene-btn.active{border-color:#2563eb;background:linear-gradient(#dbeafe,#bfdbfe);color:#1d4ed8;box-shadow:0 2px 10px rgba(37,99,235,.25)}
</style>
<style>
@media (pointer:coarse) and (hover:none){
.ctrlbar{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;height:auto;min-height:0;max-height:70px;padding-top:4px;padding-bottom:4px;scrollbar-width:none}
.ctrlbar::-webkit-scrollbar{display:none}
.ctrlbar>*{flex:0 0 auto}
.ctrlbar .group{padding:3px 8px}
.ctrlbar .glabel{font-size:10px}
.ctrlbar .gctrl{min-height:24px;gap:4px}
.ctrlbar .gctrl label{font-size:12px}
.ctrlbar button{padding:4px 7px;font-size:12px}
}
</style>
</head>
<body>
<header>
  <div class="title">重力 · 重力探究馆</div>
  <a class="back" href="./index.html">← 返回</a>
</header>
<div class="scene-wrap">
<canvas id="scene"></canvas>
</div>
<div class="ctrlbar">
  <div class="group" id="grp-nav">
    <div class="glabel">场景</div>
    <div class="gctrl">
      <button id="btn-s1" class="scene-btn active">⚖️ 大小站</button>
      <button id="btn-s2" class="scene-btn">🧭 方向站</button>
    </div>
  </div>
  <div class="group" id="grp-weight">
    <div class="glabel">钩码（步进挂）</div>
    <div class="gctrl">
      <button id="btn-w50" class="wt">+50g</button>
      <button id="btn-w100" class="wt">+100g</button>
      <button id="btn-w250" class="wt">+250g</button>
      <button id="btn-unload" class="wt">减一个</button>
    </div>
  </div>
  <div class="group" id="grp-act">
    <div class="glabel">记录</div>
    <div class="gctrl">
      <button id="btn-record">记录</button>
      <button id="btn-clear" class="secondary">清空</button>
    </div>
  </div>
  <div class="group" id="grp-opt">
    <div class="glabel">选项</div>
    <div class="gctrl">
      <label><input type="checkbox" id="chk-g10">粗略 g=10</label>
      <label><input type="checkbox" id="chk-moon">🌙 月球</label>
    </div>
  </div>
  <div class="group" id="grp-dir" style="display:none">
    <div class="glabel">方向站控制</div>
    <div class="gctrl">
      <input type="range" id="rng-tilt" min="-30" max="30" step="1" value="0" style="width:100px">
      <span id="lbl-tilt" style="font-size:13px;min-width:40px;color:#854d0e">0°</span>
      <button id="btn-wall-check" class="wt">🧱 工人查墙</button>
      <button id="btn-zoom-out" class="wt">🚀 拉远</button>
    </div>
  </div>
  <div class="group" id="grp-sys">
    <div class="glabel">系统</div>
    <div class="gctrl">
      <button id="btn-reset" class="secondary">重置</button>
      <button id="btn-mute">🔊</button>
      <button id="btn-full" class="secondary">全屏</button>
    </div>
  </div>
</div>
<div id="guide-layer"></div>
<script src="../_lib/v1/props.js?v=20261104"></script>
<script src="../_lib/v1/props-mech.js?v=20261104"></script>
<script src="../_lib/v1/sfx.js?v=20261104"></script>
<script src="exp-gravity-hall-core.js?v=20261106"></script>
<script src="guide/guide-data.js?v=20261106"></script>
<script>window.GUIDE_CFG={state:window.C7S3_STATE,mode:'gravity'};window.GUIDE_DATA=window.C7S3_GUIDE;</script>
<script src="../_lib/guide/engine-core.js?v=20261028v13"></script>
<script src="../_lib/guide/vB-core.js?v=20261102v3"></script>
<script src="/content/_lib/mobile-guard.js?v=20261030v1" defer></script>
</body>
</html>
