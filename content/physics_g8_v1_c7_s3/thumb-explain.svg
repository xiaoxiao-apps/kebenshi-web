<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf8ef"/><stop offset="1" stop-color="#f0e9da"/></linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8c96a"/><stop offset=".5" stop-color="#c9a53f"/><stop offset="1" stop-color="#9c7c28"/></linearGradient>
    <linearGradient id="stand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#59636f"/><stop offset="1" stop-color="#3d4653"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9a071"/><stop offset="1" stop-color="#a97c50"/></linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- 桌面 -->
  <rect x="0" y="300" width="640" height="60" fill="url(#wood)"/>
  <rect x="0" y="300" width="640" height="6" fill="#d8b184"/>
  <!-- 支架（底座+立杆+横臂） -->
  <rect x="120" y="288" width="150" height="14" rx="5" fill="url(#stand)"/>
  <rect x="188" y="66" width="12" height="224" fill="url(#stand)"/>
  <rect x="194" y="60" width="150" height="11" rx="5" fill="url(#stand)"/>
  <!-- 细线悬挂重锤 -->
  <line x1="330" y1="71" x2="330" y2="196" stroke="#3d4653" stroke-width="2.5"/>
  <path d="M314 196 L346 196 L338 236 Q330 252 322 236 Z" fill="url(#brass)" stroke="#7c6220" stroke-width="2.5"/>
  <circle cx="330" cy="196" r="5" fill="#7c6220"/>
  <!-- 竖直方向虚线延长 -->
  <line x1="330" y1="256" x2="330" y2="300" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 7"/>
  <!-- G 箭头 -->
  <line x1="366" y1="210" x2="366" y2="262" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
  <polygon points="354,262 378,262 366,286" fill="#dc2626"/>
  <text x="384" y="256" font-size="22" font-weight="700" fill="#dc2626" font-family="sans-serif">G</text>
  <!-- 三角板靠桌面检验垂直 -->
  <polygon points="430,300 430,206 524,300" fill="#cfe3f2" fill-opacity=".8" stroke="#5b616b" stroke-width="3"/>
  <rect x="430" y="284" width="16" height="16" fill="none" stroke="#5b616b" stroke-width="2"/>
  <line x1="430" y1="300" x2="330" y2="300" stroke="#3f6fb5" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="486" y="336" font-size="15" fill="#5b616b" text-anchor="middle" font-family="sans-serif">线⊥桌面</text>
  <!-- 标注 -->
  <text x="628" y="120" font-size="17" fill="#5b616b" text-anchor="end" font-family="sans-serif">重锤静止时，</text>
  <text x="628" y="146" font-size="17" fill="#5b616b" text-anchor="end" font-family="sans-serif">线的方向即</text>
  <text x="628" y="172" font-size="17" font-weight="700" fill="#dc2626" text-anchor="end" font-family="sans-serif">竖直向下</text>
  <!-- 标题 -->
  <text x="120" y="46" font-size="22" font-weight="700" fill="#3d4653" font-family="sans-serif">重垂线：重力方向竖直向下</text>
</svg>
