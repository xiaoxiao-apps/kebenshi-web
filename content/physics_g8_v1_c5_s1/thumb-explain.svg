<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf8ef"/><stop offset="1" stop-color="#f2ead9"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfe3f2" stop-opacity=".85"/><stop offset=".5" stop-color="#eaf4fb" stop-opacity=".9"/><stop offset="1" stop-color="#b9d5ea" stop-opacity=".85"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9a071"/><stop offset="1" stop-color="#a97c50"/></linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- 桌面 -->
  <rect x="0" y="292" width="640" height="68" fill="url(#wood)"/>
  <rect x="0" y="292" width="640" height="6" fill="#d8b184"/>
  <!-- 主光轴（水平虚线） -->
  <line x1="60" y1="186" x2="580" y2="186" stroke="#8a94a8" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="586" y="191" font-size="15" fill="#6b7688" font-family="sans-serif">主光轴</text>
  <!-- 凸透镜（左，静置底座） -->
  <rect x="176" y="272" width="68" height="20" rx="5" fill="#3d4653"/>
  <rect x="204" y="252" width="12" height="22" fill="#59636f"/>
  <path d="M210 84 Q246 186 210 262 Q174 186 210 84 Z" fill="url(#glass)" stroke="#7ba7d6" stroke-width="3"/>
  <path d="M210 84 Q228 135 228 186" fill="none" stroke="#ffffff" stroke-width="3" opacity=".7"/>
  <text x="210" y="64" font-size="19" font-weight="700" fill="#3f6fb5" text-anchor="middle" font-family="sans-serif">凸透镜</text>
  <text x="210" y="326" font-size="14" fill="#6b4a2f" text-anchor="middle" font-family="sans-serif">中间厚 · 边缘薄</text>
  <!-- 凸透镜焦点 F 标记 -->
  <circle cx="288" cy="186" r="6" fill="#dc2626"/>
  <text x="288" y="170" font-size="16" font-weight="700" fill="#dc2626" text-anchor="middle" font-family="sans-serif">F</text>
  <!-- 凹透镜（右，静置底座） -->
  <rect x="396" y="272" width="68" height="20" rx="5" fill="#3d4653"/>
  <rect x="424" y="252" width="12" height="22" fill="#59636f"/>
  <path d="M430 84 Q402 186 430 262 L430 84 Z" fill="url(#glass)" stroke="#7ba7d6" stroke-width="3"/>
  <path d="M430 84 Q458 186 430 262 L430 84 Z" fill="url(#glass)" stroke="#7ba7d6" stroke-width="3"/>
  <text x="430" y="64" font-size="19" font-weight="700" fill="#3f6fb5" text-anchor="middle" font-family="sans-serif">凹透镜</text>
  <text x="430" y="326" font-size="14" fill="#6b4a2f" text-anchor="middle" font-family="sans-serif">中间薄 · 边缘厚</text>
  <!-- 虚焦点 F（凹透镜左侧） -->
  <circle cx="356" cy="186" r="5" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <text x="356" y="170" font-size="16" font-weight="700" fill="#dc2626" text-anchor="middle" font-family="sans-serif">F</text>
</svg>
