<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>透镜光学台 — 透镜</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Yuanti SC","YouYuan","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f2ec;color:#3d3830;overflow:hidden}
  header{position:fixed;top:0;left:0;right:0;height:34px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f5f2ec;border-bottom:1px solid rgba(0,0,0,0.12);z-index:10}
  .back{font-size:13px;color:#2563eb;text-decoration:none;white-space:nowrap}
  .back:hover{text-decoration:underline}
  .title{font-size:13px;font-weight:600;color:#2b2620;white-space:nowrap}
  .scene-wrap{position:fixed;top:34px;left:0;right:0;bottom:0}
  canvas#scene{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
  /* F4①：常规屏（≥1024px）控制栏单行不折行；窄屏可折行但分组有序 */
  @media(min-width:1024px){.ctrlbar{flex-wrap:nowrap;overflow-x:auto}}
  .ctrlbar{position:fixed;left:0;right:0;bottom:0;min-height:88px;background:linear-gradient(to top,rgba(238,233,224,.80),rgba(238,233,224,.44) 70%,rgba(238,233,224,0));pointer-events:none;display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;gap:6px;padding:6px 10px;font-family:"Yuanti SC","YouYuan","PingFang SC","Microsoft YaHei",sans-serif;z-index:20}
  .ctrlbar>*{pointer-events:auto}
  .group{display:flex;flex-direction:column;gap:4px;background:rgba(255,255,255,.86);border:1px solid #ddd5c4;border-radius:10px;padding:4px 8px}
  .glabel{font-size:13px;color:#8a7c66;white-space:nowrap;letter-spacing:.5px;line-height:1}
  .gctrl{display:flex;align-items:center;gap:5px;flex:1;min-height:36px}
  .gctrl label{font-size:13px;cursor:pointer;white-space:nowrap;color:#3d3830}
  button{border:0;border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;cursor:pointer;background:#2563eb;color:#fff;transition:background .15s;white-space:nowrap}
  button:hover{background:#1d4ed8}
  button.secondary{background:#6b7280}
  button.secondary:hover{background:#4b5563}
  button.step{padding:6px 10px}
  button:disabled{opacity:.35;cursor:default}
  button#btn-table,button#btn-focus,button#btn-labels,button#btn-flow,button#btn-scene{border:1px solid #94a3b8;background:linear-gradient(#fdfefe,#dbe4ee);color:#334155;box-shadow:0 2px 3px rgba(30,41,59,.25);transition:all .12s}
  button#btn-table:hover,button#btn-focus:hover,button#btn-labels:hover,button#btn-flow:hover,button#btn-scene:hover{background:linear-gradient(#f8fafc,#d2deeb)}
  button#btn-table.on,button#btn-focus.on,button#btn-labels.on,button#btn-flow.on,button#btn-scene.on{background:#b9c7d6;border-color:#64748b;box-shadow:inset 0 2px 5px rgba(30,41,59,.35);transform:translateY(1px)}
  /* F4①：flyout 泛化到组内子块（#grp-d 直径子块并入透镜参数卡后仍随场景二淡出） */
  .flyout{opacity:0;transform:translateY(-10px);pointer-events:none;transition:opacity .3s ease,transform .3s ease}
  .group{transition:opacity .3s ease,transform .3s ease}
  input#rng-f{width:118px;accent-color:#d97706}
  input#rng-d{width:76px;accent-color:#d97706}
  #lbl-f{font-size:14px;color:#854d0e;min-width:74px;text-align:right;font-variant-numeric:tabular-nums}
  #lbl-d{font-size:14px;color:#854d0e;min-width:62px;text-align:right;font-variant-numeric:tabular-nums}
  /* 小窗紧凑档（core resize 判定 H<600 加 .compact）：字号/内边距/滑杆宽全缩，保 5 卡单行 */
  .ctrlbar.compact .glabel{font-size:12px}
  .ctrlbar.compact .gctrl{min-height:32px}
  .ctrlbar.compact .gctrl label{font-size:12px}
  .ctrlbar.compact button{padding:5px 7px;font-size:13px}
  .ctrlbar.compact input#rng-f{width:128px}
  .ctrlbar.compact input#rng-d{width:80px}
  .ctrlbar.compact #lbl-f,.ctrlbar.compact #lbl-d{font-size:13px;min-width:0}
  .rec-panel{display:none;position:absolute;top:12px;right:12px;min-width:520px;background:rgba(255,255,255,0.45);border-radius:16px;padding:16px 20px;z-index:15}
  /* F12 窄屏分级响应（参照 c6s3 dockTable）：≤560px 取消 520px 硬下限，改 92vw，防横向溢出 */
  @media(max-width:560px){.rec-panel{min-width:auto;width:92vw}}
  .rec-panel.show{display:block}
  .rec-panel .rp-title{font-size:18px;font-weight:600;color:#b45309;margin-bottom:10px;font-family:"Yuanti SC","YouYuan","PingFang SC","Microsoft YaHei",sans-serif}
  table.rec{border-collapse:collapse;font-size:16px;background:transparent;width:100%}
  table.rec th,table.rec td{border:none;border-bottom:1px solid rgba(0,0,0,.08);padding:9px 13px;text-align:left;white-space:nowrap;color:#1e293b}
  table.rec th{background:transparent;font-weight:400;width:128px;color:#64748b}
  table.rec td{font-weight:600}
  #toast{display:none;position:absolute;left:50%;top:13%;transform:translateX(-50%);max-width:82%;background:rgba(255,244,214,.96);border:1px solid #e0a20a;color:#5b3a00;font-size:14px;font-weight:600;padding:10px 16px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:16;text-align:center}
  #toast.show{display:block}
  html.pseudo-fs{width:100%;height:100%}
  html.pseudo-fs body{position:fixed;top:0;left:0;right:0;bottom:0;width:100vw;height:100vh;z-index:2147483000;overflow:hidden}
</style>
<link rel="stylesheet" href="../_lib/guide/guide-core.css?v=20261028v2">
</head>
<body>
<header>
  <div class="title">透镜 · 透镜光学台</div>
  <a class="back" href="./index.html">← 返回实验卡页</a>
</header>
<div class="scene-wrap">
<canvas id="scene"></canvas>
<div class="rec-panel" id="panel-read">
  <div class="rp-title">读数面板</div>
  <table class="rec"><tbody>
    <tr><th>屏-透镜距离</th><td id="pr-dist">—</td></tr>
    <tr><th>当前焦距 f</th><td id="pr-f">—</td></tr>
    <tr><th>光斑状态</th><td id="pr-spot">—</td></tr>
  </tbody></table>
</div>
<div id="toast"></div>
<div id="guide-layer"><!-- 语音讲解层容器：内容由 _lib/guide/vB-core.js 运行时注入 --></div>
</div>
<div class="ctrlbar">
  <div class="group" id="grp-f">
    <div class="glabel">透镜参数</div>
    <div class="gctrl">
      <button id="btn-f-down" class="secondary step">◀</button>
      <input type="range" id="rng-f" min="1.2" max="4.8" step="0.05" value="2">
      <span id="lbl-f">f = 2.0 cm</span>
      <button id="btn-f-up" class="secondary step">▶</button>
      <span id="grp-d" style="display:inline-flex;align-items:center;gap:5px;margin-left:6px">
        <input type="range" id="rng-d" min="2.4" max="6.0" step="0.1" value="4.0">
        <span id="lbl-d">Ø 4.0 cm</span>
      </span>
    </div>
  </div>
  <div class="group" id="grp-show">
    <div class="glabel">显示</div>
    <div class="gctrl">
      <button id="btn-focus" class="on">焦点</button>
      <button id="btn-labels">标注</button>
      <button id="btn-flow">光流</button>
      <label><input type="checkbox" id="cb-virtual" checked> 反向延长虚线</label>
    </div>
  </div>
  <div class="group" id="grp-sys">
    <div class="glabel">系统</div>
    <div class="gctrl">
      <button id="btn-scene">☀️ 测焦距</button>
      <button id="btn-table">读数面板</button>
      <button id="btn-reset" class="secondary">重置</button>
      <button id="btn-mute">🔊</button>
      <button id="btn-full" class="secondary">全屏</button>
    </div>
  </div>
</div>
<script src="../_lib/v1/props.js?v=20261024"></script>
<script src="../_lib/v1/props-optics.js?v=20261024"></script>
<script src="../_lib/v1/sfx.js?v=20261024"></script>
<script src="exp-lens-core.js?v=20261029v2"></script>
<script>window.GUIDE_CFG={state:window.C5S1_STATE,get mode(){return window.C5S1_STATE.scene;}};</script>
<script src="guide/guide-data.js?v=20261029v3"></script>
<script src="../_lib/guide/engine-core.js?v=20261028v7"></script>
<script src="../_lib/guide/vB-core.js?v=20261028v3"></script>
</body>
</html>
