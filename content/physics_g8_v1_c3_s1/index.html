<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第1节 温度 · 可交互教材</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; }
  body {
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#0f1218; color:#f2f5fa;
    overflow:hidden; /* iframe 内全屏加载，不出滚动条 */
    -webkit-font-smoothing:antialiased;
  }
  .stage {
    width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:26px; padding:24px;
  }
  h1 { font-size:26px; font-weight:800; letter-spacing:1px; }
  .cards { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; }
  a.card {
    display:block; width:300px;
    background:#171c26; border:1px solid rgba(255,255,255,.08); border-radius:16px;
    overflow:hidden; text-decoration:none; color:inherit;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  a.card:hover { transform:translateY(-3px); box-shadow:0 12px 28px rgba(0,0,0,.45); border-color:rgba(90,215,255,.45); }
  a.card img { display:block; width:100%; height:180px; object-fit:cover; background:#0b0e13; }
  .card .body { padding:14px 16px 16px; }
  .card .name { font-size:17px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .card .chip { font-size:11px; font-weight:600; color:#5ad7ff; background:rgba(90,215,255,.14); padding:2px 9px; border-radius:99px; }
  .card .desc { margin-top:6px; font-size:13px; line-height:1.6; color:#9aa4b5; }
</style>
</head>
<body>
  <div class="stage">
    <h1>第1节 温度</h1>
    <div class="cards">
      <a class="card" href="exp-temp-lab.html">
        <img src="assets/thumb-templab.png" alt="温度实验室缩略图">
        <div class="body">
          <div class="name">温度实验室<span class="chip">实验</span></div>
          <div class="desc">温度计架 · 烧杯加热 · 加冰 · 体温计缩口</div>
        </div>
      </a>
      <!-- 阶段二卡片位：后续新增实验/探索卡片在此追加，复制上方 a.card 结构即可 -->
    </div>
  </div>
</body>
</html>
