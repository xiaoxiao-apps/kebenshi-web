<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#e8f1f8"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset=".5" stop-color="#eef5fa" stop-opacity=".8"/><stop offset="1" stop-color="#cfdde8" stop-opacity=".95"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e03131"/><stop offset="1" stop-color="#b02525"/></linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- 桌面 -->
  <rect x="0" y="318" width="640" height="42" fill="#e3d3ab"/>
  <rect x="0" y="318" width="640" height="6" fill="#d4c193"/>
  <!-- 实验室温度计（静物，直立微倾） -->
  <g transform="rotate(-4 190 200)">
    <rect x="174" y="52" width="32" height="248" rx="16" fill="url(#glass)" stroke="#8fa8bb" stroke-width="2"/>
    <rect x="184" y="70" width="12" height="226" rx="6" fill="#f4f8fb" stroke="#b9c9d6" stroke-width="1"/>
    <rect x="186" y="150" width="8" height="146" fill="url(#red)"/>
    <circle cx="190" cy="304" r="19" fill="url(#red)" stroke="#8fa8bb" stroke-width="2"/>
    <circle cx="184" cy="298" r="5" fill="#ffffff" opacity=".35"/>
    <g stroke="#5b7186" stroke-width="2">
      <line x1="206" y1="90" x2="222" y2="90"/><line x1="206" y1="120" x2="216" y2="120"/>
      <line x1="206" y1="150" x2="222" y2="150"/><line x1="206" y1="180" x2="216" y2="180"/>
      <line x1="206" y1="210" x2="222" y2="210"/><line x1="206" y1="240" x2="216" y2="240"/>
    </g>
    <text x="190" y="42" font-size="16" font-weight="700" fill="#41566b" font-family="sans-serif" text-anchor="middle">°C</text>
  </g>
  <!-- 刻度特写（放大圆窗） -->
  <g>
    <circle cx="448" cy="168" r="104" fill="#ffffff" stroke="#7d97ab" stroke-width="5"/>
    <circle cx="448" cy="168" r="94" fill="#f7fbfe" stroke="#c3d3df" stroke-width="1.5"/>
    <rect x="396" y="86" width="40" height="168" rx="8" fill="url(#glass)" stroke="#8fa8bb" stroke-width="2"/>
    <rect x="410" y="98" width="12" height="150" fill="url(#red)"/>
    <g stroke="#33475c" stroke-width="3.5">
      <line x1="440" y1="112" x2="486" y2="112"/><line x1="440" y1="140" x2="466" y2="140"/>
      <line x1="440" y1="168" x2="486" y2="168"/><line x1="440" y1="196" x2="466" y2="196"/>
      <line x1="440" y1="224" x2="486" y2="224"/>
    </g>
    <g font-family="sans-serif" font-size="17" fill="#33475c" font-weight="700">
      <text x="496" y="118">30</text><text x="496" y="174">20</text><text x="496" y="230">10</text>
    </g>
    <!-- 读数示意箭头 -->
    <line x1="330" y1="128" x2="392" y2="128" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
    <path d="M392 119 L410 128 L392 137 Z" fill="#dc2626"/>
    <text x="326" y="110" font-size="15" font-weight="700" fill="#dc2626" font-family="sans-serif" text-anchor="end">读数</text>
  </g>
  <text x="448" y="308" font-size="15" fill="#5b7186" font-family="sans-serif" text-anchor="middle">分度值 1°C · 视线与液柱上表面相平</text>
</svg>
