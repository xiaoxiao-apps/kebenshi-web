  <text x="320" y="44" font-size="26" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="sans-serif">第六章「质量与密度」知识速记</text>
  <text x="320" y="330" font-size="16" fill="#64748b" text-anchor="middle" font-family="sans-serif">纯概念零题目 · 配套题目见本章练习</text>
