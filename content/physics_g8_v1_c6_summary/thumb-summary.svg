    <path d="M442 230 q22 16 44 0" fill="none" stroke="#475569" stroke-width="3"/>
    <line x1="596" y1="204" x2="580" y2="230" stroke="#475569" stroke-width="1.5"/>
    <line x1="596" y1="204" x2="612" y2="230" stroke="#475569" stroke-width="1.5"/>
    <path d="M574 230 q22 16 44 0" fill="none" stroke="#475569" stroke-width="3"/>
    <rect x="456" y="214" width="16" height="14" rx="2" fill="#94a3b8"/>
    <rect x="588" y="214" width="16" height="14" rx="2" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
    <rect x="460" y="196" width="140" height="8" rx="4" fill="#475569"/>
    <rect x="544" y="190" width="9" height="8" rx="1.5" fill="#dc2626"/>
