<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>热身实验：视错觉 · 长度和时间的测量</title>
<link rel="stylesheet" href="common.css">
<style>
  .illusion-card { border-radius: 12px; padding: 16px; margin: 12px 0; }
  .card { background: var(--card-bg); }
  .question { font-size: 15px; color: var(--ink2); margin: 8px 0 12px; }
  .illusion-card svg { width: 100%; height: auto; display: block; margin: 0 auto; }
  .svg-wrap { background: #fff; border-radius: 10px; padding: 8px; margin: 8px 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.05); }
  .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .reveal-card { background: var(--card-bg); border-radius: 12px; padding: 16px; margin: 16px 0; border-left: 4px solid var(--primary); }
  .measure-area { margin-top: 12px; min-height: 20px; }
</style>
</head>
<body>
<div class="container">
  <a class="back-btn" data-back href="experiment.html">‹ 返回实验区</a>
  <div class="page-header">
    <h1 class="page-title">热身实验：视错觉</h1>
    <p class="page-subtitle">感觉总是可靠吗？先看图判断，再用“尺”验证。</p>
  </div>

  <div class="card illusion-card" style="background:var(--brown-bg);">
    <h2>错觉一：铁轨透视错觉 <span class="chip brown">Ponzo 错觉</span></h2>
    <p class="question">图 1.1-1 中的两根黄色小棒，哪一根更长？</p>
    <div class="svg-wrap"><svg viewBox="0 0 320 400" id="ponzoSvg">
      <rect width="320" height="400" fill="#d9d9d9"/>
      <g stroke="#9a9a9a" stroke-width="2">
        <line x1="33" y1="392" x2="287" y2="392"/>
        <line x1="45" y1="356" x2="275" y2="356"/>
        <line x1="56" y1="323" x2="264" y2="323"/>
        <line x1="67" y1="293" x2="253" y2="293"/>
        <line x1="76" y1="266" x2="244" y2="266"/>
        <line x1="84" y1="241" x2="236" y2="241"/>
        <line x1="92" y1="219" x2="228" y2="219"/>
        <line x1="99" y1="199" x2="221" y2="199"/>
        <line x1="105" y1="181" x2="215" y2="181"/>
        <line x1="110" y1="165" x2="210" y2="165"/>
        <line x1="116" y1="150" x2="204" y2="150"/>
        <line x1="120" y1="137" x2="200" y2="137"/>
        <line x1="124" y1="125" x2="196" y2="125"/>
        <line x1="128" y1="114" x2="192" y2="114"/>
        <line x1="131" y1="104" x2="189" y2="104"/>
        <line x1="134" y1="95" x2="186" y2="95"/>
        <line x1="137" y1="87" x2="183" y2="87"/>
        <line x1="140" y1="79" x2="180" y2="79"/>
        <line x1="142" y1="72" x2="178" y2="72"/>
        <line x1="144" y1="66" x2="176" y2="66"/>
        <line x1="146" y1="60" x2="174" y2="60"/>
        <line x1="148" y1="55" x2="172" y2="55"/>
        <line x1="150" y1="50" x2="170" y2="50"/>
        <line x1="151" y1="46" x2="169" y2="46"/>
        <line x1="152" y1="42" x2="168" y2="42"/>
      </g>
      <line x1="30" y1="400" x2="160" y2="20" stroke="#222222" stroke-width="3"/>
      <line x1="290" y1="400" x2="160" y2="20" stroke="#222222" stroke-width="3"/>
      <line id="ponzoTop" x1="105" y1="137" x2="215" y2="137" stroke="#f0b429" stroke-width="9" stroke-linecap="round"/>
      <line id="ponzoBot" x1="105" y1="368" x2="215" y2="368" stroke="#f0b429" stroke-width="9" stroke-linecap="round"/>
    </svg></div>
    <div class="btn-group" id="ponzoBtns">
      <button class="btn btn-secondary" data-ans="top">上面长</button>
      <button class="btn btn-secondary" data-ans="bottom">下面长</button>
      <button class="btn btn-secondary" data-ans="same">一样长</button>
    </div>
    <div id="ponzoFb" class="feedback" style="display:none; margin-top:12px;"></div>
    <button class="btn btn-primary" id="ponzoMeasureBtn" style="display:none; margin-top:12px;">📐 量一量</button>
    <div id="ponzoMeasureArea" class="measure-area"></div>
  </div>

  <div class="card illusion-card" style="background:var(--brown-bg);">
    <h2>错觉二：墙角错觉 <span class="chip brown">角落错觉</span></h2>
    <p class="question">图中的两根橙色竖条，哪一根更长？</p>
    <div class="svg-wrap"><svg viewBox="0 0 320 320" id="cornerSvg">
      <rect width="320" height="320" fill="#e8e8e8"/>
      <defs>
        <linearGradient id="gA" x1="90" y1="0" x2="15" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#d8d8d8"/>
          <stop offset="100%" stop-color="#a8a8a8"/>
        </linearGradient>
        <linearGradient id="gB" x1="90" y1="0" x2="230" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#d8d8d8"/>
          <stop offset="100%" stop-color="#909090"/>
        </linearGradient>
        <linearGradient id="gC" x1="230" y1="0" x2="305" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#909090"/>
          <stop offset="100%" stop-color="#c8c8c8"/>
        </linearGradient>
      </defs>
      <polygon points="15,92.5 90,10 90,310 15,227.5" fill="url(#gA)"/>
      <polygon points="90,10 230,100 230,220 90,310" fill="url(#gB)"/>
      <polygon points="230,100 305,46 305,274 230,220" fill="url(#gC)"/>
      <g stroke="#8a8a8a" stroke-width="1.5" fill="none">
        <polyline points="15,106 90,40 230,112 305,68.8"/>
        <polyline points="15,124 90,80 230,128 305,99.2"/>
        <polyline points="15,142 90,120 230,144 305,129.6"/>
        <polyline points="15,178 90,200 230,176 305,190.4"/>
        <polyline points="15,196 90,240 230,192 305,220.8"/>
        <polyline points="15,214 90,280 230,208 305,251.2"/>
      </g>
      <g stroke="#9a9a9a" stroke-width="1">
        <line x1="30" y1="76" x2="30" y2="244"/>
        <line x1="48" y1="56" x2="48" y2="264"/>
        <line x1="66" y1="36" x2="66" y2="284"/>
        <line x1="80" y1="21" x2="80" y2="299"/>
        <line x1="120" y1="29" x2="120" y2="291"/>
        <line x1="160" y1="55" x2="160" y2="265"/>
        <line x1="195" y1="78" x2="195" y2="242"/>
        <line x1="218" y1="92" x2="218" y2="228"/>
        <line x1="248" y1="87" x2="248" y2="233"/>
        <line x1="266" y1="74" x2="266" y2="246"/>
        <line x1="284" y1="61" x2="284" y2="259"/>
        <line x1="298" y1="51" x2="298" y2="269"/>
      </g>
      <g stroke="#666666" stroke-width="2">
        <line x1="90" y1="10" x2="90" y2="310"/>
        <line x1="230" y1="100" x2="230" y2="220"/>
      </g>
      <line id="cornerNear" x1="90" y1="110" x2="90" y2="210" stroke="#e8720c" stroke-width="10" stroke-linecap="butt"/>
      <line id="cornerFar" x1="230" y1="110" x2="230" y2="210" stroke="#e8720c" stroke-width="10" stroke-linecap="butt"/>
    </svg></div>
    <div class="btn-group" id="cornerBtns">
      <button class="btn btn-secondary" data-ans="left">左边长</button>
      <button class="btn btn-secondary" data-ans="right">右边长</button>
      <button class="btn btn-secondary" data-ans="same">一样长</button>
    </div>
    <div id="cornerFb" class="feedback" style="display:none; margin-top:12px;"></div>
    <button class="btn btn-primary" id="cornerMeasureBtn" style="display:none; margin-top:12px;">📐 量一量</button>
    <div id="cornerMeasureArea" class="measure-area"></div>
  </div>

  <div class="card illusion-card" style="background:var(--brown-bg);">
    <h2>错觉三：缪勒-莱耶箭头错觉 <span class="chip brown">Müller-Lyer</span></h2>
    <p class="question">两条水平线，哪一根更长？</p>
    <div class="svg-wrap"><svg viewBox="0 0 320 160" id="mullerSvg">
      <line id="mullerTop" x1="90" y1="55" x2="230" y2="55" stroke="#d32f2f" stroke-width="5" stroke-linecap="butt"/>
      <line id="mullerBot" x1="90" y1="120" x2="230" y2="120" stroke="#d32f2f" stroke-width="5" stroke-linecap="butt"/>
      <g stroke="#5a5a5a" stroke-width="3" fill="none">
        <line x1="90" y1="55" x2="60" y2="25"/><line x1="90" y1="55" x2="60" y2="85"/>
        <line x1="230" y1="55" x2="260" y2="25"/><line x1="230" y1="55" x2="260" y2="85"/>
        <line x1="90" y1="120" x2="120" y2="90"/><line x1="90" y1="120" x2="120" y2="150"/>
        <line x1="230" y1="120" x2="200" y2="90"/><line x1="230" y1="120" x2="200" y2="150"/>
      </g>
    </svg></div>
    <div class="btn-group" id="mullerBtns">
      <button class="btn btn-secondary" data-ans="top">上面长</button>
      <button class="btn btn-secondary" data-ans="bottom">下面长</button>
      <button class="btn btn-secondary" data-ans="same">一样长</button>
    </div>
    <div id="mullerFb" class="feedback" style="display:none; margin-top:12px;"></div>
    <button class="btn btn-primary" id="mullerMeasureBtn" style="display:none; margin-top:12px;">📐 量一量</button>
    <div id="mullerMeasureArea" class="measure-area"></div>
  </div>

  <div class="reveal-card">
    <h3 style="margin-bottom:8px;">揭晓</h3>
    <p>其实每组图中的两根小棒都<b>一样长</b>。我们的感觉有时不可靠，所以需要用尺进行<b>测量</b>。</p>
    <p style="font-size:13px;color:var(--ink3);margin-top:8px;">点击各卡片中的“📐 量一量”，可亲眼看到两根小棒叠合。</p>
  </div>

  <div class="btn-row" style="display:flex;gap:10px;flex-wrap:wrap;margin:16px 0;">
    <a class="btn btn-secondary" data-back href="experiment.html">‹ 返回实验区</a>
  </div>
</div>

<script>
(function(){
  function setup(idPrefix, afterReveal){
    var btns = document.getElementById(idPrefix + "Btns").querySelectorAll("button");
    var fb = document.getElementById(idPrefix + "Fb");
    var measureBtn = document.getElementById(idPrefix + "MeasureBtn");
    var done = false;
    btns.forEach(function(btn){
      btn.addEventListener("click", function(){
        if(done) return; done = true;
        var ans = btn.dataset.ans;
        fb.style.display = "block";
        if(ans === "same"){ fb.className = "feedback show ok"; fb.innerHTML = "答对了！其实它们一样长。"; }
        else { fb.className = "feedback show info"; fb.innerHTML = "很多人都猜错啦！其实它们一样长。"; }
        btns.forEach(function(b){ b.disabled = true; });
        measureBtn.style.display = "";
      });
    });
    measureBtn.addEventListener("click", function(){
      measureBtn.style.display = "none";
      afterReveal();
    });
  }

  setup("ponzo", function(){
    if(document.getElementById("ponzoTopClone")) return;
    var area = document.getElementById("ponzoMeasureArea");
    var svg = document.getElementById("ponzoSvg");
    var top = document.getElementById("ponzoTop");
    var bot = document.getElementById("ponzoBot");
    var clone = top.cloneNode(true);
    clone.setAttribute("id", "ponzoTopClone");
    clone.setAttribute("y1", top.getAttribute("y1"));
    clone.setAttribute("y2", top.getAttribute("y2"));
    svg.appendChild(clone);
    var startY1 = parseFloat(top.getAttribute("y1"));
    var endY1 = parseFloat(bot.getAttribute("y1"));
    var startTime = null, duration = 1000;
    function animatePonzo(time){
      if(!startTime) startTime = time;
      var p = Math.min((time - startTime)/duration, 1);
      var curY = startY1 + (endY1 - startY1) * p;
      clone.setAttribute("y1", curY); clone.setAttribute("y2", curY);
      if(p < 1) requestAnimationFrame(animatePonzo);
    }
    requestAnimationFrame(animatePonzo);
    setTimeout(function(){
      area.innerHTML = "<p style='color:#2980b9;margin-top:8px;'>✅ 两根黄色小棒完全重合，长度相等。</p>";
      var top2 = document.getElementById("ponzoTopClone");
      if(top2){ top2.setAttribute("stroke", "#000"); top2.setAttribute("stroke-dasharray", "6,4"); }
    }, 1100);
  });

  setup("corner", function(){
    if(document.getElementById("cornerNearClone")) return;
    var area = document.getElementById("cornerMeasureArea");
    var svg = document.getElementById("cornerSvg");
    var near = document.getElementById("cornerNear");
    var clone = near.cloneNode(true);
    clone.setAttribute("id", "cornerNearClone");
    clone.setAttribute("x1", near.getAttribute("x1"));
    clone.setAttribute("x2", near.getAttribute("x2"));
    svg.appendChild(clone);
    var startX = parseFloat(near.getAttribute("x1"));
    var endX = parseFloat(document.getElementById("cornerFar").getAttribute("x1"));
    var startTime = null, duration = 1000;
    function animateCorner(time){
      if(!startTime) startTime = time;
      var p = Math.min((time - startTime)/duration, 1);
      var curX = startX + (endX - startX) * p;
      clone.setAttribute("x1", curX); clone.setAttribute("x2", curX);
      if(p < 1) requestAnimationFrame(animateCorner);
    }
    requestAnimationFrame(animateCorner);
    setTimeout(function(){
      area.innerHTML = "<p style='color:#2980b9;margin-top:8px;'>✅ 两根橙色竖条完全重合，长度相等。</p>";
      var near2 = document.getElementById("cornerNearClone");
      if(near2){ near2.setAttribute("stroke", "#000"); near2.setAttribute("stroke-dasharray", "6,4"); }
    }, 1100);
  });

  setup("muller", function(){
    if(document.getElementById("mullerTopClone")) return;
    var area = document.getElementById("mullerMeasureArea");
    var svg = document.getElementById("mullerSvg");
    var top = document.getElementById("mullerTop");
    var clone = top.cloneNode(true);
    clone.setAttribute("id", "mullerTopClone");
    clone.setAttribute("y1", top.getAttribute("y1"));
    clone.setAttribute("y2", top.getAttribute("y2"));
    svg.appendChild(clone);
    var mStartY = parseFloat(top.getAttribute("y1"));
    var mEndY = 120, mStartTime = null, mDuration = 1000;
    function animateMuller(time){
      if(!mStartTime) mStartTime = time;
      var p = Math.min((time - mStartTime)/mDuration, 1);
      var curY = mStartY + (mEndY - mStartY) * p;
      clone.setAttribute("y1", curY); clone.setAttribute("y2", curY);
      if(p < 1) requestAnimationFrame(animateMuller);
    }
    requestAnimationFrame(animateMuller);
    setTimeout(function(){
      area.innerHTML = "<p style='color:#2980b9;margin-top:8px;'>✅ 两条水平线完全重合，长度相等。</p>";
      var top2 = document.getElementById("mullerTopClone");
      if(top2){ top2.setAttribute("stroke", "#000"); top2.setAttribute("stroke-dasharray", "6,4"); }
    }, 1100);
  });
})();
</script>
<script src="exp-back.js"></script>
</body>
</html>
