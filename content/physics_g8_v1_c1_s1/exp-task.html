<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>实测任务单 · 长度和时间的测量</title>
<link rel="stylesheet" href="common.css?v=20261024">
<style>
  html, body { -webkit-tap-highlight-color: transparent; }
  #fsTask.pseudo-fullscreen { height: 100vh !important; height: 100dvh !important; }
  .task-table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 12px 0; }
  .task-table th, .task-table td { border: 1px solid #e6dfd0; padding: 6px 4px; text-align: center; }
  .task-table th { background: var(--green-bg); color: var(--green); }
  .task-table .rec { width: 70px; min-width: 0; padding: 6px 4px; text-align: center; }
  .task-table .avg { font-weight: 700; color: var(--brown); }
  .tab-bar { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
  .tab-btn { background: var(--card2); color: var(--ink); border: 1px solid rgba(0,0,0,.08); }
  .tab-btn.active { background: var(--green); color: #fff; border-color: var(--green); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  /* ---- 全屏态（页面大标题在 wrap 外，全屏自然隐藏） ---- */
  .fullscreen-wrap:fullscreen, .fullscreen-wrap.pseudo-fullscreen {
    width: 100vw; height: 100vh; height: 100dvh; overflow-y: auto;
    background: var(--bg); border-radius: 0; margin: 0;
    padding: 52px 14px 16px; box-sizing: border-box;
  }
  .fullscreen-wrap:fullscreen .card,
  .fullscreen-wrap.pseudo-fullscreen .card { max-width: 960px; margin: 0 auto; }
  /* 全屏主体放大（口径同 exp-estimate） */
  .fullscreen-wrap:fullscreen .card h2,
  .fullscreen-wrap.pseudo-fullscreen .card h2 { font-size: 24px; }
  .fullscreen-wrap:fullscreen .card > p,
  .fullscreen-wrap.pseudo-fullscreen .card > p { font-size: 19px; }
  .fullscreen-wrap:fullscreen .hint,
  .fullscreen-wrap.pseudo-fullscreen .hint { font-size: 15px; }
  .fullscreen-wrap:fullscreen .tab-btn,
  .fullscreen-wrap.pseudo-fullscreen .tab-btn { font-size: 19px; padding: 13px 24px; }
  .fullscreen-wrap:fullscreen .task-table,
  .fullscreen-wrap.pseudo-fullscreen .task-table { font-size: 19px; }
  .fullscreen-wrap:fullscreen .task-table th,
  .fullscreen-wrap.pseudo-fullscreen .task-table th,
  .fullscreen-wrap:fullscreen .task-table td,
  .fullscreen-wrap.pseudo-fullscreen .task-table td { padding: 10px 6px; }
  .fullscreen-wrap:fullscreen .task-table .rec,
  .fullscreen-wrap.pseudo-fullscreen .task-table .rec {
    width: 104px; font-size: 19px; padding: 10px 6px;
  }
  @media (max-width: 480px) {
    .fullscreen-wrap:fullscreen, .fullscreen-wrap.pseudo-fullscreen { padding: 48px 8px 12px; }
  }
</style>
</head>
<body>
<div class="container">
  <a class="back-btn" data-back href="experiment.html">‹ 返回实验区</a>
  <div class="page-header">
    <h1 class="page-title">实测任务单</h1>
    <p class="page-subtitle">动手记录数据，多次测量求平均，理解误差概念。</p>
  </div>
  <div class="fullscreen-wrap" id="fsTask">
    <button class="fullscreen-btn" title="全屏" aria-label="全屏显示">⛶</button>
  <div class="card">
    <h2>实测任务单 <span class="chip green">动手记录</span></h2>
    <p>请用刻度尺/秒表完成以下测量，把数据填入表中。多次测量可以减小<b>误差</b>。</p>
    <div class="tab-bar" id="taskTabs">
      <button class="btn tab-btn active" data-target="len">长度测量</button>
      <button class="btn tab-btn" data-target="time">时间测量</button>
    </div>
    <p class="hint">提示：填写后表格会自动计算平均值。注意剔除明显错误的数据后再求平均。</p>
    <div class="tab-panel active" data-panel="len">
    <table class="task-table">
      <thead><tr><th>测量对象</th><th>第1次</th><th>第2次</th><th>第3次</th><th>平均值</th></tr></thead>
      <tbody>
        <tr><td>课本长（cm）</td><td><input class="rec" data-row="bookL" data-col="0"></td><td><input class="rec" data-row="bookL" data-col="1"></td><td><input class="rec" data-row="bookL" data-col="2"></td><td class="avg" id="bookL_avg">—</td></tr>
        <tr><td>课本宽（cm）</td><td><input class="rec" data-row="bookW" data-col="0"></td><td><input class="rec" data-row="bookW" data-col="1"></td><td><input class="rec" data-row="bookW" data-col="2"></td><td class="avg" id="bookW_avg">—</td></tr>
        <tr><td>课本厚（mm）</td><td><input class="rec" data-row="bookT" data-col="0"></td><td><input class="rec" data-row="bookT" data-col="1"></td><td><input class="rec" data-row="bookT" data-col="2"></td><td class="avg" id="bookT_avg">—</td></tr>
        <tr><td>作业本长（cm）</td><td><input class="rec" data-row="noteL" data-col="0"></td><td><input class="rec" data-row="noteL" data-col="1"></td><td><input class="rec" data-row="noteL" data-col="2"></td><td class="avg" id="noteL_avg">—</td></tr>
        <tr><td>作业本宽（cm）</td><td><input class="rec" data-row="noteW" data-col="0"></td><td><input class="rec" data-row="noteW" data-col="1"></td><td><input class="rec" data-row="noteW" data-col="2"></td><td class="avg" id="noteW_avg">—</td></tr>
        <tr><td>作业本厚（mm）</td><td><input class="rec" data-row="noteT" data-col="0"></td><td><input class="rec" data-row="noteT" data-col="1"></td><td><input class="rec" data-row="noteT" data-col="2"></td><td class="avg" id="noteT_avg">—</td></tr>
      </tbody>
    </table>
    </div>
    <div class="tab-panel" data-panel="time">
    <table class="task-table">
      <thead><tr><th>测量对象</th><th>第1次（s）</th><th>第2次（s）</th><th>第3次（s）</th><th>平均值</th></tr></thead>
      <tbody>
        <tr><td>脉搏跳动10次时间</td><td><input class="rec" data-row="pulse" data-col="0"></td><td><input class="rec" data-row="pulse" data-col="1"></td><td><input class="rec" data-row="pulse" data-col="2"></td><td class="avg" id="pulse_avg">—</td></tr>
        <tr><td>正常行走一步时间</td><td><input class="rec" data-row="step" data-col="0"></td><td><input class="rec" data-row="step" data-col="1"></td><td><input class="rec" data-row="step" data-col="2"></td><td class="avg" id="step_avg">—</td></tr>
      </tbody>
    </table>
    </div>
  </div>
  </div>
</div>
<script src="fullscreen.js?v=20261024"></script>
<script>
(function(){
  var wrap = document.getElementById("fsTask");
  if(wrap && window.FullscreenHelper){
    FullscreenHelper.bind(wrap, wrap.querySelector(".fullscreen-btn"), null);
  }
})();
</script>
<script>
(function(){
  var taskTabs = document.getElementById("taskTabs");
  if(taskTabs){
    taskTabs.addEventListener("click", function(e){
      var btn = e.target.closest(".tab-btn");
      if(!btn) return;
      var target = btn.dataset.target;
      taskTabs.querySelectorAll(".tab-btn").forEach(function(b){ b.classList.remove("active"); });
      document.querySelectorAll(".tab-panel").forEach(function(p){ p.classList.remove("active"); });
      btn.classList.add("active");
      var panel = document.querySelector('.tab-panel[data-panel="' + target + '"]');
      if(panel) panel.classList.add("active");
    });
  }
  function computeAvg(row){
    var vals = [];
    document.querySelectorAll('.rec[data-row="' + row + '"]').forEach(function(inp){
      var v = parseFloat(inp.value); if(!isNaN(v)) vals.push(v);
    });
    var out = document.getElementById(row + '_avg');
    if(vals.length === 0){ out.textContent = '—'; return; }
    var sum = vals.reduce(function(a,b){return a+b;}, 0);
    out.textContent = (sum / vals.length).toFixed(1);
  }
  document.querySelectorAll('.rec').forEach(function(inp){
    inp.addEventListener('input', function(){ computeAvg(inp.dataset.row); });
  });
})();
</script>
<script src="exp-back.js?v=20261024"></script>
</body>
</html>
