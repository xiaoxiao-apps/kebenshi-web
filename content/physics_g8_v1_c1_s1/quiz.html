<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小练习 · 长度和时间的测量</title>
<link rel="stylesheet" href="common.css">
<style>
  .stem { font-size: 16px; line-height: 1.8; margin: 8px 0 16px; font-weight: 600; }
  .opt { display: block; width: 100%; text-align: left; padding: 14px 16px; margin-bottom: 10px; background: #fff; border: 2px solid #e6dfd0; border-radius: 10px; font-size: 15px; cursor: pointer; line-height: 1.5; transition: all .15s; min-height: 44px; color: var(--ink); }
  .opt:hover { border-color: var(--brown-light); background: var(--brown-bg); }
  .opt.correct { border-color: var(--green); background: var(--green-bg); font-weight: 700; }
  .opt.wrong { border-color: var(--red); background: var(--red-bg); }
  .opt:disabled { cursor: default; opacity: .85; }
  .feedback { display: none; margin-top: 14px; padding: 14px 16px; border-radius: 10px; line-height: 1.8; font-size: 14px; }
  .feedback.show { display: block; }
  .feedback.ok { background: var(--green-bg); color: #2f6326; }
  .feedback.err { background: var(--red-bg); color: #a33; }
  .qidx { font-size: 13px; color: var(--ink2); margin-bottom: 8px; }
  .nav-row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="container">
  <a class="back-btn" href="index.html">‹ 返回本节</a>

  <div class="page-header">
    <h1 class="page-title">✏️ 小练习</h1>
    <p class="page-subtitle">趁热打铁，3 道经典题检验掌握程度</p>
  </div>

  <div class="card">
    <div class="qidx" id="qidx">第 1 / 3 题</div>
    <div class="stem" id="stem"></div>
    <div id="opts"></div>
    <div class="feedback" id="fb"></div>
    <div class="nav-row">
      <button class="btn btn-primary" id="nextQ" style="display:none;">下一题</button>
    </div>
  </div>

  <div class="anim-btns" id="doneRow" style="display:none;">
    <span style="color:var(--ink2);font-size:14px;" id="scoreTxt"></span>
    <button class="btn btn-secondary" id="retryBtn">↺ 再练一遍</button>
    <a class="btn btn-primary" href="summary.html">查看本节小结 →</a>
  </div>
</div>

<script>
(function(){
  var questions = [
    {
      stem: '一把刻度尺的分度值是 1 mm，用它测量物体长度时，下列读数正确的是（　　）',
      opts: ['2.3 cm', '2.35 cm', '2.350 cm', '2 cm'],
      ans: 1,
      fb: '分度值是 1 mm，读数时要估读到分度值的下一位，即 0.1 mm = 0.01 cm。所以应读到小数点后两位，<b>2.35 cm</b> 正确。'
    },
    {
      stem: '关于刻度尺的使用，下列说法正确的是（　　）',
      opts: ['读数时视线应斜着看刻度', '物体的一端必须对齐 0 刻度', '读数时要估读到分度值的下一位', '选择刻度尺时只看量程就行'],
      ans: 2,
      fb: '读数时视线要与刻度尺垂直；物体左端可以不对齐 0 刻度，用末端刻度减去起始刻度即可；选择刻度尺时要同时考虑量程和分度值。<b>读数时要估读到分度值的下一位</b>是正确的。'
    },
    {
      stem: '机械停表小表盘指针在"1"和"2"之间，且过了 1 和 2 的中线；大表盘指针指在 7.5 s 处，则读数为（　　）',
      opts: ['1 min 7.5 s', '1 min 37.5 s', '2 min 37.5 s', '0 min 37.5 s'],
      ans: 1,
      fb: '小表盘读分钟：指针在 1 和 2 之间，取 1 min。因为指针过了中线，说明大表盘已进入 30~60 s 段，即 30 + 7.5 = 37.5 s。最终读数为 <b>1 min 37.5 s</b>。'
    }
  ];

  var qi = 0, answered = false, score = 0;
  var stemEl = document.getElementById('stem');
  var optsEl = document.getElementById('opts');
  var fbEl = document.getElementById('fb');
  var qidxEl = document.getElementById('qidx');
  var nextBtn = document.getElementById('nextQ');
  var doneRow = document.getElementById('doneRow');
  var scoreTxt = document.getElementById('scoreTxt');

  function render(){
    answered = false;
    fbEl.className = 'feedback'; fbEl.innerHTML = '';
    nextBtn.style.display = 'none';
    var q = questions[qi];
    qidxEl.textContent = '第 ' + (qi + 1) + ' / ' + questions.length + ' 题';
    stemEl.textContent = q.stem;
    optsEl.innerHTML = '';
    q.opts.forEach(function(t, i){
      var b = document.createElement('button');
      b.className = 'opt'; b.textContent = t;
      b.addEventListener('click', function(){ onPick(b, i); });
      optsEl.appendChild(b);
    });
  }

  function onPick(btn, i){
    if(answered) return;
    answered = true;
    var q = questions[qi];
    var btns = optsEl.querySelectorAll('.opt');
    btns.forEach(function(b, j){ b.disabled = true; if(j === q.ans) b.classList.add('correct'); });
    if(i === q.ans){
      score++;
      fbEl.className = 'feedback show ok';
      fbEl.innerHTML = '✅ 回答正确！' + q.fb;
    } else {
      btn.classList.add('wrong');
      fbEl.className = 'feedback show err';
      fbEl.innerHTML = '❌ 再想想。' + q.fb;
    }
    if(qi < questions.length - 1){
      nextBtn.textContent = '下一题'; nextBtn.style.display = '';
    } else {
      nextBtn.textContent = '看成绩'; nextBtn.style.display = '';
    }
  }

  nextBtn.addEventListener('click', function(){
    if(qi < questions.length - 1){ qi++; render(); }
    else {
      doneRow.style.display = '';
      scoreTxt.textContent = '得分 ' + score + ' / ' + questions.length;
      nextBtn.style.display = 'none';
      stemEl.textContent = '练习完成！';
      optsEl.innerHTML = ''; qidxEl.textContent = ''; fbEl.className = 'feedback';
    }
  });

  document.getElementById('retryBtn').addEventListener('click', function(){
    qi = 0; score = 0; doneRow.style.display = 'none'; render();
  });

  render();
})();
</script>
</body>
</html>
