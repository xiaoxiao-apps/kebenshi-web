<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fefefe"/><stop offset="1" stop-color="#e0e8ef"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f4f6f8"/>
    </linearGradient>
    <linearGradient id="woodG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c48f"/><stop offset="1" stop-color="#c99a5e"/>
    </linearGradient>
  </defs>

  <!-- 亮底渐变 -->
  <rect width="640" height="360" fill="url(#bg)"/>
  <ellipse cx="320" cy="328" rx="240" ry="14" fill="#8aa0b6" opacity="0.18"/>

  <!-- 答题纸 -->
  <g>
    <path d="M108 44 H488 L532 88 V312 Q532 320 524 320 H116 Q108 320 108 312 V52 Q108 44 116 44 Z" fill="url(#paper)" stroke="#c8d0d8" stroke-width="1.6"/>
    <path d="M488 44 L532 88 H496 Q488 88 488 80 Z" fill="#dfe6ec" stroke="#c8d0d8" stroke-width="1.4"/>
    <!-- 页眉 -->
    <text x="136" y="86" font-family="'PingFang SC',Helvetica,sans-serif" font-size="21" font-weight="700" fill="#2f3f52">第1章 · 练习</text>
    <line x1="136" y1="98" x2="504" y2="98" stroke="#9fb0c0" stroke-width="1.6"/>
    <text x="504" y="86" font-family="'PingFang SC',Helvetica,sans-serif" font-size="13" fill="#7d8b99" text-anchor="end">机械运动</text>
  </g>

  <!-- 第1题：刻度尺读数（小题图+红笔判分） -->
  <g>
    <text x="136" y="136" font-family="'PingFang SC',Helvetica,sans-serif" font-size="15" font-weight="700" fill="#2f3f52">1. 读数</text>
    <rect x="216" y="120" width="176" height="30" rx="3" fill="#f8fafc" stroke="#5a6b80" stroke-width="1.8"/>
    <g stroke="#5a6b80" stroke-width="1.6">
      <line x1="232" y1="120" x2="232" y2="134"/><line x1="264" y1="120" x2="264" y2="134"/>
      <line x1="296" y1="120" x2="296" y2="134"/><line x1="328" y1="120" x2="328" y2="134"/>
      <line x1="360" y1="120" x2="360" y2="134"/>
    </g>
    <g stroke="#8494a6" stroke-width="1">
      <line x1="240" y1="120" x2="240" y2="128"/><line x1="248" y1="120" x2="248" y2="128"/>
      <line x1="256" y1="120" x2="256" y2="128"/><line x1="272" y1="120" x2="272" y2="128"/>
      <line x1="280" y1="120" x2="280" y2="128"/><line x1="288" y1="120" x2="288" y2="128"/>
    </g>
    <text x="396" y="142" font-family="'PingFang SC',Helvetica,sans-serif" font-size="11" fill="#5a6b80">cm</text>
    <line x1="328" y1="112" x2="328" y2="154" stroke="#2f6fb5" stroke-width="1.2" stroke-dasharray="4 3"/>
    <!-- 红笔作答与判分 -->
    <text x="424" y="143" font-family="'PingFang SC',Helvetica,sans-serif" font-size="16" font-weight="700" fill="#c0392b">2.50 cm</text>
    <path d="M492 130 l7 9 l13 -17" fill="none" stroke="#c0392b" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 第2题：停表读数 -->
  <g>
    <text x="136" y="212" font-family="'PingFang SC',Helvetica,sans-serif" font-size="15" font-weight="700" fill="#2f3f52">2. 停表</text>
    <circle cx="240" cy="216" r="30" fill="#f8fafc" stroke="#5a6b80" stroke-width="1.8"/>
    <circle cx="240" cy="216" r="24" fill="none" stroke="#8494a6" stroke-width="1"/>
    <rect x="234" y="178" width="12" height="8" rx="2" fill="#f8fafc" stroke="#5a6b80" stroke-width="1.6"/>
    <line x1="240" y1="216" x2="240" y2="198" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/>
    <line x1="240" y1="216" x2="254" y2="226" stroke="#5a6b80" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="240" cy="216" r="2.4" fill="#5a6b80"/>
    <!-- 红笔作答与判分 -->
    <text x="300" y="223" font-family="'PingFang SC',Helvetica,sans-serif" font-size="16" font-weight="700" fill="#c0392b">t = 220 s</text>
    <path d="M384 210 l7 9 l13 -17" fill="none" stroke="#c0392b" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="136" y1="262" x2="410" y2="262" stroke="#c8d0d8" stroke-width="1.4"/>
    <path d="M136 284 q70 4 150 1" stroke="#aab6c2" stroke-width="1.6" fill="none" opacity="0.8"/>
    <path d="M136 300 q52 4 112 1" stroke="#aab6c2" stroke-width="1.6" fill="none" opacity="0.6"/>
  </g>

  <!-- 写实铅笔（无脸，斜置纸面右下） -->
  <ellipse cx="424" cy="330" rx="92" ry="9" fill="#7d8b99" opacity="0.18"/>
  <g transform="translate(330 236) rotate(24)">
    <path d="M0 16 L42 4 L42 28 Z" fill="url(#woodG)"/>
    <path d="M0 16 L13 12.3 L13 19.7 Z" fill="#3a3f46"/>
    <rect x="42" y="4" width="128" height="24" fill="#e8b62c"/>
    <rect x="42" y="4" width="128" height="7" fill="#f4cd5e"/>
    <rect x="42" y="21" width="128" height="7" fill="#c99a20"/>
    <rect x="170" y="4" width="22" height="24" fill="#b9c0c8"/>
    <rect x="170" y="4" width="22" height="6" fill="#d4dae0"/>
    <line x1="177" y1="4" x2="177" y2="28" stroke="#8f98a2" stroke-width="1.4"/>
    <line x1="185" y1="4" x2="185" y2="28" stroke="#8f98a2" stroke-width="1.4"/>
    <path d="M192 6 q18 -2 18 10 q0 12 -18 10 Z" fill="#d98a8a"/>
  </g>
</svg>
