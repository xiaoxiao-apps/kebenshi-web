<!DOCTYPE html> <!-- r5h -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>熔化凝固探究馆</title>
<link rel="stylesheet" href="exp-melt-stage3.css?v=6">
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:#1a1a24; color:#f0f0f0; }
#app { position:relative; width:100vw; height:100vh; }
#canvas-container { position:absolute; inset:0; z-index:1; }
#ui-layer { position:absolute; inset:0; z-index:10; pointer-events:none; }
#ui-layer > * { pointer-events:auto; }
.title-bar { position:absolute; top:0; left:0; right:0; height:48px; display:flex; align-items:center; justify-content:center; background:rgba(24,24,34,.85); border-bottom:1px solid rgba(255,255,255,.08); font-size:18px; font-weight:600; }
#back-to-index { position:absolute; top:8px; left:10px; z-index:50; display:inline-flex; align-items:center; gap:4px; padding:6px 12px; border-radius:10px; background:rgba(24,24,34,.55); border:1px solid rgba(255,255,255,.14); color:#e8ecf4; font-size:14px; font-weight:600; text-decoration:none; backdrop-filter:blur(4px); }
.panel { position:absolute; background:rgba(30,30,44,.95); border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:10px; }
.control-panel { top:100px; left:14px; width:260px; max-height:calc(100vh - 180px); overflow-y:auto; }
.data-panel { top:100px; right:14px; width:340px; max-height:calc(100vh - 180px); overflow-y:auto; }
.panel-title { font-size:13px; font-weight:600; color:#ffd54f; border-bottom:1px solid rgba(255,255,255,.08); padding-bottom:4px; }
.row { display:flex; align-items:center; justify-content:space-between; font-size:13px; gap:8px; }
.row label { color:#b0b0c0; }
.row .value { font-variant-numeric:tabular-nums; color:#81d4fa; font-weight:600; }
.slider-row { display:grid; grid-template-columns:64px 22px 1fr 22px 56px; align-items:center; gap:6px; margin-bottom:4px; }
.slider-row label { font-size:12px; color:#b0b0c0; }
input[type=range] { width:100%; height:6px; cursor:pointer; }
select { position:absolute; opacity:0; width:1px; height:1px; pointer-events:none; }
.stepper-btn { width:22px; height:22px; border-radius:4px; border:1px solid rgba(255,255,255,.2); background:#2c2c40; color:#f0f0f0; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.custom-select { position:relative; width:100%; height:30px; }
.custom-select-trigger { display:flex; align-items:center; justify-content:space-between; width:100%; height:30px; background:#2c2c40; color:#f0f0f0; border:1px solid rgba(255,255,255,.2); border-radius:6px; font-size:13px; padding:0 6px; cursor:pointer; }
.custom-select-trigger::after { content:'▾'; font-size:11px; color:#b0b0c0; margin-left:4px; }
.custom-options { position:absolute; left:0; right:0; top:calc(100% + 4px); max-height:180px; overflow-y:auto; background:rgba(36,36,52,.98); border:1px solid rgba(255,255,255,.2); border-radius:8px; z-index:1000; display:none; }
.custom-option { padding:8px 10px; font-size:13px; color:#f0f0f0; cursor:pointer; }
.custom-option:hover, .custom-option.active { background:rgba(90,215,255,.2); color:#5ad7ff; }
.custom-select.open .custom-options { display:block; }
.slider-row.select-row { grid-template-columns:64px 1fr; }
.slider-row.select-row .custom-select { grid-column:2 / 3; width:100%; min-width:100%; }
@media (max-width:720px) { .custom-options { position:fixed; left:8px; right:8px; top:auto; bottom:80px; max-height:50vh; } }
.btn { padding:8px 14px; border-radius:20px; border:1px solid rgba(255,255,255,.15); background:#2c2c40; color:#f0f0f0; font-size:13px; font-weight:600; cursor:pointer; }
.btn.primary { background:#4caf50; border-color:#4caf50; color:#fff; }
.btn.warn { background:#ff9800; border-color:#ff9800; color:#fff; }
.status-chip { display:inline-block; padding:3px 10px; border-radius:12px; background:#2c2c40; border:1px solid rgba(255,255,255,.12); font-size:12px; color:#ffd54f; font-weight:600; }
#data-table { width:100%; border-collapse:collapse; font-size:12px; }
#data-table th, #data-table td { padding:4px 6px; text-align:center; border-bottom:1px solid rgba(255,255,255,.08); }
#data-table th { color:#ffd54f; font-weight:600; }
#chart-wrap { width:100%; height:180px; background:rgba(0,0,0,.25); border-radius:8px; overflow:hidden; }
#tt-chart { width:100%; height:100%; }
.chart-live-btn {
  display: none; align-items: center; justify-content: center;
  padding: 3px 8px; border-radius: 8px;
  border: 1px solid rgba(90,215,255,0.45); background: rgba(90,215,255,0.15);
  color: #5ad7ff; font-size: 11px; font-weight: 600; cursor: pointer;
}
.chart-live-btn:hover { background: rgba(90,215,255,0.25); }
.chart-live-btn.show { display: inline-flex; }
.bottom-controls { position:absolute; bottom:16px; left:50%; transform:translateX(-50%); display:flex; gap:12px; align-items:center; background:rgba(30,30,44,.95); padding:10px 18px; border-radius:28px; border:1px solid rgba(255,255,255,.1); }
.hint { position:absolute; bottom:86px; left:50%; transform:translateX(-50%); font-size:12px; color:#9090a5; background:rgba(0,0,0,.35); padding:4px 12px; border-radius:12px; text-align:center; }
@media (max-width:720px) { .control-panel { width:calc(50vw - 22px); padding:10px; } .data-panel { width:calc(50vw - 22px); } .slider-row { grid-template-columns:52px 18px 1fr 18px 42px; gap:4px; font-size:12px; } .slider-row label { font-size:11px; } .stepper-btn { width:18px; height:18px; font-size:10px; } .row label, .row .value { font-size:12px; } }
</style>
</head>
<body>
<div id="app">
  <div id="canvas-container"></div>
  <div id="ui-layer">
    <div class="title-bar">熔化凝固探究馆</div>
    <a id="back-to-index" href="index.html">‹ 返回</a>
    <div class="panel control-panel">
      <div class="panel-title">参数</div>
      <div class="slider-row select-row"><label>样品</label><div class="custom-select" id="sample-wrap"><select id="sample-select"><option value="hypo">海波</option><option value="paraffin">石蜡</option><option value="ice">冰</option></select><div class="custom-select-trigger"><span class="custom-select-text">海波</span></div><div class="custom-options"><div class="custom-option active" data-value="hypo">海波</div><div class="custom-option" data-value="paraffin">石蜡</div><div class="custom-option" data-value="ice">冰</div></div></div></div>
      <div class="slider-row select-row"><label>火力</label><div class="custom-select" id="fire-wrap"><select id="fire-select"><option value="low">小</option><option value="medium" selected>中</option><option value="high">大</option></select><div class="custom-select-trigger"><span class="custom-select-text">中</span></div><div class="custom-options"><div class="custom-option" data-value="low">小</div><div class="custom-option active" data-value="medium">中</div><div class="custom-option" data-value="high">大</div></div></div></div>
      <div class="slider-row"><label>环境温度</label><button class="stepper-btn" id="amb-minus">◀</button><input id="amb-slider" type="range" min="-10" max="40" step="1" value="25"><button class="stepper-btn" id="amb-plus">▶</button><span class="value" id="amb-val">25℃</span></div>
      <div class="slider-row select-row"><label>样品量</label><div class="custom-select" id="amount-wrap"><select id="amount-select"><option value="small">小</option><option value="medium" selected>中</option><option value="large">大</option></select><div class="custom-select-trigger"><span class="custom-select-text">中</span></div><div class="custom-options"><div class="custom-option" data-value="small">小</div><div class="custom-option active" data-value="medium">中</div><div class="custom-option" data-value="large">大</div></div></div></div>
      <div class="slider-row select-row"><label>时间加速</label><div class="custom-select" id="timescale-wrap"><select id="timescale-select"><option value="1">×1</option><option value="10">×10</option><option value="60" selected>×60</option><option value="300">×300</option></select><div class="custom-select-trigger"><span class="custom-select-text">×60</span></div><div class="custom-options"><div class="custom-option" data-value="1">×1</div><div class="custom-option" data-value="10">×10</div><div class="custom-option active" data-value="60">×60</div><div class="custom-option" data-value="300">×300</div></div></div></div>
      <div class="row" style="margin-top:4px;"><button class="btn primary" id="btn-lamp" style="flex:1;">点燃酒精灯</button></div>
      <div class="row" style="margin-top:4px;"><button class="btn" id="btn-freeze-quick" style="flex:1; display:none;">熄灯观察凝固</button></div>
      <div class="row" style="margin-top:4px;"><button class="btn warn" id="btn-pre-melt" style="flex:1;">直接跳到液态</button></div>
    </div>
    <div class="panel data-panel">
      <div class="panel-title">数据面板</div>
      <div class="row"><label>样品物态</label><span id="phase-label" class="status-chip">固态</span></div>
      <div class="row"><label>样品名称</label><span id="sample-name-label" class="value">海波</span></div>
      <div class="row"><label>样品温度</label><span id="r-sample-temp" class="value">25.0 ℃</span></div>
      <div class="row"><label>水浴温度</label><span id="r-water-temp" class="value">25.0 ℃</span></div>
      <div class="row"><label>水的物态</label><span id="r-water-phase" class="value">液态</span></div>
      <div class="row"><label>实验时间</label><span id="r-sim-time" class="value">0.0 min</span></div>
      <div class="chart-title-row" id="chart-title-row">
        <span style="display:flex;align-items:center;gap:8px;min-width:0;">
          <span id="chart-title">海波温度时间曲线</span>
          <span id="chart-live-hint" style="font-size:11px;color:#9090a5;white-space:nowrap;">拖动回看历史·双击回最新</span>
        </span>
        <span style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
          <button id="chart-live-btn" class="chart-live-btn" title="回到实时">实时</button>
          <button id="chart-float-btn" title="放大查看">⤢</button>
        </span>
      </div>
      <div id="chart-wrap"><canvas id="tt-chart"></canvas></div>
      <div id="freeze-annotation" style="display:none; padding:8px; background:rgba(79,195,247,0.12); border:1px solid rgba(79,195,247,0.35); border-radius:8px; font-size:12px; color:#b3e5fc; margin-top:6px;">同一种物质的凝固点和它的熔点相同（48℃）</div>
      <div class="panel-title" style="margin-top:4px;">数据记录</div>
      <div style="max-height:160px;overflow:auto;">
        <table id="data-table"><thead><tr><th>时间/min</th><th>温度/℃</th><th>阶段</th></tr></thead><tbody id="data-tbody"></tbody></table>
      </div>
    </div>
    <div id="chart-float" class="chart-float">
      <div class="chart-float-titlebar" id="chart-float-titlebar">
        <span id="chart-float-title">海波温度时间曲线</span>
        <span id="chart-float-hint">拖动回看历史·双击回最新</span>
        <span style="display:flex;align-items:center;gap:8px;">
          <button class="chart-float-latest" title="回到最新">最新</button>
          <button class="chart-float-close" title="关闭">×</button>
        </span>
      </div>
      <div class="chart-float-tabs">
        <button data-tab="live" class="active">实时曲线</button>
        <button data-tab="textbook">教材图像</button>
      </div>
      <div class="chart-float-body">
        <div class="chart-tab-pane active" data-tab="live">
          <div class="chart-float-chart-wrap"><canvas id="float-tt-chart"></canvas></div>
        </div>
        <div class="chart-tab-pane" data-tab="textbook">
          <div class="textbook-chart-box">
            <h4>教材图像：一键切换</h4>
            <div class="chart-switcher">
              <button data-chart="melt-c" class="active">晶体熔化</button>
              <button data-chart="melt-a">非晶体熔化</button>
              <button data-chart="freeze-c">晶体凝固</button>
              <button data-chart="freeze-a">非晶体凝固</button>
            </div>
            <div id="textbook-chart-stage"></div>
          </div>
          <div class="segment-card" id="segment-card">
            <span class="close" onclick="this.parentElement.style.display='none'">×</span>
            <h5 id="seg-title">FG 段</h5>
            <p id="seg-temp">温度：保持不变</p>
            <p id="seg-heat">吸热 / 放热</p>
            <p id="seg-phase">状态：固液共存</p>
          </div>
        </div>
      </div>
      <div class="chart-float-resizer" title="拖动调整大小">⋮⋮</div>
    </div>

    <div class="bottom-controls">
      <button class="btn primary" id="btn-pause">开始</button>
      <button class="btn" id="btn-reset">重置</button>
      <button class="btn" id="btn-mute">🔊</button>
    </div>
    <div class="hint">左侧调参数 · 右侧看曲线 · 空白处拖动旋转视角 · 滚轮/双指缩放</div>
    <div id="phase-toast"></div>
    <div id="chart-tooltip"></div>
  </div>
</div>
<script src="three.min.js"></script>
<script src="exp-melt-audio.js?v=r9"></script>
<script src="exp-melt-core.js?v=r13"></script>
<script src="exp-melt-chart.js?v=r13"></script>
<script src="exp-melt.js?v=r13"></script>
</body>
</html>
