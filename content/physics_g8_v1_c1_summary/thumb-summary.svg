<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfefe"/><stop offset="1" stop-color="#dde7f0"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffef9"/><stop offset="1" stop-color="#f4efe1"/>
    </linearGradient>
  </defs>

  <!-- 亮底渐变 -->
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- 桌面投影 -->
  <ellipse cx="320" cy="326" rx="252" ry="16" fill="#8aa0b6" opacity="0.18"/>

  <!-- 摊开笔记本 -->
  <g>
    <!-- 封底衬纸 -->
    <rect x="82" y="66" width="476" height="248" rx="10" fill="#b9895a"/>
    <rect x="82" y="66" width="476" height="10" rx="5" fill="#caa070"/>
    <!-- 左页 -->
    <path d="M96 76 H310 Q318 76 318 84 V296 Q318 304 310 304 H96 Q88 304 88 296 V84 Q88 76 96 76 Z" fill="url(#page)" stroke="#d8d0bc" stroke-width="1.5"/>
    <!-- 右页 -->
    <path d="M330 76 H544 Q552 76 552 84 V296 Q552 304 544 304 H330 Q322 304 322 296 V84 Q322 76 330 76 Z" fill="url(#page)" stroke="#d8d0bc" stroke-width="1.5"/>
    <!-- 中缝阴影 -->
    <rect x="314" y="78" width="12" height="224" fill="#e7dfcb" opacity="0.9"/>
    <!-- 线圈装订 -->
    <g stroke="#7d8794" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M312 96 q8 -5 16 0"/><path d="M312 126 q8 -5 16 0"/>
      <path d="M312 156 q8 -5 16 0"/><path d="M312 186 q8 -5 16 0"/>
      <path d="M312 216 q8 -5 16 0"/><path d="M312 246 q8 -5 16 0"/>
      <path d="M312 276 q8 -5 16 0"/>
    </g>
    <!-- 左页淡格线 -->
    <g stroke="#c9d6e2" stroke-width="1" opacity="0.7">
      <line x1="104" y1="120" x2="304" y2="120"/><line x1="104" y1="252" x2="304" y2="252"/>
    </g>
  </g>

  <!-- 左页：刻度尺手绘线稿 -->
  <g transform="rotate(-2 200 180)">
    <rect x="108" y="160" width="196" height="40" rx="4" fill="#fffdf3" stroke="#3d4f66" stroke-width="2.2"/>
    <g stroke="#3d4f66" stroke-width="2">
      <line x1="124" y1="160" x2="124" y2="180"/><line x1="160" y1="160" x2="160" y2="180"/>
      <line x1="196" y1="160" x2="196" y2="180"/><line x1="232" y1="160" x2="232" y2="180"/>
      <line x1="268" y1="160" x2="268" y2="180"/>
    </g>
    <g stroke="#5a6b80" stroke-width="1.3">
      <line x1="131.2" y1="160" x2="131.2" y2="170"/><line x1="138.4" y1="160" x2="138.4" y2="170"/>
      <line x1="145.6" y1="160" x2="145.6" y2="170"/><line x1="152.8" y1="160" x2="152.8" y2="170"/>
      <line x1="167.2" y1="160" x2="167.2" y2="170"/><line x1="174.4" y1="160" x2="174.4" y2="170"/>
      <line x1="181.6" y1="160" x2="181.6" y2="170"/><line x1="188.8" y1="160" x2="188.8" y2="170"/>
    </g>
    <g font-family="'PingFang SC',Helvetica,sans-serif" font-size="12" fill="#3d4f66" text-anchor="middle">
      <text x="124" y="195">0</text><text x="160" y="195">1</text><text x="196" y="195">2</text>
      <text x="232" y="195">3</text><text x="268" y="195">4</text>
    </g>
    <text x="286" y="178" font-family="'PingFang SC',Helvetica,sans-serif" font-size="12" fill="#5a6b80">cm</text>
    <!-- 手写读数标注 -->
    <path d="M160 214 v16 M232 214 v16 M160 226 h72" stroke="#c0392b" stroke-width="2" fill="none"/>
    <text x="196" y="248" font-family="'PingFang SC',Helvetica,sans-serif" font-size="15" font-weight="700" fill="#c0392b" text-anchor="middle">L = 2.50 cm</text>
  </g>
  <!-- 左页手写标题 -->
  <text x="112" y="108" font-family="'PingFang SC',Helvetica,sans-serif" font-size="19" font-weight="700" fill="#33506b">长度测量 · 刻度尺</text>
  <path d="M112 116 q60 5 132 1" stroke="#33506b" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- 右页：停表手绘线稿 -->
  <g>
    <rect x="416" y="86" width="16" height="14" rx="4" fill="#fffdf3" stroke="#3d4f66" stroke-width="2.2"/>
    <line x1="452" y1="96" x2="462" y2="88" stroke="#3d4f66" stroke-width="2.2"/>
    <circle cx="424" cy="180" r="56" fill="#fffdf3" stroke="#3d4f66" stroke-width="2.6"/>
    <circle cx="424" cy="180" r="47" fill="none" stroke="#5a6b80" stroke-width="1.4"/>
    <!-- 表盘刻度 -->
    <g stroke="#3d4f66" stroke-width="2">
      <line x1="424" y1="133" x2="424" y2="143"/><line x1="424" y1="217" x2="424" y2="227"/>
      <line x1="377" y1="180" x2="387" y2="180"/><line x1="461" y1="180" x2="471" y2="180"/>
    </g>
    <!-- 指针 -->
    <line x1="424" y1="180" x2="424" y2="146" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
    <line x1="424" y1="180" x2="450" y2="196" stroke="#3d4f66" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="424" cy="180" r="4" fill="#3d4f66"/>
    <!-- 小表盘 -->
    <circle cx="424" cy="204" r="12" fill="none" stroke="#5a6b80" stroke-width="1.4"/>
    <line x1="424" y1="204" x2="424" y2="196" stroke="#3d4f66" stroke-width="1.6"/>
    <text x="424" y="104" font-family="'PingFang SC',Helvetica,sans-serif" font-size="17" font-weight="700" fill="#33506b" text-anchor="middle">时间测量 · 停表</text>
  </g>
  <!-- 右页手写读数 -->
  <g font-family="'PingFang SC',Helvetica,sans-serif" fill="#3d4f66">
    <text x="352" y="266" font-size="15" font-weight="700" fill="#c0392b">t = 3 min 40 s</text>
    <path d="M352 282 q66 5 130 1" stroke="#5a6b80" stroke-width="1.6" fill="none" opacity="0.7"/>
    <path d="M352 292 q50 4 96 1" stroke="#5a6b80" stroke-width="1.6" fill="none" opacity="0.5"/>
  </g>
</svg>
