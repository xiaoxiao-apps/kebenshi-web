<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- c1 本章小结缩略图：知识清单卡+刻度尺/秒表/v=s/t 公式牌（原创矢量） -->
  <defs>
    <linearGradient id="bgS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#e8f0f8"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bgS)"/>
  <!-- 知识清单卡 -->
  <rect x="60" y="72" width="330" height="216" rx="18" fill="#ffffff" stroke="#dbe4ee" stroke-width="2"/>
  <rect x="60" y="72" width="330" height="52" rx="18" fill="#2563eb"/>
  <rect x="60" y="106" width="330" height="18" fill="#2563eb"/>
  <text x="225" y="106" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="sans-serif">📋 本章小结</text>
  <!-- 清单行：勾+文字条 -->
  <g font-family="sans-serif">
    <circle cx="96" cy="164" r="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <path d="M91 164 l4 4 l7 -8" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <text x="118" y="170" font-size="17" fill="#334155">长度 · 刻度尺 · 单位换算</text>
    <circle cx="96" cy="208" r="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <path d="M91 208 l4 4 l7 -8" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <text x="118" y="214" font-size="17" fill="#334155">时间 · 秒表 · 停表读数</text>
    <circle cx="96" cy="252" r="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <path d="M91 252 l4 4 l7 -8" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <text x="118" y="258" font-size="17" fill="#334155">速度 v=s/t · 匀速直线</text>
  </g>
  <!-- 右上：v=s/t 公式牌 -->
  <g>
    <rect x="452" y="88" width="140" height="48" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="522" y="120" font-size="22" font-weight="bold" fill="#92400e" text-anchor="middle" font-family="sans-serif">v = s/t</text>
  </g>
  <!-- 右中：刻度尺 -->
  <g>
    <rect x="440" y="168" width="180" height="34" rx="4" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
    <g stroke="#b45309" stroke-width="1.5">
      <line x1="452" y1="170" x2="452" y2="184"/><line x1="467" y1="170" x2="467" y2="178"/>
      <line x1="482" y1="170" x2="482" y2="184"/><line x1="497" y1="170" x2="497" y2="178"/>
      <line x1="512" y1="170" x2="512" y2="184"/><line x1="527" y1="170" x2="527" y2="178"/>
      <line x1="542" y1="170" x2="542" y2="184"/><line x1="557" y1="170" x2="557" y2="178"/>
      <line x1="572" y1="170" x2="572" y2="184"/><line x1="587" y1="170" x2="587" y2="178"/>
      <line x1="602" y1="170" x2="602" y2="184"/>
    </g>
    <g font-size="10" fill="#92400e" text-anchor="middle" font-family="sans-serif">
      <text x="452" y="197">0</text><text x="482" y="197">1</text><text x="512" y="197">2</text>
      <text x="542" y="197">3</text><text x="572" y="197">4</text><text x="602" y="197">5</text>
    </g>
    <text x="614" y="197" font-size="10" fill="#92400e" font-family="sans-serif">cm</text>
  </g>
  <!-- 右下：秒表 -->
  <g>
    <rect x="524" y="216" width="12" height="10" rx="2" fill="#475569"/>
    <circle cx="530" cy="262" r="36" fill="#ffffff" stroke="#475569" stroke-width="4"/>
    <line x1="530" y1="262" x2="530" y2="238" stroke="#475569" stroke-width="3"/>
    <line x1="530" y1="262" x2="549" y2="272" stroke="#dc2626" stroke-width="2.5"/>
    <circle cx="530" cy="262" r="3" fill="#475569"/>
    <g stroke="#94a3b8" stroke-width="2">
      <line x1="530" y1="230" x2="530" y2="236"/><line x1="562" y1="262" x2="556" y2="262"/>
      <line x1="530" y1="294" x2="530" y2="288"/><line x1="498" y1="262" x2="504" y2="262"/>
    </g>
    <text x="580" y="302" font-size="14" fill="#64748b" font-family="sans-serif">停表读数</text>
  </g>
  <text x="320" y="44" font-size="26" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="sans-serif">第一章「机械运动」知识速记</text>
  <text x="320" y="330" font-size="16" fill="#64748b" text-anchor="middle" font-family="sans-serif">纯概念零题目 · 配套题目见本章练习</text>
</svg>
