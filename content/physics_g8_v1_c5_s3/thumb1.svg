<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#101a2e"/><stop offset="100%" stop-color="#0a1220"/></linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#6a9ce0"/><stop offset="50%" stop-color="#4d7fd0"/><stop offset="100%" stop-color="#3b6bb8"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>
  <line x1="0" y1="100" x2="320" y2="100" stroke="#5b6b84" stroke-width="1" stroke-dasharray="10 4 2 4" opacity=".8"/>
  <!-- 光具座滑轨 -->
  <rect x="14" y="128" width="292" height="7" rx="2" fill="#4a5568" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="52" y="120" width="16" height="10" rx="2" fill="#6b737c" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="152" y="120" width="16" height="10" rx="2" fill="#6b737c" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="248" y="120" width="16" height="10" rx="2" fill="#6b737c" stroke="#1a1a1a" stroke-width="1"/>
  <!-- F 光源（物，左区） -->
  <rect x="56" y="112" width="8" height="10" fill="#9aa0a8" stroke="#1a1a1a" stroke-width="1"/>
  <g filter="url(#glow)" stroke="#ffd166" stroke-width="3" fill="none">
    <path d="M52 74 h14 M52 74 v26 M52 86 h10"/>
  </g>
  <!-- 凸透镜（中） -->
  <path d="M160 52 C148 70 148 118 160 132 C172 118 172 70 160 52 Z" fill="url(#lens)" stroke="#1a1a1a" stroke-width="1.5" opacity=".95"/>
  <rect x="157" y="110" width="6" height="12" fill="#6b737c" stroke="#1a1a1a" stroke-width="1"/>
  <!-- 光屏（右区）+ 倒立缩小实像 -->
  <rect x="252" y="66" width="5" height="46" rx="1" fill="#e2e8f0" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="253" y="112" width="3" height="10" fill="#9aa0a8" stroke="#1a1a1a" stroke-width="1"/>
  <g stroke="#ff9f43" stroke-width="2.4" fill="none" opacity=".95">
    <path d="M259 104 h-8 M259 104 v-14 M259 97 h-6"/>
  </g>
  <!-- 光线 -->
  <g filter="url(#glow)" stroke="#ff3b30" stroke-width="1.6" opacity=".9">
    <line x1="66" y1="74" x2="156" y2="74"/>
    <line x1="156" y1="74" x2="254" y2="104"/>
    <line x1="66" y1="100" x2="156" y2="100"/>
    <line x1="156" y1="100" x2="254" y2="100"/>
  </g>
  <!-- 三区刻度点 F/2F -->
  <circle cx="112" cy="100" r="2.6" fill="#ffd166"/><circle cx="208" cy="100" r="2.6" fill="#ffd166"/>
  <text x="112" y="146" text-anchor="middle" font-size="10" fill="#9fb4d4" font-family="Arial,sans-serif">2F</text>
  <text x="208" y="146" text-anchor="middle" font-size="10" fill="#9fb4d4" font-family="Arial,sans-serif">2F</text>
  <text x="160" y="166" text-anchor="middle" font-size="12" fill="#c7d4e8" font-family="Arial,sans-serif">光具座 · 成像规律</text>
</svg>
