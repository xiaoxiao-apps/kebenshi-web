<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store">
<meta http-equiv="Pragma" content="no-cache">
<title>凸透镜的三大仪器 — 生活中的透镜</title>
<link rel="stylesheet" href="../_lib/guide/guide-core.css?v=20261028v2">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Yuanti SC","YouYuan","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f2ec;color:#3d3830;overflow:hidden}
  header{position:fixed;top:0;left:0;right:0;height:34px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f5f2ec;border-bottom:1px solid rgba(0,0,0,0.12);z-index:10}
  .back{font-size:13px;color:#2563eb;text-decoration:none;white-space:nowrap}
  .back:hover{text-decoration:underline}
  .title{font-size:13px;font-weight:600;color:#2b2620;white-space:nowrap}
  .scene-wrap{position:fixed;top:34px;left:0;right:0;bottom:0}
  canvas#scene{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
  .ctrlbar{position:fixed;left:0;right:0;bottom:0;min-height:96px;background:linear-gradient(to top,rgba(238,233,224,.80),rgba(238,233,224,.44) 70%,rgba(238,233,224,0));pointer-events:none;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:stretch;gap:6px;padding:8px 12px;font-family:"Yuanti SC","YouYuan","PingFang SC","Microsoft YaHei",sans-serif;z-index:20}
  .ctrlbar>*{pointer-events:auto}
  .group{display:flex;flex-direction:column;gap:4px;background:rgba(255,255,255,.86);border:1px solid #ddd5c4;border-radius:10px;padding:5px 9px}
  .glabel{font-size:14px;color:#8a7c66;white-space:nowrap;letter-spacing:.5px;line-height:1}
  .gctrl{display:flex;align-items:center;gap:6px;flex:1;min-height:40px}
  .gctrl label{font-size:14px;cursor:pointer;white-space:nowrap;color:#3d3830}
  button{border:0;border-radius:8px;padding:9px 13px;font-size:15px;font-family:inherit;cursor:pointer;background:#2563eb;color:#fff;transition:background .15s;white-space:nowrap}
  button:hover{background:#1d4ed8}
  button.secondary{background:#6b7280}
  button.secondary:hover{background:#4b5563}
  button:disabled{opacity:.35;cursor:default}
  button#btn-sc1,button#btn-sc2,button#btn-sc3,button#btn-rays,button#btn-labels,button#btn-panel,button#btn-flip{border:1px solid #94a3b8;background:linear-gradient(#fdfefe,#dbe4ee);color:#334155;box-shadow:0 2px 3px rgba(30,41,59,.25);transition:all .12s}
  button#btn-sc1:hover,button#btn-sc2:hover,button#btn-sc3:hover,button#btn-rays:hover,button#btn-labels:hover,button#btn-panel:hover,button#btn-flip:hover{background:linear-gradient(#f8fafc,#d2deeb)}
  button#btn-sc1.on,button#btn-sc2.on,button#btn-sc3.on,button#btn-rays.on,button#btn-labels.on,button#btn-panel.on,button#btn-flip.on{background:#b9c7d6;border-color:#64748b;box-shadow:inset 0 2px 5px rgba(30,41,59,.35);transform:translateY(1px)}
  /* 小窗紧凑档（core resize 判定 H<600 加 .compact）：字号/内边距全缩，保卡单行 */
  .ctrlbar.compact .glabel{font-size:12px}
  .ctrlbar.compact .gctrl{min-height:32px}
  .ctrlbar.compact .gctrl label{font-size:12px}
  .ctrlbar.compact button{padding:5px 7px;font-size:13px}
  .rec-panel{display:none;position:absolute;top:12px;left:12px;min-width:420px;background:rgba(255,255,255,0.45);border-radius:16px;padding:16px 20px;z-index:15;line-height:1.7;letter-spacing:.02em}
  /* F12 窄屏分级响应（参照 c6s3 dockTable）：≤560px 取消 420px 硬下限，改 92vw，防横向溢出 */
  @media(max-width:560px){.rec-panel{min-width:auto;width:92vw}}
  .rec-panel.show{display:block}
  .rec-panel .rp-title{font-size:22px;font-weight:600;color:#b45309;margin-bottom:10px;font-family:"Yuanti SC","YouYuan","PingFang SC","Microsoft YaHei",sans-serif}
  table.rec{border-collapse:collapse;font-size:16px;background:transparent;width:100%}
  table.rec th,table.rec td{border:none;border-bottom:1px solid rgba(0,0,0,.08);padding:9px 13px;text-align:left;white-space:nowrap;color:#1e293b}
  table.rec th{background:transparent;font-weight:400;width:128px;color:#64748b}
  table.rec td{font-weight:600}
  html.pseudo-fs{width:100%;height:100%}
  html.pseudo-fs body{position:fixed;top:0;left:0;right:0;bottom:0;width:100vw;height:100vh;z-index:2147483000;overflow:hidden}
</style>
</head>
<body>
<header>
  <div class="title">生活中的透镜 · 凸透镜的三大仪器</div>
  <a class="back" href="./index.html">← 返回实验卡页</a>
</header>
<div class="scene-wrap">
<canvas id="scene"></canvas>
<div class="rec-panel" id="panel-read">
  <div class="rp-title">读数面板</div>
  <table class="rec"><tbody>
    <tr><th>物距 u</th><td id="pr-u">—</td></tr>
    <tr><th>筒距 v筒</th><td id="pr-v">—</td></tr>
    <tr><th>像的性质</th><td id="pr-nat">—</td></tr>
    <tr><th>实像标签</th><td id="pr-note">实像=光实际会聚、薄膜能承接</td></tr>
  </tbody></table>
</div>
</div>
<div class="ctrlbar">
  <div class="group" id="grp-act">
    <div class="glabel">场景</div>
    <div class="gctrl">
      <button id="btn-sc1" class="on">📷 照相机</button>
      <button id="btn-sc2">📽️ 投影仪</button>
      <button id="btn-sc3">🔍 放大镜</button>
      <label id="lbl-camf" style="display:flex;align-items:center;gap:5px;margin-left:6px">筒距（像距）<input type="range" id="rng-camf" min="9" max="15" step="0.1" value="13" style="width:88px;accent-color:#2563eb;cursor:pointer"></label>
    </div>
  </div>
  <div class="group" id="grp-act2" style="display:none">
    <div class="glabel">动作</div>
    <div class="gctrl">
      <button id="btn-flip">倒插投影片</button>
      <label id="lbl-pf" style="display:flex;align-items:center;gap:5px;margin-left:6px">调焦<input type="range" id="rng-pf" min="7" max="9.5" step="0.1" value="8" style="width:88px;accent-color:#2563eb;cursor:pointer"></label>
    </div>
  </div>
  <div class="group" id="grp-show">
    <div class="glabel">显示</div>
    <div class="gctrl">
      <button id="btn-rays" class="on">光路光线</button>
      <button id="btn-labels">标注</button>
    </div>
  </div>
  <div class="group" id="grp-sys">
    <div class="glabel">系统</div>
    <div class="gctrl">
      <button id="btn-panel">读数面板</button>
      <button id="btn-reset" class="secondary">重置</button>
      <button id="btn-mute">🔊</button>
      <button id="btn-full" class="secondary">全屏</button>
    </div>
  </div>
</div>
<script src="../_lib/v1/props.js?v=20261024"></script>
<script src="../_lib/v1/props-optics.js?v=20261024"></script>
<script src="../_lib/v1/sfx.js?v=20261024"></script>
<script src="exp-lens-life-core.js?v=20261029v2"></script>
<div id="guide-layer"><!-- 语音讲解层容器：内容由 _lib/guide/vB-core.js 运行时注入 --></div>
<script>window.GUIDE_CFG={state:window.C5S2_STATE,get mode(){return window.C5S2_STATE.scene;}};</script>
<script src="guide/guide-data.js?v=20261029v4"></script>
<script src="../_lib/guide/engine-core.js?v=20261028v13"></script>
<script src="../_lib/guide/vB-core.js?v=20261028v5"></script>
</body>
</html>
