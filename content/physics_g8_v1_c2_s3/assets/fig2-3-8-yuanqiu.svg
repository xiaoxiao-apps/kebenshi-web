<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280">
  <!-- 圜丘示意图（自绘 flat 图标风）：左=俯视三层圆坛+栏板，右=立面三层台体 -->
  <rect x="0" y="0" width="1000" height="280" fill="#faf8f5"/>

  <!-- 分隔虚线 -->
  <line x1="500" y1="36" x2="500" y2="244" stroke="#e0d8c8" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- ===== 左：俯视 ===== -->
  <g>
    <!-- 第一层坛台 -->
    <circle cx="250" cy="132" r="118" fill="#f3efe8" stroke="#8b6914" stroke-width="3"/>
    <!-- 第一层栏板带：底色环 + 望柱(虚线环) + 内外沿 -->
    <circle cx="250" cy="132" r="111" fill="none" stroke="#e8dcc0" stroke-width="14"/>
    <circle cx="250" cy="132" r="111" fill="none" stroke="#c4a35a" stroke-width="14" stroke-dasharray="5 20"/>
    <circle cx="250" cy="132" r="118" fill="none" stroke="#8b6914" stroke-width="2"/>
    <circle cx="250" cy="132" r="104" fill="none" stroke="#8b6914" stroke-width="2"/>
    <!-- 第二层坛台 -->
    <circle cx="250" cy="132" r="82" fill="#f5ead0" stroke="#8b6914" stroke-width="2.5"/>
    <circle cx="250" cy="132" r="77" fill="none" stroke="#e8dcc0" stroke-width="8"/>
    <circle cx="250" cy="132" r="77" fill="none" stroke="#c4a35a" stroke-width="8" stroke-dasharray="4 15"/>
    <!-- 第三层坛台 -->
    <circle cx="250" cy="132" r="50" fill="#faf3e0" stroke="#8b6914" stroke-width="2.5"/>
    <circle cx="250" cy="132" r="46" fill="none" stroke="#e8dcc0" stroke-width="6"/>
    <circle cx="250" cy="132" r="46" fill="none" stroke="#c4a35a" stroke-width="6" stroke-dasharray="3 12"/>
    <!-- 天心石 -->
    <circle cx="250" cy="132" r="13" fill="#c4a35a" stroke="#8b6914" stroke-width="2"/>
    <text x="250" y="270" text-anchor="middle" font-size="14" fill="#5a5a5a" font-family="sans-serif">俯视：三层圆坛 · 周环栏板 · 中心天心石</text>
  </g>

  <!-- ===== 右：立面 ===== -->
  <g>
    <!-- 地面 -->
    <line x1="545" y1="237" x2="915" y2="237" stroke="#8a8a8a" stroke-width="3"/>
    <!-- 第一层 -->
    <rect x="565" y="196" width="330" height="40" rx="6" fill="#e8dcc0" stroke="#8b6914" stroke-width="2.5"/>
    <!-- 第一层栏板（两侧露出台沿） -->
    <line x1="569" y1="186" x2="601" y2="186" stroke="#c4a35a" stroke-width="3"/>
    <line x1="573" y1="196" x2="573" y2="185" stroke="#c4a35a" stroke-width="3"/>
    <line x1="586" y1="196" x2="586" y2="185" stroke="#c4a35a" stroke-width="3"/>
    <line x1="598" y1="196" x2="598" y2="185" stroke="#c4a35a" stroke-width="3"/>
    <line x1="759" y1="186" x2="791" y2="186" stroke="#c4a35a" stroke-width="3"/>
    <line x1="762" y1="196" x2="762" y2="185" stroke="#c4a35a" stroke-width="3"/>
    <line x1="775" y1="196" x2="775" y2="185" stroke="#c4a35a" stroke-width="3"/>
    <line x1="788" y1="196" x2="788" y2="185" stroke="#c4a35a" stroke-width="3"/>
    <!-- 第二层 -->
    <rect x="605" y="156" width="250" height="40" rx="6" fill="#f0e5c8" stroke="#8b6914" stroke-width="2.5"/>
    <line x1="609" y1="146" x2="641" y2="146" stroke="#c4a35a" stroke-width="3"/>
    <line x1="613" y1="156" x2="613" y2="145" stroke="#c4a35a" stroke-width="3"/>
    <line x1="626" y1="156" x2="626" y2="145" stroke="#c4a35a" stroke-width="3"/>
    <line x1="638" y1="156" x2="638" y2="145" stroke="#c4a35a" stroke-width="3"/>
    <line x1="719" y1="146" x2="751" y2="146" stroke="#c4a35a" stroke-width="3"/>
    <line x1="722" y1="156" x2="722" y2="145" stroke="#c4a35a" stroke-width="3"/>
    <line x1="735" y1="156" x2="735" y2="145" stroke="#c4a35a" stroke-width="3"/>
    <line x1="748" y1="156" x2="748" y2="145" stroke="#c4a35a" stroke-width="3"/>
    <!-- 第三层 -->
    <rect x="645" y="116" width="170" height="40" rx="6" fill="#f5ead0" stroke="#8b6914" stroke-width="2.5"/>
    <line x1="649" y1="106" x2="671" y2="106" stroke="#c4a35a" stroke-width="3"/>
    <line x1="653" y1="116" x2="653" y2="105" stroke="#c4a35a" stroke-width="3"/>
    <line x1="666" y1="116" x2="666" y2="105" stroke="#c4a35a" stroke-width="3"/>
    <line x1="789" y1="106" x2="811" y2="106" stroke="#c4a35a" stroke-width="3"/>
    <line x1="794" y1="116" x2="794" y2="105" stroke="#c4a35a" stroke-width="3"/>
    <line x1="807" y1="116" x2="807" y2="105" stroke="#c4a35a" stroke-width="3"/>
    <!-- 天心石（台面中心圆石） -->
    <ellipse cx="730" cy="114" rx="16" ry="4.5" fill="#c4a35a" stroke="#8b6914" stroke-width="1.5"/>
    <!-- 声波反射示意：中心发声 → 栏板/台面折回中心 -->
    <path d="M724 98 C 700 42, 626 58, 620 138" fill="none" stroke="#2980b9" stroke-width="2.5" stroke-dasharray="7 6"/>
    <polygon points="620,146 614,132 626,133" fill="#2980b9"/>
    <path d="M736 98 C 760 42, 834 58, 840 138" fill="none" stroke="#2980b9" stroke-width="2.5" stroke-dasharray="7 6"/>
    <polygon points="840,146 834,133 846,132" fill="#2980b9"/>
    <text x="730" y="270" text-anchor="middle" font-size="14" fill="#5a5a5a" font-family="sans-serif">立面：第三层台面高出地面约 5 m，声波折返聚回台心</text>
  </g>
</svg>
