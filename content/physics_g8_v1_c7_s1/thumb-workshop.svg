<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- c7s1「力的探究工坊」缩略图（原创矢量，浅色亮底；主视觉=门+力的示意图箭头+工作台，左右点缀形变/运动两站；禁抄 PhET） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf9f4"/><stop offset="1" stop-color="#eef4fa"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5a25d"/><stop offset="1" stop-color="#c96f26"/>
    </linearGradient>
    <linearGradient id="ball" x1="0.3" y1="0.2" x2="0.8" y2="1">
      <stop offset="0" stop-color="#e8ecf1"/><stop offset="0.5" stop-color="#aab3bd"/><stop offset="1" stop-color="#5f6a76"/>
    </linearGradient>
    <linearGradient id="doorw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0b980"/><stop offset="1" stop-color="#c1904f"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- 标题 -->
  <text x="320" y="46" font-size="30" font-weight="bold" fill="#334155" text-anchor="middle" font-family="sans-serif">力的探究工坊</text>
  <text x="320" y="72" font-size="15" fill="#64748b" text-anchor="middle" font-family="sans-serif">一张工作台 · 三个站点：效果 · 三要素 · 相互</text>

  <!-- 工作台（桌面亮带 + 木质前脸） -->
  <rect x="0" y="252" width="640" height="108" fill="#c99a5e"/>
  <rect x="0" y="252" width="640" height="24" fill="#dceefb"/>
  <rect x="0" y="274" width="640" height="4" fill="#f6ecd4"/>

  <!-- 左站：橡皮泥 + 手指按压（形变） -->
  <path d="M50 252 C50 216 68 202 88 208 C95 219 113 219 120 208 C138 202 128 216 128 252 Z" fill="url(#clay)" stroke="#a05f20" stroke-width="2"/>
  <path d="M92 138 L92 196 Q92 210 85 213" fill="none" stroke="#c99b6e" stroke-width="15" stroke-linecap="round"/>
  <circle cx="86" cy="214" r="8.5" fill="#f0c9a0" stroke="#d8a878" stroke-width="1"/>

  <!-- 中站（主视觉）：门 + 力的示意图箭头（三要素 / 示意图） -->
  <!-- 门扇 -->
  <rect x="180" y="96" width="120" height="156" rx="3" fill="url(#doorw)" stroke="#7a5c30" stroke-width="2.5"/>
  <rect x="193" y="110" width="94" height="128" rx="2" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
  <!-- 合页（左侧=门轴） -->
  <rect x="175" y="118" width="9" height="17" rx="2" fill="#5b6068"/>
  <rect x="175" y="214" width="9" height="17" rx="2" fill="#5b6068"/>
  <!-- 门把手（作用点，远离门轴） -->
  <circle cx="288" cy="176" r="6.5" fill="#e6cf8c" stroke="#8a6a3a" stroke-width="1.5"/>
  <!-- 开门摆动虚线弧 -->
  <path d="M300 250 A120 120 0 0 0 274 150" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="7 6"/>
  <!-- 力的示意图箭头：起点在门边作用点、垂直门面（最省力）、标 F -->
  <line x1="288" y1="176" x2="366" y2="176" stroke="#e03131" stroke-width="5" stroke-linecap="round"/>
  <path d="M378 176 L360 167 L360 185 Z" fill="#e03131"/>
  <circle cx="288" cy="176" r="4" fill="#e03131"/>
  <text x="330" y="164" font-size="17" font-weight="bold" fill="#e03131" text-anchor="middle" font-family="sans-serif">F</text>
  <text x="240" y="268" font-size="12" fill="#8a6a3a" text-anchor="middle" font-family="sans-serif">作用点 · 方向 · 大小</text>

  <!-- 右站：磁体 + 小铁球（运动状态改变） -->
  <circle cx="432" cy="230" r="16" fill="url(#ball)" stroke="#4a545e" stroke-width="1.5"/>
  <ellipse cx="426" cy="223" rx="4" ry="2.4" fill="rgba(255,255,255,.8)"/>
  <rect x="492" y="212" width="42" height="30" rx="5" fill="#4267c9" stroke="#3f4650" stroke-width="1.5"/>
  <rect x="534" y="212" width="42" height="30" rx="5" fill="#cf4a43" stroke="#3f4650" stroke-width="1.5"/>
  <text x="513" y="233" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle" font-family="sans-serif">S</text>
  <text x="555" y="233" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle" font-family="sans-serif">N</text>
  <path d="M448 234 q22 8 42 -6" fill="none" stroke="#e0655a" stroke-width="2.5" stroke-dasharray="6 5"/>
  <path d="M490 226 L482 221 L482 232 Z" fill="#e0655a"/>
</svg>
