<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;-webkit-tap-highlight-color:transparent}
  body{font-family:"Yuanti SC","YouYuan","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f2ec;color:#3d3830;overflow:hidden}
  header{position:fixed;top:0;left:0;right:0;height:34px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f5f2ec;border-bottom:1px solid rgba(0,0,0,0.12);z-index:10}
  .back{font-size:13px;color:#2563eb;text-decoration:none;white-space:nowrap}
  .back:hover{text-decoration:underline}
  .title{font-size:13px;font-weight:600;color:#2b2620;white-space:nowrap}
  .sysgrp{display:flex;align-items:center;gap:6px}
  .sysgrp button{border:0;border-radius:8px;padding:4px 10px;font-size:13px;font-family:inherit;cursor:pointer;background:#2563eb;color:#fff;transition:background-color .15s,transform .15s,box-shadow .15s;white-space:nowrap}
  .sysgrp button:hover{background:#1d4ed8;transform:translateY(-1px)}
  .sysgrp button.secondary{background:#6b7280}
  .sysgrp button.secondary:hover{background:#4b5563}
  .scene-wrap{position:fixed;top:34px;left:0;right:0;bottom:0}
  canvas#scene{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:default;-webkit-user-select:none;user-select:none}
  /* R10 拖放状态机 cursor（§4.3）：运行时由 core setCursor() 切 canvas.style.cursor（grab/grabbing/pointer/default） */
  /* P1 加载遮罩（设计书§7.1）：背景=舞台底色暖白，.35s ease-out 淡出后 pointer-events:none */
  #load-mask{position:fixed;inset:0;z-index:50;background:#f3ead9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:1;transition:opacity .35s ease-out}
  #load-mask.hide{opacity:0;pointer-events:none}
  #load-mask .lm-title{font-size:17px;font-weight:700;color:#8a5a12;letter-spacing:2px}
  #load-mask .lm-spin{width:36px;height:36px;border-radius:50%;border:3px solid rgba(180,83,9,.18);border-top-color:#b45309;animation:lmSpin .8s linear infinite}
  @keyframes lmSpin{to{transform:rotate(360deg)}}
  html.pseudo-fs{width:100%;height:100%}
  html.pseudo-fs body{position:fixed;top:0;left:0;right:0;bottom:0;width:100vw;height:100vh;height:100dvh;z-index:2147483000;overflow:hidden}
  @media (pointer:coarse) and (hover:none){
    .sysgrp button{padding:4px 8px;font-size:12px}
  }
</style>
</head>

<header>
  <a class="back" href="./index.html">← 返回本节</a>

  <div class="sysgrp">
    <button id="btn-mute">🔊</button>
    <button id="btn-mass" class="secondary" title="R13 §3.12 切换胖/瘦质量（30~100kg），再互推看 v 比=质量反比">质量 胖80/瘦50</button>
    <button id="btn-reset" class="secondary">重置</button>
    <button id="btn-full" class="secondary">全屏</button>
  </div>
</header>
<div class="scene-wrap" id="scene-wrap">
<canvas id="scene"></canvas>
</div>
<div id="load-mask">
  <div class="lm-title">力的实验室</div>
  <div class="lm-spin"></div>
</div>
