<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 224">
  <rect width="400" height="224" fill="#e9eef4"/>
  <!-- 桌面 -->
  <rect x="0" y="198" width="400" height="26" fill="#b9905f"/>
  <rect x="0" y="198" width="400" height="5" fill="#c9a071"/>
  <!-- 铁架台（最大化） -->
  <rect x="146" y="188" width="116" height="11" rx="4" fill="#3d4653"/>
  <rect x="198" y="34" width="9" height="156" rx="3" fill="#55606e"/>
  <rect x="112" y="30" width="96" height="9" rx="4" fill="#55606e"/>
  <circle cx="203" cy="34" r="6" fill="#3d4653"/>
  <!-- helix 弹簧 -->
  <g fill="none" stroke="#8a949e" stroke-width="3.2">
    <ellipse cx="122" cy="48" rx="9" ry="4"/><ellipse cx="122" cy="57" rx="9" ry="4"/><ellipse cx="122" cy="66" rx="9" ry="4"/>
    <ellipse cx="122" cy="75" rx="9" ry="4"/><ellipse cx="122" cy="84" rx="9" ry="4"/><ellipse cx="122" cy="93" rx="9" ry="4"/>
    <ellipse cx="122" cy="102" rx="9" ry="4"/>
  </g>
  <line x1="122" y1="106" x2="122" y2="114" stroke="#55606e" stroke-width="2.5"/>
  <path d="M122 114 q6 4 0 8" fill="none" stroke="#55606e" stroke-width="2.5"/>
  <!-- 钩码 -->
  <rect x="110" y="122" width="24" height="12" rx="2" fill="#94a3b8" stroke="#6b7885" stroke-width="1.5"/>
  <rect x="110" y="135" width="24" height="12" rx="2" fill="#94a3b8" stroke="#6b7885" stroke-width="1.5"/>
  <!-- 双基准线 -->
  <line x1="88" y1="118" x2="176" y2="118" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="90" y="113" font-size="9" fill="#16a34a" font-family="sans-serif">回弹基准线</text>
  <line x1="88" y1="158" x2="176" y2="158" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="90" y="153" font-size="9" fill="#dc2626" font-family="sans-serif">弹性限度线</text>
  <!-- 标准条形测力计（全标识） -->
  <circle cx="300" cy="46" r="5" fill="none" stroke="#6b7885" stroke-width="2.5"/>
  <rect x="284" y="52" width="32" height="96" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="300" y="63" font-size="8" fill="#475569" text-anchor="middle" font-family="sans-serif">N</text>
  <g stroke="#6b7885" stroke-width="1.5">
    <line x1="288" y1="70" x2="296" y2="70"/><line x1="288" y1="86" x2="296" y2="86"/><line x1="288" y1="102" x2="296" y2="102"/>
    <line x1="288" y1="118" x2="296" y2="118"/><line x1="288" y1="134" x2="296" y2="134"/>
  </g>
  <line x1="286" y1="98" x2="314" y2="98" stroke="#dc2626" stroke-width="2.5"/>
  <text x="320" y="102" font-size="11" font-weight="700" fill="#dc2626" font-family="sans-serif">1.4N</text>
  <line x1="300" y1="148" x2="300" y2="158" stroke="#55606e" stroke-width="2.5"/>
  <path d="M300 158 q6 4 0 8" fill="none" stroke="#55606e" stroke-width="2.5"/>
  <!-- ΔL–F 曲线小面板 -->
  <rect x="330" y="24" width="62" height="46" rx="4" fill="#ffffff" stroke="#d5dbe3" stroke-width="1.5"/>
  <line x1="338" y1="30" x2="338" y2="62" stroke="#475569" stroke-width="1.5"/>
  <line x1="338" y1="62" x2="386" y2="62" stroke="#475569" stroke-width="1.5"/>
  <polyline points="340,60 352,52 364,44 376,36" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="344" y="34" font-size="8" fill="#475569" font-family="sans-serif">ΔL–F</text>
</svg>
