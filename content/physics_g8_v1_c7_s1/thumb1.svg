<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- c7s1 力：橡皮泥+手指 / 水平弹簧 / 磁体吸球（原创矢量，禁抄 PhET） -->
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf9f4"/><stop offset="1" stop-color="#eef4fa"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5a25d"/><stop offset="1" stop-color="#c96f26"/>
    </linearGradient>
    <linearGradient id="ball" x1="0.3" y1="0.2" x2="0.8" y2="1">
      <stop offset="0" stop-color="#e8ecf1"/><stop offset="0.5" stop-color="#aab3bd"/><stop offset="1" stop-color="#5f6a76"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg1)"/>
  <rect x="0" y="252" width="640" height="108" fill="#c99a5e"/>
  <rect x="0" y="252" width="640" height="26" fill="#dceefb"/>
  <!-- 橡皮泥（带凹坑） -->
  <path d="M70 252 C70 208 92 190 116 196 C124 210 148 210 156 196 C180 190 202 208 202 252 Z" fill="url(#clay)" stroke="#a05f20" stroke-width="2"/>
  <!-- 手指按压 -->
  <g stroke="#e0b48c" stroke-width="1.5">
    <path d="M136 120 L136 176 Q136 192 128 196" fill="none" stroke="#c99b6e" stroke-width="16" stroke-linecap="round"/>
    <circle cx="129" cy="198" r="9" fill="#f0c9a0"/>
  </g>
  <!-- 水平弹簧 -->
  <rect x="244" y="176" width="12" height="76" rx="3" fill="#b6bcc6" stroke="#6b7280"/>
  <path d="M262 214 q10 -16 20 0 q10 16 20 0 q10 -16 20 0 q10 16 20 0 q10 -16 20 0 q10 16 20 0 q10 -16 20 0" fill="none" stroke="#5b6068" stroke-width="5" stroke-linecap="round"/>
  <circle cx="428" cy="214" r="8" fill="none" stroke="#4b5563" stroke-width="4"/>
  <path d="M444 214 L482 214" stroke="#e03131" stroke-width="5" stroke-linecap="round"/>
  <path d="M482 214 L470 207 L470 221 Z" fill="#e03131"/>
  <!-- 磁体吸小球 -->
  <g>
    <rect x="512" y="196" width="52" height="34" rx="6" fill="#4267c9" stroke="#3f4650"/>
    <rect x="564" y="196" width="52" height="34" rx="6" fill="#cf4a43" stroke="#3f4650"/>
    <text x="538" y="219" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="sans-serif">S</text>
    <text x="590" y="219" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="sans-serif">N</text>
  </g>
  <circle cx="480" cy="234" r="17" fill="url(#ball)" stroke="#4a545e" stroke-width="1.5"/>
  <ellipse cx="474" cy="227" rx="4" ry="2.4" fill="rgba(255,255,255,.8)"/>
  <path d="M480 268 q34 6 60 -14" fill="none" stroke="#e0655a" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="320" y="58" font-size="30" font-weight="bold" fill="#334155" text-anchor="middle" font-family="sans-serif">力的作用效果：形变 · 运动状态改变</text>
</svg>
