    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fdf7f4"/></linearGradient>
    <linearGradient id="boxg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3c08a"/><stop offset="1" stop-color="#c39a5f"/></linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- 答题纸 -->
  <rect x="118" y="52" width="404" height="256" rx="8" fill="url(#sheet)" stroke="#ecdcd6" stroke-width="2"/>
  <line x1="168" y1="52" x2="168" y2="308" stroke="#eaa9a9" stroke-width="2"/>
  <g stroke="#f0dcd6" stroke-width="2">
    <line x1="178" y1="100" x2="500" y2="100"/><line x1="178" y1="144" x2="500" y2="144"/>
    <line x1="178" y1="188" x2="500" y2="188"/><line x1="178" y1="232" x2="500" y2="232"/>
    <line x1="178" y1="276" x2="500" y2="276"/>
  </g>
  <g font-size="16" fill="#9aa3ad" font-family="sans-serif">
