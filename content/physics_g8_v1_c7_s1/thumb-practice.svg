  <path d="M330 224 l9 11 l17 -22" fill="none" stroke="#2e9e44" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 本章专属判分标记：受力示意 G=mg（第3题作答） -->
  <g>
    <line x1="196" y1="206" x2="292" y2="206" stroke="#9aa3ad" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="226" y="180" width="40" height="26" rx="4" fill="url(#boxg)" stroke="#9c7740" stroke-width="2"/>
    <line x1="246" y1="206" x2="246" y2="226" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <polygon points="246,232 241,222 251,222" fill="#dc2626"/>
    <text x="252" y="230" font-size="12" font-weight="700" fill="#dc2626" font-family="sans-serif">G</text>
    <line x1="266" y1="192" x2="288" y2="192" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <polygon points="294,192 284,187 284,197" fill="#2563eb"/>
    <text x="200" y="172" font-size="13" font-weight="700" fill="#a8402f" font-family="sans-serif">G = mg</text>
    <path d="M330 180 l9 11 l17 -22" fill="none" stroke="#2e9e44" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- 评分圈 -->
  <circle cx="466" cy="86" r="27" fill="none" stroke="#dc2626" stroke-width="3.5"/>
  <path d="M453 86 l10 12 l18 -24" fill="none" stroke="#2e9e44" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
