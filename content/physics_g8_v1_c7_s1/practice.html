<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>练习本 — 第7章 力</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"Yuanti SC","YouYuan","PingFang SC","Microsoft YaHei",sans-serif;background:#eef2f6;color:#28323d}
  /* 自定义滚动条 */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:#eef2f6}
  ::-webkit-scrollbar-thumb{background:#b9c7d6;border-radius:6px;border:2px solid #eef2f6}
  ::-webkit-scrollbar-thumb:hover{background:#94a3b8}
  html{scrollbar-width:thin;scrollbar-color:#b9c7d6 #eef2f6}
  header{position:sticky;top:0;height:38px;padding:0 12px;display:flex;align-items:center;gap:10px;background:#f7f9fb;border-bottom:1px solid rgba(0,0,0,.12);z-index:20}
  .title{font-size:13px;font-weight:700;color:#1f2933;white-space:nowrap}
  .back{font-size:13px;color:#2563eb;text-decoration:none;white-space:nowrap}
  .back:hover{text-decoration:underline}
  .spacer{flex:1}
  .score{font-size:13px;font-weight:700;color:#16a34a;font-variant-numeric:tabular-nums;white-space:nowrap}
  button{border:0;border-radius:8px;padding:7px 11px;font-size:13px;font-family:inherit;cursor:pointer;background:#2563eb;color:#fff;transition:background .15s,transform .1s;white-space:nowrap}
  button:hover{background:#1d4ed8}
  button:active{transform:translateY(1px)}
  button.secondary{background:#64748b}
  button.secondary:hover{background:#475569}
  .wrap{max-width:760px;margin:0 auto;padding:16px 14px 40px}
  .qcard{background:#fff;border:1px solid #d7dee6;border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 2px 6px rgba(20,30,45,.08)}
  .qhead{display:flex;gap:8px;align-items:baseline;margin-bottom:10px}
  .qnum{font-size:12px;font-weight:700;color:#1d4ed8;background:#dbeafe;border-radius:999px;padding:3px 9px;flex:none}
  .qtext{font-size:15px;font-weight:700;color:#1f2933;line-height:1.5}
  .opts{display:flex;flex-direction:column;gap:8px}
  button.opt{text-align:left;background:#f1f5f9;color:#334155;border:1px solid #d7dee6;padding:10px 12px;font-size:14px;white-space:normal;line-height:1.45}
  button.opt:hover{background:#e2e8f0}
  button.opt.right{background:#dcfce7;border-color:#16a34a;color:#14532d;font-weight:700}
  button.opt.wrong{background:#fee2e2;border-color:#dc2626;color:#7f1d1d}
  button.opt:disabled{cursor:default;opacity:.85}
  canvas.fig{display:block;width:100%;max-width:420px;margin:4px auto 10px;border-radius:10px;touch-action:manipulation}
  .fb{display:none;margin-top:10px;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.55}
  .fb.ok{display:block;background:#f0fdf4;border:1px solid #86efac;color:#14532d}
  .fb.bad{display:block;background:#fef2f2;border:1px solid #fca5a5;color:#7f1d1d}
  .done{display:none;text-align:center;background:#fff;border:1px solid #d7dee6;border-radius:14px;padding:20px;margin-bottom:16px}
  .done.show{display:block}
  .done .big{font-size:22px;font-weight:800;color:#16a34a}
  #loading{position:fixed;inset:0;background:#eef2f6;display:flex;align-items:center;justify-content:center;font-size:14px;color:#6b7885;z-index:50;transition:opacity .45s}
  #loading.fade{opacity:0;pointer-events:none}
  @media (max-width:640px){ .title{display:none} .wrap{padding:12px 10px 32px} .qtext{font-size:14px} }
</style>
</head>
<body>
<div id="loading">练习本加载中…</div>
<header>
  <a class="back" href="./index.html">← 返回本节</a>
  <span class="title">练习本 · 场景外考点</span>
  <span class="spacer"></span>
  <span class="score" id="score">答对 0 / 6</span>
  <button id="btn-retry" class="secondary">重做</button>
</header>
<div class="wrap">
  <div class="done" id="done"><div class="big" id="done-text"></div><div style="font-size:13px;color:#6b7885;margin-top:6px">对照解析查漏，或点右上「重做」再来一遍</div></div>
  <div id="quiz"></div>
</div>
<script src="practice-core.js?v=20261114"></script>
</body>
</html>
