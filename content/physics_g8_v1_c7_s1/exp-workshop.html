<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>力的探究工坊 — 力</title>
<link rel="stylesheet" href="../_lib/guide/guide-core.css?v=20261102v2">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;-webkit-tap-highlight-color:transparent}
  body{font-family:"Yuanti SC","YouYuan","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f2ec;color:#3d3830;overflow:hidden}
  header{position:fixed;top:0;left:0;right:0;height:34px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f5f2ec;border-bottom:1px solid rgba(0,0,0,0.12);z-index:10}
  .back{font-size:13px;color:#2563eb;text-decoration:none;white-space:nowrap}
  .back:hover{text-decoration:underline}
  .title{font-size:13px;font-weight:600;color:#2b2620;white-space:nowrap}
  .scene-wrap{position:fixed;top:34px;left:0;right:0;bottom:0}
  canvas#scene{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
  .ctrlbar{position:fixed;left:0;right:0;bottom:0;min-height:96px;background:linear-gradient(to top,rgba(238,233,224,.80),rgba(238,233,224,.44) 70%,rgba(238,233,224,0));pointer-events:none;display:flex;flex-wrap:nowrap;overflow-x:auto;justify-content:center;justify-content:safe center;align-items:stretch;gap:8px;padding:8px 12px;font-family:inherit;z-index:20}
  .ctrlbar>*{pointer-events:auto;flex:0 0 auto}
  .group{display:flex;flex-direction:column;gap:4px;background:rgba(255,255,255,.86);border:1px solid #ddd5c4;border-radius:10px;padding:5px 9px;transition:opacity .3s ease,transform .3s ease}
  .group.flyout{display:none}
  .glabel{font-size:14px;color:#8a7c66;white-space:nowrap;letter-spacing:.5px;line-height:1}
  .gctrl{display:flex;align-items:center;gap:6px;flex:1;min-height:40px}
  .gctrl label{font-size:14px;cursor:pointer;white-space:nowrap;color:#3d3830}
  button{border:0;border-radius:8px;padding:9px 13px;font-size:14px;font-family:inherit;cursor:pointer;background:#2563eb;color:#fff;transition:background .15s;white-space:nowrap}
  button:hover{background:#1d4ed8}
  button.secondary{background:#6b7280}
  button.secondary:hover{background:#4b5563}
  button:disabled{opacity:.35;cursor:default}
  button.scn,button.place,button.pick{border:1px solid #94a3b8;background:linear-gradient(#fdfefe,#dbe4ee);color:#334155;box-shadow:0 2px 3px rgba(30,41,59,.25);transition:all .12s;padding:7px 11px}
  button.scn:hover,button.place:hover,button.pick:hover{background:linear-gradient(#f8fafc,#d2deeb)}
  button.scn.on,button.place.on,button.pick.on{background:#b9c7d6;border-color:#64748b;box-shadow:inset 0 2px 5px rgba(30,41,59,.35);transform:translateY(1px)}
  input[type=range]{width:130px;accent-color:#d97706}
  .rlabel{font-size:15px;color:#854d0e;min-width:66px;text-align:right;font-variant-numeric:tabular-nums}
  .ctrlbar.compact .glabel{font-size:12px}
  .ctrlbar.compact .gctrl{min-height:32px}
  .ctrlbar.compact .gctrl label{font-size:12px}
  .ctrlbar.compact button{padding:5px 7px;font-size:13px}
  .ctrlbar.compact input[type=range]{width:96px}
  .ctrlbar.compact .rlabel{font-size:13px;min-width:0}
  :fullscreen .ctrlbar,html.pseudo-fs .ctrlbar{flex-wrap:nowrap;gap:6px;padding:6px 10px;overflow-x:auto}
  :fullscreen .ctrlbar .glabel,html.pseudo-fs .ctrlbar .glabel{font-size:11px}
  :fullscreen .ctrlbar button,html.pseudo-fs .ctrlbar button{padding:4px 8px;font-size:13px}
  :fullscreen .ctrlbar input[type=range],html.pseudo-fs .ctrlbar input[type=range]{width:110px}
  /* 幽灵化读数面板（pickSlot 选空位） */
  .rec-panel{display:none;position:absolute;width:fit-content;min-width:0;max-width:60vw;background:rgba(255,255,255,0.45);border-radius:16px;padding:10px 10px;font-size:14px;z-index:15;pointer-events:none}
  .rec-panel.show{display:block}
  .rec-panel .rp-title{font-size:15px;font-weight:600;color:#b45309;margin-bottom:8px}
  table.rec{border-collapse:collapse;font-size:14px;background:transparent;table-layout:auto}
  table.rec th,table.rec td{border:none;border-bottom:1px solid rgba(0,0,0,.08);padding:5px 9px;text-align:left;white-space:nowrap;color:#1e293b}
  table.rec th{background:transparent;font-weight:400;color:#64748b}
  table.rec td{font-weight:600}
  html.pseudo-fs{width:100%;height:100%}
  html.pseudo-fs body{position:fixed;top:0;left:0;right:0;bottom:0;width:100vw;height:100vh;height:100dvh;z-index:2147483000;overflow:hidden}
</style>
<style>
/* 触摸档控制栏单行化横滑（c6s2 K-单4a 同款） */
@media (pointer:coarse) and (hover:none){
.ctrlbar{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;justify-content:center;justify-content:safe center;align-items:stretch;height:auto;min-height:0;max-height:70px;padding-top:4px;padding-bottom:4px;scrollbar-width:none}
.ctrlbar::-webkit-scrollbar{display:none}
.ctrlbar>*{flex:0 0 auto}
.ctrlbar .group{padding:3px 8px}
.ctrlbar .glabel{font-size:10px}
.ctrlbar .gctrl{min-height:24px;gap:4px}
.ctrlbar .gctrl label{font-size:12px}
.ctrlbar button{padding:4px 7px;font-size:12px}
.ctrlbar input[type=range]{width:84px}
.ctrlbar .rlabel{font-size:12px}
}
</style>
</head>
<body>
<header>
  <div class="title">力 · 力的探究工坊</div>
  <a class="back" href="./index.html">← 返回本节</a>
</header>
<div class="scene-wrap">
<canvas id="scene"></canvas>
<div class="rec-panel" id="panel-read">
  <div class="rp-title">读数面板</div>
  <div id="sec-effect">
    <table class="rec"><tbody>
      <tr><th>按压力</th><td id="rd-press">—</td></tr>
      <tr><th>橡皮泥凹坑</th><td id="rd-dent">—</td></tr>
      <tr><th>弹簧形变</th><td id="rd-stretch">—</td></tr>
      <tr><th>松手后</th><td id="rd-after">—</td></tr>
      <tr><th>磁体放法</th><td id="rd-place">—</td></tr>
      <tr><th>小球速度</th><td id="rd-vel">—</td></tr>
      <tr><th>运动变化</th><td id="rd-change">—</td></tr>
    </tbody></table>
  </div>
  <div id="sec-door" style="display:none">
    <table class="rec"><tbody>
      <tr><th>作用点（离轴）</th><td id="rd-point">—</td></tr>
      <tr><th>方向（与门面夹角）</th><td id="rd-dir">—</td></tr>
      <tr><th>大小</th><td id="rd-size">—</td></tr>
      <tr><th>转动效果</th><td id="rd-eff">—</td></tr>
      <tr><th>门开度</th><td id="rd-open">—</td></tr>
    </tbody></table>
  </div>
  <div id="sec-draw" style="display:none">
    <table class="rec"><tbody>
      <tr><th>起点</th><td id="rd-d-start">—</td></tr>
      <tr><th>方向</th><td id="rd-d-dir">—</td></tr>
      <tr><th>线段长度</th><td id="rd-d-len">—</td></tr>
      <tr><th>标注</th><td id="rd-d-label">—</td></tr>
      <tr><th>判分</th><td id="rd-d-res">—</td></tr>
    </tbody></table>
  </div>
  <div id="sec-cart" style="display:none">
    <table class="rec"><tbody>
      <tr><th>左车速度</th><td id="rd-vl">—</td></tr>
      <tr><th>右车速度</th><td id="rd-vr">—</td></tr>
      <tr><th>状态</th><td id="rd-st">—</td></tr>
    </tbody></table>
  </div>
  <div id="sec-pull" style="display:none">
    <table class="rec"><tbody>
      <tr><th>左表读数</th><td id="rd-pl">—</td></tr>
      <tr><th>右表读数</th><td id="rd-pr">—</td></tr>
      <tr><th>两力关系</th><td id="rd-prel">—</td></tr>
      <tr><th>方向</th><td id="rd-pdir">—</td></tr>
    </tbody></table>
  </div>
</div>
</div>
<div class="ctrlbar">
  <div class="group" id="grp-scene">
    <div class="glabel">工坊站点</div>
    <div class="gctrl">
      <button id="btn-scene-effect" class="scn">🎯 效果舞台</button>
      <button id="btn-scene-elements" class="scn">🚪 推门工坊</button>
      <button id="btn-scene-mutual" class="scn">🤝 相互舞台</button>
    </div>
  </div>
  <div class="group" id="grp-a-press">
    <div class="glabel">按压力（橡皮泥）</div>
    <div class="gctrl">
      <input type="range" id="rng-press" min="0" max="100" step="1" value="0">
      <span class="rlabel" id="lbl-press">0 %</span>
    </div>
  </div>
  <div class="group" id="grp-a-spring">
    <div class="glabel">拉压弹簧</div>
    <div class="gctrl">
      <input type="range" id="rng-spring" min="-100" max="100" step="1" value="0">
      <span class="rlabel" id="lbl-spring">0 %</span>
    </div>
  </div>
  <div class="group" id="grp-a-rel">
    <div class="glabel">形变对比</div>
    <div class="gctrl">
      <button id="btn-release-a">松手</button>
    </div>
  </div>
  <div class="group" id="grp-b-place">
    <div class="glabel">磁体放法</div>
    <div class="gctrl">
      <button id="btn-place-near" class="place">静止旁靠近</button>
      <button id="btn-place-along" class="place">沿运动方向</button>
      <button id="btn-place-side" class="place">运动侧旁</button>
    </div>
  </div>
  <div class="group" id="grp-b-run">
    <div class="glabel">观察</div>
    <div class="gctrl">
      <button id="btn-release-b">释放</button>
      <button id="btn-reset-b" class="secondary">复位小球</button>
    </div>
  </div>
  <div class="group" id="grp-board">
    <div class="glabel">推门工坊</div>
    <div class="gctrl">
      <button id="btn-board-door" class="scn">🚪 推门</button>
      <button id="btn-board-draw" class="scn">📐 你来画</button>
    </div>
  </div>
  <div class="group" id="grp-e-point">
    <div class="glabel">作用点（离门轴远近）</div>
    <div class="gctrl">
      <input type="range" id="rng-point" min="5" max="100" step="1" value="75">
      <span class="rlabel" id="lbl-point">75 %</span>
    </div>
  </div>
  <div class="group" id="grp-e-dir">
    <div class="glabel">方向（角度盘）</div>
    <div class="gctrl">
      <input type="range" id="rng-dir" min="-90" max="90" step="1" value="0">
      <span class="rlabel" id="lbl-dir">90°</span>
    </div>
  </div>
  <div class="group" id="grp-e-size">
    <div class="glabel">大小</div>
    <div class="gctrl">
      <input type="range" id="rng-size" min="0" max="10" step="0.5" value="5">
      <span class="rlabel" id="lbl-size">5.0 N</span>
    </div>
  </div>
  <div class="group" id="grp-e-act">
    <div class="glabel">推门</div>
    <div class="gctrl">
      <button id="btn-push">开始推门</button>
      <button id="btn-close" class="secondary">关上门</button>
    </div>
  </div>
  <div class="group" id="grp-d-len">
    <div class="glabel">③ 线段长度（每格 1 N）</div>
    <div class="gctrl">
      <button id="btn-len-1" class="pick">1 格</button>
      <button id="btn-len-2" class="pick">2 格</button>
      <button id="btn-len-3" class="pick">3 格</button>
      <button id="btn-len-4" class="pick">4 格</button>
    </div>
  </div>
  <div class="group" id="grp-d-label">
    <div class="glabel">④ 标注</div>
    <div class="gctrl">
      <button id="btn-lab-f4n" class="pick">F=4N</button>
      <button id="btn-lab-4n" class="pick">4N</button>
      <button id="btn-lab-f" class="pick">F</button>
    </div>
  </div>
  <div class="group" id="grp-d-act">
    <div class="glabel">判分</div>
    <div class="gctrl">
      <button id="btn-draw-check">检查</button>
      <button id="btn-draw-clear" class="secondary">重画</button>
    </div>
  </div>
  <div class="group" id="grp-c-step">
    <div class="glabel">相互舞台</div>
    <div class="gctrl">
      <button id="btn-c-step1" class="scn">🚗 磁车对弹</button>
      <button id="btn-c-step2" class="scn">⚖ 测力计对拉</button>
    </div>
  </div>
  <div class="group" id="grp-c-run">
    <div class="glabel">相互作用</div>
    <div class="gctrl">
      <button id="btn-c-release">释放</button>
      <button id="btn-c-reset" class="secondary">复位小车</button>
    </div>
  </div>
  <div class="group" id="grp-p-run">
    <div class="glabel">对拉</div>
    <div class="gctrl">
      <button id="btn-p-relax" class="secondary">松手</button>
    </div>
  </div>
  <div class="group" id="grp-sys">
    <div class="glabel">系统</div>
    <div class="gctrl">
      <button id="btn-table">读数面板</button>
      <button id="btn-reset" class="secondary">重置</button>
      <button id="btn-mute">🔊</button>
      <button id="btn-full" class="secondary">全屏</button>
    </div>
  </div>
</div>
<div id="guide-layer"><!-- 语音讲解层容器：内容由 _lib/guide/vB-core.js 运行时注入 --></div>
<script src="../_lib/v1/props.js?v=20261104"></script>
<script src="../_lib/v1/props-mech.js?v=20261104"></script>
<script src="../_lib/v1/sfx.js?v=20261104"></script>
<script src="exp-workshop-core.js?v=20261106"></script>
<script src="guide/guide-data.js?v=20261106"></script>
<script>window.GUIDE_CFG={state:window.C7S1_STATE};/* 多场景页不设 mode key：引擎每帧轮询 R.mode（effect/elements/mutual） */window.GUIDE_DATA=window.C7S1_GUIDE;</script>
<script src="../_lib/guide/engine-core.js?v=20261028v13"></script>
<script src="../_lib/guide/vB-core.js?v=20261102v3"></script>
<script src="/content/_lib/mobile-guard.js?v=20261030v1" defer></script>
</body>
</html>
