<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdfbf5"/><stop offset="1" stop-color="#eaeff7"/></linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f7f9fd"/></linearGradient>
    <linearGradient id="lensg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfe3fb"/><stop offset="1" stop-color="#9dc4f0"/></linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- 摊开笔记本 -->
  <rect x="44" y="62" width="552" height="252" rx="12" fill="#2f5d9e"/>
  <rect x="54" y="72" width="532" height="232" rx="6" fill="url(#page)"/>
  <rect x="312" y="72" width="16" height="232" fill="#dde6f3"/>
  <g stroke="#b9c8de" stroke-width="2">
    <line x1="312" y1="96" x2="328" y2="96"/><line x1="312" y1="140" x2="328" y2="140"/>
    <line x1="312" y1="184" x2="328" y2="184"/><line x1="312" y1="228" x2="328" y2="228"/>
    <line x1="312" y1="272" x2="328" y2="272"/>
  </g>
  <g stroke="#e8eff8" stroke-width="2">
    <line x1="74" y1="128" x2="300" y2="128"/><line x1="74" y1="260" x2="300" y2="260"/>
    <line x1="340" y1="150" x2="566" y2="150"/><line x1="340" y1="184" x2="566" y2="184"/>
    <line x1="340" y1="218" x2="566" y2="218"/><line x1="340" y1="252" x2="566" y2="252"/>
  </g>
  <!-- 左页：凸透镜成像光路（手绘感线稿） -->
  <line x1="78" y1="210" x2="300" y2="210" stroke="#8a93a0" stroke-width="2" stroke-dasharray="7 5"/>
  <path d="M190 146 Q214 210 190 274 Q166 210 190 146 Z" fill="url(#lensg)" stroke="#2f5d9e" stroke-width="2.5"/>
  <g stroke="#2f5d9e" stroke-width="2.5">
    <line x1="140" y1="204" x2="140" y2="216"/><line x1="240" y1="204" x2="240" y2="216"/>
  </g>
  <text x="134" y="232" font-size="13" fill="#2f5d9e" font-family="sans-serif">F</text>
  <text x="234" y="232" font-size="13" fill="#2f5d9e" font-family="sans-serif">F</text>
  <!-- 物（正立箭头） -->
  <line x1="118" y1="210" x2="118" y2="166" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="118,158 112,170 124,170" fill="#dc2626"/>
  <text x="100" y="156" font-size="13" fill="#dc2626" font-family="sans-serif">物</text>
  <!-- 像（倒立箭头） -->
  <line x1="266" y1="210" x2="266" y2="252" stroke="#2f8a4e" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="266,260 260,248 272,248" fill="#2f8a4e"/>
  <text x="272" y="266" font-size="13" fill="#2f8a4e" font-family="sans-serif">像</text>
  <!-- 两条特殊光线 -->
  <polyline points="118,166 190,166 266,250" fill="none" stroke="#e8a33d" stroke-width="2.5"/>
  <line x1="118" y1="166" x2="266" y2="250" stroke="#7a5cd0" stroke-width="2.5"/>
  <!-- 右页：成像规律 -->
  <text x="340" y="124" font-size="20" font-weight="700" fill="#2f5d9e" font-family="sans-serif">凸透镜成像规律</text>
  <text x="340" y="178" font-size="15" fill="#3f4a5a" font-family="sans-serif">u&gt;2f：倒立缩小实像 → 照相机</text>
  <text x="340" y="212" font-size="15" fill="#3f4a5a" font-family="sans-serif">f&lt;u&lt;2f：倒立放大实像 → 投影仪</text>
  <text x="340" y="246" font-size="15" fill="#3f4a5a" font-family="sans-serif">u&lt;f：正立放大虚像 → 放大镜</text>
  <line x1="340" y1="270" x2="520" y2="270" stroke="#cdd6e2" stroke-width="2" stroke-linecap="round"/>
  <!-- 标题与脚注 -->
  <text x="320" y="42" font-size="24" font-weight="700" fill="#274b80" text-anchor="middle" font-family="sans-serif">透镜及其应用 · 本章小结</text>
  <text x="320" y="338" font-size="14" fill="#8b93a3" text-anchor="middle" font-family="sans-serif">成像规律 / 眼睛与眼镜 / 望远镜 知识速记</text>
</svg>
