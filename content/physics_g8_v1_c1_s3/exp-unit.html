<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>单位换算器 m/s ↔ km/h · 运动的快慢</title>
<link rel="stylesheet" href="common.css">
<style>
  .conv-wrap { background: var(--card2); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .conv-row { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; margin: 10px 0; }
  .conv-row label { min-width: 64px; font-weight: 700; font-size: 15px; }
  .conv-row input { width: 70px; min-width: 0; padding: 10px 8px; border-radius: 10px; border: 1px solid rgba(0,0,0,.1); background: #fff; font-size: 15px; font-weight: 700; text-align: center; color: var(--ink); }
  .conv-row .arrow { font-weight: 800; color: var(--brown); }
  .why { background: var(--brown-bg); border-left: 4px solid var(--brown); border-radius: 0 10px 10px 0; padding: 12px 14px; font-size: 14px; line-height: 1.8; }
  .why .line { word-break: break-all; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .chip-btn { border: 1px solid var(--green); background: var(--green-bg); color: var(--green); font-weight: 700; font-size: 13px; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  .chip-btn:hover { background: var(--green); color: #fff; }
  @media (max-width: 390px) {
    .conv-row input { width: 60px; padding: 10px 4px; font-size: 14px; }
    .conv-row label { min-width: 56px; font-size: 14px; }
  }
</style>
</head>
<body>
<a class="back-btn" href="experiment.html">‹ 返回互动探索区</a>
<div class="container">
  <div class="page-header">
    <h1 class="page-title">🔁 单位换算器</h1>
    <p class="page-subtitle">m/s 与 km/h 双向实时换算，×3.6 / ÷3.6 的原理看得见。</p>
  </div>
  <div class="card">
    <div class="conv-wrap">
      <div class="conv-row">
        <label for="inMs">m/s</label>
        <input type="number" step="any" id="inMs" placeholder="0" aria-label="米每秒">
        <span class="arrow">⇄</span>
        <label for="inKmh">km/h</label>
        <input type="number" step="any" id="inKmh" placeholder="0" aria-label="千米每小时">
      </div>
      <div class="chips" id="chips">💡 一键载入表1.3-1：</div>
    </div>
    <div class="why" id="whyBox">
      <div class="line">原理：1 km = 1000 m，1 h = 3600 s。</div>
      <div class="line">1 m/s = 1000 m ÷ 1000 / 3600 h… 即 1 m/s = 3.6 km/h；反过来 1 km/h = 1 ÷ 3.6 m/s ≈ 0.28 m/s。</div>
      <div class="line">在上方任填一边，另一边实时联动。</div>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';
  var ms = document.getElementById('inMs');
  var kmh = document.getElementById('inKmh');
  var why = document.getElementById('whyBox');
  function fmt(x) { if (!isFinite(x)) return '—'; if (x === 0) return '0'; var a = Math.abs(x); return String(a >= 0.01 ? Math.round(x * 100) / 100 : parseFloat(x.toPrecision(2))); }
  function fromMs() {
    var v = parseFloat(ms.value);
    if (ms.value === '' || !isFinite(v)) { kmh.value = ''; whyDefault(); return; }
    kmh.value = fmt(v * 3.6);
    why.innerHTML =
      '<div class="line">' + fmt(v) + ' m/s × 3.6 = ' + fmt(v * 3.6) + ' km/h</div>' +
      '<div class="line">（每小时走 ' + fmt(v) + ' m/s × 3600 s = ' + fmt(v * 3600) + ' m = ' + fmt(v * 3.6) + ' km）</div>';
  }
  function fromKmh() {
    var v = parseFloat(kmh.value);
    if (kmh.value === '' || !isFinite(v)) { ms.value = ''; whyDefault(); return; }
    ms.value = fmt(v / 3.6);
    why.innerHTML =
      '<div class="line">' + fmt(v) + ' km/h ÷ 3.6 = ' + fmt(v / 3.6) + ' m/s</div>' +
      '<div class="line">（每秒走 ' + fmt(v) + ' × 1000 m ÷ 3600 s = ' + fmt(v / 3.6) + ' m）</div>';
  }
  function whyDefault() {
    why.innerHTML =
      '<div class="line">原理：1 km = 1000 m，1 h = 3600 s。</div>' +
      '<div class="line">1 m/s = 3.6 km/h；1 km/h = 1 ÷ 3.6 m/s ≈ 0.28 m/s。</div>' +
      '<div class="line">在上方任填一边，另一边实时联动。</div>';
  }
  ms.addEventListener('input', fromMs);
  kmh.addEventListener('input', fromKmh);

  var items = [
    ['蜗牛', 0.0015], ['人（步行）', 1.1], ['自行车', 5], ['小轿车', 33], ['雨燕', 48],
    ['磁悬浮', 120], ['客机', 250], ['歼击机', 700], ['子弹', 1000], ['同步卫星', 3070]
  ];
  var chips = document.getElementById('chips');
  items.forEach(function (it) {
    var b = document.createElement('button');
    b.className = 'chip-btn';
    b.type = 'button';
    b.textContent = it[0] + ' ' + it[1] + ' m/s';
    b.addEventListener('click', function () {
      ms.value = it[1];
      fromMs();
    });
    chips.appendChild(b);
  });
})();
</script>
</body>
</html>
