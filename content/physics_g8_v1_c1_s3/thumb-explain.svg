<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fafe"/><stop offset="1" stop-color="#d4e6f2"/>
    </linearGradient>
    <linearGradient id="pole3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa3ab"/><stop offset="0.5" stop-color="#c8ced4"/><stop offset="1" stop-color="#828b93"/>
    </linearGradient>
    <linearGradient id="road3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b616b"/><stop offset="1" stop-color="#454a52"/>
    </linearGradient>
  </defs>

  <!-- 亮底渐变天空 -->
  <rect width="640" height="360" fill="url(#bg3)"/>
  <!-- 远山浅影 -->
  <path d="M0 250 Q120 210 240 246 Q380 208 500 244 Q570 224 640 248 L640 268 L0 268 Z" fill="#c3d6c8" opacity="0.7"/>

  <!-- 路面 -->
  <rect x="0" y="262" width="640" height="60" fill="url(#road3)"/>
  <line x1="0" y1="292" x2="640" y2="292" stroke="#e8e4d8" stroke-width="4" stroke-dasharray="42 34"/>

  <!-- 左：限速标志（红圈白底黑字 60） -->
  <g>
    <rect x="176" y="150" width="14" height="118" fill="url(#pole3)"/>
    <circle cx="183" cy="110" r="66" fill="#ffffff" stroke="#c0392b" stroke-width="14"/>
    <circle cx="183" cy="110" r="52" fill="none" stroke="#e8ecef" stroke-width="2"/>
    <text x="183" y="132" font-family="Helvetica,Arial,sans-serif" font-size="62" font-weight="700" fill="#22262b" text-anchor="middle">60</text>
  </g>

  <!-- 右：绿色里程碑（路程标记，静物特写） -->
  <g>
    <rect x="430" y="140" width="120" height="128" rx="10" fill="#1f7a44"/>
    <rect x="430" y="140" width="120" height="40" rx="10" fill="#ffffff"/>
    <rect x="430" y="172" width="120" height="8" fill="#ffffff"/>
    <text x="490" y="168" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1f7a44" text-anchor="middle">G105</text>
    <text x="490" y="222" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">K120</text>
    <text x="490" y="250" font-family="-apple-system,'PingFang SC',sans-serif" font-size="13" fill="#cfe8d8" text-anchor="middle">北京 120 km</text>
    <rect x="482" y="268" width="16" height="10" fill="#186236"/>
  </g>

  <!-- 蓝色示意箭头：沿路行驶的路程方向 -->
  <g>
    <line x1="270" y1="336" x2="380" y2="336" stroke="#2f6fb5" stroke-width="5" stroke-linecap="round"/>
    <polygon points="380,336 362,327 362,345" fill="#2f6fb5"/>
  </g>

  <!-- 说明 -->
  <text x="52" y="52" font-family="-apple-system,'PingFang SC',sans-serif" font-size="17" font-weight="700" fill="#33506b">限速 60 km/h · 里程碑标记路程</text>
</svg>
