<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>眼睛与矫正 — 眼睛和眼镜</title>
<link rel="stylesheet" href="../_lib/guide/guide-core.css?v=20261028v2">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Yuanti SC","YouYuan","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f2ec;color:#3d3830;overflow:hidden}
  header{position:fixed;top:0;left:0;right:0;height:34px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f5f2ec;border-bottom:1px solid rgba(0,0,0,0.12);z-index:10}
  .back{font-size:13px;color:#2563eb;text-decoration:none;white-space:nowrap}
  .back:hover{text-decoration:underline}
  .title{font-size:13px;font-weight:600;color:#2b2620;white-space:nowrap}
  .scene-wrap{position:fixed;top:34px;left:0;right:0;bottom:0}
  canvas#scene{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
  /* 知识气泡（照 c5s1）：毛玻璃暖白底+CSS 三角箭头+右上× */
  #bubble{display:none;position:absolute;left:0;top:0;max-width:340px;background:rgba(255,255,255,0.55);border-radius:16px;padding:10px 30px 10px 13px;font-size:14px;line-height:1.55;color:#2a2620;z-index:17;opacity:0;transition:opacity .15s ease;box-shadow:0 2px 10px rgba(0,0,0,.08)}
  #bubble.show{opacity:1}
  #bubble-x{position:absolute;top:3px;right:8px;cursor:pointer;color:#8a7c66;font-size:16px;line-height:1;user-select:none}
  #bubble-x:hover{color:#3d3830}
  #bubble-arrow{position:absolute;width:0;height:0;border:9px solid transparent;left:20px}
  #bubble.arr-b #bubble-arrow{bottom:-18px;border-top-color:rgba(255,255,255,0.55)}
  #bubble.arr-t #bubble-arrow{top:-18px;border-bottom-color:rgba(255,255,255,0.55)}
  .ctrlbar{position:fixed;left:0;right:0;bottom:0;min-height:96px;background:linear-gradient(to top,rgba(238,233,224,.80),rgba(238,233,224,.44) 70%,rgba(238,233,224,0));pointer-events:none;display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;gap:8px;padding:8px 12px;z-index:20}
  .ctrlbar>*{pointer-events:auto}
  .group{display:flex;flex-direction:column;gap:4px;background:rgba(255,255,255,.86);border:1px solid #ddd5c4;border-radius:10px;padding:5px 9px;transition:opacity .3s ease,transform .3s ease}
  .glabel{font-size:14px;color:#8a7c66;white-space:nowrap;letter-spacing:.5px;line-height:1}
  .gctrl{display:flex;align-items:center;gap:6px;flex:1;min-height:40px}
  /* R21：参数卡内容自适应宽，禁被 space-between 拉满行宽；卡内滑杆-标签-步进-自动紧邻排布 */
  #grp-t{flex:0 0 auto}
  #grp-t .gctrl{flex:0 0 auto;gap:6px}
  .gctrl label{font-size:14px;cursor:pointer;white-space:nowrap;color:#3d3830}
  button{border:0;border-radius:8px;padding:9px 13px;font-size:14px;font-family:inherit;cursor:pointer;background:#2563eb;color:#fff;transition:background .15s;white-space:nowrap}
  button:hover{background:#1d4ed8}
  button.secondary{background:#6b7280}
  button.secondary:hover{background:#4b5563}
  button.step{padding:6px 10px}
  button:disabled{opacity:.35;cursor:default}
  /* 物理按压两态钮（照 c5s1）：凸起渐变→按下内凹 */
  button#btn-table,button#btn-flow,button#btn-auto{border:1px solid #94a3b8;background:linear-gradient(#fdfefe,#dbe4ee);color:#334155;box-shadow:0 2px 3px rgba(30,41,59,.25);transition:all .12s}
  button#btn-table:hover,button#btn-flow:hover,button#btn-auto:hover{background:linear-gradient(#f8fafc,#d2deeb)}
  button#btn-table.on,button#btn-flow.on,button#btn-auto.on{background:#b9c7d6;border-color:#64748b;box-shadow:inset 0 2px 5px rgba(30,41,59,.35);transform:translateY(1px)}
  button#btn-auto:disabled{opacity:.4}
  select#sel-cond{border:1px solid #94a3b8;border-radius:8px;padding:7px 9px;font-size:14px;font-family:inherit;background:linear-gradient(#fdfefe,#e6edf5);color:#334155;cursor:pointer}
  input#rng-t{width:150px;accent-color:#d97706}
  input#rng-t:disabled{opacity:.35;cursor:default}
  #lbl-t{font-size:15px;color:#854d0e;min-width:96px;text-align:right;font-variant-numeric:tabular-nums}
  .ctrlbar.compact .glabel{font-size:12px}
  .ctrlbar.compact .gctrl{min-height:32px}
  .ctrlbar.compact .gctrl label{font-size:12px}
  .ctrlbar.compact button{padding:5px 7px;font-size:13px}
  .ctrlbar.compact select#sel-cond{padding:4px 6px;font-size:13px}
  .ctrlbar.compact input#rng-t{width:110px}
  .ctrlbar.compact #lbl-t{font-size:13px;min-width:0}
  /* 读数面板（照 c5s1 幽灵化浮层） */
  .rec-panel{display:none;position:absolute;top:12px;right:12px;min-width:340px;max-width:min(560px,92vw);background:rgba(255,255,255,0.45);border-radius:16px;padding:14px 18px;z-index:15}
  .rec-panel.show{display:block}
  .rec-panel .rp-title{font-size:18px;font-weight:600;color:#b45309;margin-bottom:8px}
  table.rec{border-collapse:collapse;font-size:16px;background:transparent;width:100%}
  table.rec th,table.rec td{border:none;border-bottom:1px solid rgba(0,0,0,.08);padding:7px 11px;text-align:left;white-space:nowrap;color:#1e293b}
  table.rec th{background:transparent;font-weight:400;width:110px;color:#64748b}
  table.rec td{font-weight:600}
  html.pseudo-fs{width:100%;height:100%}
  html.pseudo-fs body{position:fixed;top:0;left:0;right:0;bottom:0;width:100vw;height:100vh;z-index:2147483000;overflow:hidden}
</style>
</head>
<body>
<header>
  <div class="title">眼睛和眼镜 · 眼睛与矫正</div>
  <a class="back" id="btn-back" href="./index.html">← 返回实验卡页</a>
</header>
<div class="scene-wrap">
<canvas id="scene"></canvas>
<div id="bubble">
  <div id="bubble-txt"></div>
  <span id="bubble-x">×</span>
  <div id="bubble-arrow"></div>
</div>
<div class="rec-panel" id="panel-read">
  <div class="rp-title">读数面板</div>
  <table class="rec"><tbody>
    <tr><th>眼况</th><td id="pr-cond">—</td></tr>
    <tr><th>晶状体</th><td id="pr-lens">—</td></tr>
    <tr><th>矫正镜</th><td id="pr-glass">—</td></tr>
    <tr><th>成像</th><td id="pr-img">—</td></tr>
  </tbody></table>
</div>
</div>
<div class="ctrlbar">
  <div class="group" id="grp-t">
    <div class="glabel">参数 · 晶状体厚度</div>
    <div class="gctrl">
      <button id="btn-t-down" class="secondary step">◀</button>
      <input type="range" id="rng-t" min="0" max="100" step="1" value="32">
      <span id="lbl-t">薄 ─── 厚</span>
      <button id="btn-t-up" class="secondary step">▶</button>
      <button id="btn-auto" class="on">自动</button>
    </div>
  </div>
  <div class="group" id="grp-act">
    <div class="glabel">动作 · 显示</div>
    <div class="gctrl">
      <label for="sel-cond">眼况</label>
      <select id="sel-cond">
        <option value="normal" selected>正常</option>
        <option value="myopia">近视</option>
        <option value="hyper">远视</option>
      </select>
      <button id="btn-flow">光流</button>
    </div>
  </div>
  <div class="group" id="grp-sys">
    <div class="glabel">系统</div>
    <div class="gctrl">
      <button id="btn-table">读数面板</button>
      <button id="btn-reset" class="secondary">重置</button>
      <button id="btn-mute">🔊</button>
      <button id="btn-full" class="secondary">全屏</button>
    </div>
  </div>
</div>
<script src="../_lib/v1/props.js?v=20261024"></script>
<script src="../_lib/v1/props-optics.js?v=20261024"></script>
<script src="../_lib/v1/sfx.js?v=20261024"></script>
<script src="exp-eye-core.js?v=20261028v2"></script>
<div id="guide-layer"><!-- 语音讲解层容器：内容由 _lib/guide/vB-core.js 运行时注入 --></div>
<script>window.GUIDE_CFG={state:window.C5S4_STATE};/* 多模式页不设 mode key：引擎每帧轮询 R.mode（= st.mode 不可枚举 getter） */</script>
<script src="guide/guide-data.js?v=20261028v2"></script>
<script src="../_lib/guide/engine-core.js?v=20261028v5"></script>
<script src="../_lib/guide/vB-core.js?v=20261028v3"></script>
<script>
  const p=new URLSearchParams(location.search),cb=p.get('cb-path');
  if(cb)document.getElementById('btn-back').href='./index.html?cb-path='+encodeURIComponent(cb);
</script>
</body>
</html>
