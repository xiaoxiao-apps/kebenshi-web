<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f7fbff"/><stop offset="100%" stop-color="#e8f0f8"/></linearGradient>
    <radialGradient id="eye" cx="0.45" cy="0.4" r="0.75"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#dfe9f3"/></radialGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#9fc4e8"/><stop offset="50%" stop-color="#7ba7d6"/><stop offset="100%" stop-color="#9fc4e8"/></linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>
  <!-- 左侧树剪影（远处物体） -->
  <rect x="30" y="96" width="7" height="34" fill="#4b5d43"/>
  <path d="M33 46 L52 84 L44 84 L58 104 L8 104 L22 84 L14 84 Z" fill="#5d7a52"/>
  <!-- 眼球剖面 -->
  <circle cx="216" cy="90" r="52" fill="url(#eye)" stroke="#8aa2b8" stroke-width="2.5"/>
  <!-- 视网膜弧（后内壁） -->
  <path d="M252 52 A52 52 0 0 1 252 128" fill="none" stroke="#e07b39" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <!-- 晶状体双凸 -->
  <path d="M184 60 C172 74 172 106 184 120 C196 106 196 74 184 60 Z" fill="url(#lens)" stroke="#4d7bb0" stroke-width="1.5"/>
  <!-- 光线：树顶 → 晶状体 → 会聚视网膜 -->
  <g stroke="#dc2626" stroke-width="2" fill="none">
    <line x1="40" y1="50" x2="180" y2="66"/>
    <line x1="180" y1="66" x2="250" y2="92"/>
    <line x1="40" y1="50" x2="180" y2="112"/>
    <line x1="180" y1="112" x2="250" y2="92"/>
  </g>
  <circle cx="250" cy="92" r="4" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
  <text x="160" y="168" text-anchor="middle" font-size="13" fill="#334155" font-family="Arial,sans-serif">眼睛与矫正</text>
</svg>
