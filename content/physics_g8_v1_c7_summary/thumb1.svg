<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdfbf5"/><stop offset="1" stop-color="#f3e9e4"/></linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fdf7f4"/></linearGradient>
    <linearGradient id="boxg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3c08a"/><stop offset="1" stop-color="#c39a5f"/></linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- 摊开笔记本 -->
  <rect x="44" y="62" width="552" height="252" rx="12" fill="#a8402f"/>
  <rect x="54" y="72" width="532" height="232" rx="6" fill="url(#page)"/>
  <rect x="312" y="72" width="16" height="232" fill="#f0dcd6"/>
  <g stroke="#dcb6ac" stroke-width="2">
    <line x1="312" y1="96" x2="328" y2="96"/><line x1="312" y1="140" x2="328" y2="140"/>
    <line x1="312" y1="184" x2="328" y2="184"/><line x1="312" y1="228" x2="328" y2="228"/>
    <line x1="312" y1="272" x2="328" y2="272"/>
  </g>
  <g stroke="#f6e9e5" stroke-width="2">
    <line x1="74" y1="128" x2="300" y2="128"/><line x1="74" y1="288" x2="300" y2="288"/>
    <line x1="340" y1="150" x2="566" y2="150"/><line x1="340" y1="184" x2="566" y2="184"/>
    <line x1="340" y1="218" x2="566" y2="218"/><line x1="340" y1="252" x2="566" y2="252"/>
  </g>
  <!-- 左页：物体受力示意（手绘感线稿） -->
  <line x1="86" y1="272" x2="296" y2="272" stroke="#8a93a0" stroke-width="3" stroke-linecap="round"/>
  <rect x="152" y="212" width="80" height="60" rx="6" fill="url(#boxg)" stroke="#9c7740" stroke-width="2.5"/>
  <!-- 重力 G 向下 -->
  <line x1="192" y1="242" x2="192" y2="300" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  <polygon points="192,308 184,294 200,294" fill="#dc2626"/>
  <text x="200" y="304" font-size="15" font-weight="700" fill="#dc2626" font-family="sans-serif">G</text>
  <!-- 支持力 N 向上 -->
  <line x1="192" y1="212" x2="192" y2="160" stroke="#2f8a4e" stroke-width="4" stroke-linecap="round"/>
  <polygon points="192,152 184,166 200,166" fill="#2f8a4e"/>
  <text x="200" y="162" font-size="15" font-weight="700" fill="#2f8a4e" font-family="sans-serif">N</text>
  <!-- 推力 F 向右 -->
  <line x1="232" y1="238" x2="288" y2="238" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <polygon points="296,238 282,230 282,246" fill="#2563eb"/>
  <text x="266" y="228" font-size="15" font-weight="700" fill="#2563eb" font-family="sans-serif">F</text>
  <!-- 右页：公式与笔记 -->
  <text x="340" y="124" font-size="20" font-weight="700" fill="#a8402f" font-family="sans-serif">力 · 重力</text>
  <text x="340" y="178" font-size="20" fill="#3f4a5a" font-family="sans-serif">G = m g</text>
  <text x="340" y="212" font-size="15" fill="#3f4a5a" font-family="sans-serif">g = 9.8 N/kg，方向竖直向下</text>
  <text x="340" y="246" font-size="15" fill="#3f4a5a" font-family="sans-serif">力的三要素：大小 / 方向 / 作用点</text>
  <line x1="340" y1="270" x2="500" y2="270" stroke="#cdd6e2" stroke-width="2" stroke-linecap="round"/>
  <!-- 标题与脚注 -->
  <text x="320" y="42" font-size="24" font-weight="700" fill="#8e3324" text-anchor="middle" font-family="sans-serif">力 · 本章小结</text>
  <text x="320" y="338" font-size="14" fill="#9c8a85" text-anchor="middle" font-family="sans-serif">力 / 弹力 / 重力 知识速记</text>
</svg>
