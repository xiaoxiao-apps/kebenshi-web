<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- c7 本章小结缩略图：知识清单卡+力三要素小图（原创矢量） -->
  <defs>
    <linearGradient id="bgS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#e8f0f8"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bgS)"/>
  <!-- 知识清单卡 -->
  <rect x="60" y="72" width="330" height="216" rx="18" fill="#ffffff" stroke="#dbe4ee" stroke-width="2"/>
  <rect x="60" y="72" width="330" height="52" rx="18" fill="#2563eb"/>
  <rect x="60" y="106" width="330" height="18" fill="#2563eb"/>
  <text x="225" y="106" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="sans-serif">📋 本章小结</text>
  <!-- 清单行：勾+文字条 -->
  <g font-family="sans-serif">
    <circle cx="96" cy="164" r="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <path d="M91 164 l4 4 l7 -8" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <text x="118" y="170" font-size="17" fill="#334155">力 · 三要素 · 示意图 · 相互</text>
    <circle cx="96" cy="208" r="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <path d="M91 208 l4 4 l7 -8" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <text x="118" y="214" font-size="17" fill="#334155">弹力 · 弹性限度 · 测力计</text>
    <circle cx="96" cy="252" r="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <path d="M91 252 l4 4 l7 -8" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <text x="118" y="258" font-size="17" fill="#334155">重力 G=mg · 竖直向下 · 重心</text>
  </g>
  <!-- 右侧：力的箭头 -->
  <g>
    <rect x="452" y="96" width="84" height="56" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="494" y="131" font-size="18" font-weight="bold" fill="#92400e" text-anchor="middle" font-family="sans-serif">m</text>
    <line x1="494" y1="152" x2="494" y2="212" stroke="#dc2626" stroke-width="5"/>
    <polygon points="494,226 485,208 503,208" fill="#dc2626"/>
    <text x="516" y="196" font-size="17" font-weight="bold" fill="#dc2626" font-family="sans-serif">G</text>
  </g>
  <!-- 右下：弹簧+拉力 -->
  <g>
    <rect x="440" y="256" width="10" height="52" rx="3" fill="#94a3b8"/>
    <path d="M456 282 q9 -14 18 0 q9 14 18 0 q9 -14 18 0 q9 14 18 0 q9 -14 18 0" fill="none" stroke="#475569" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="552" cy="282" r="6" fill="none" stroke="#475569" stroke-width="3.5"/>
    <line x1="562" y1="282" x2="596" y2="282" stroke="#2563eb" stroke-width="4.5" stroke-linecap="round"/>
    <polygon points="608,282 592,274 592,290" fill="#2563eb"/>
    <text x="576" y="264" font-size="15" font-weight="bold" fill="#2563eb" font-family="sans-serif">F</text>
  </g>
  <text x="320" y="44" font-size="26" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="sans-serif">第七章「力」知识速记</text>
  <text x="320" y="330" font-size="16" fill="#64748b" text-anchor="middle" font-family="sans-serif">纯概念零题目 · 配套题目见本章练习</text>
</svg>
