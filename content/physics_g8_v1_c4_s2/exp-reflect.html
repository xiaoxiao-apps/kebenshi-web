<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光的反射实验室 — 第4章 光现象</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#e8f1f8;color:#1f2937;overflow:hidden}
  header{position:fixed;top:0;left:0;right:0;height:34px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#e8f1f8;border-bottom:1px solid rgba(0,0,0,0.08);z-index:10}
  .back{font-size:13px;color:#2563eb;text-decoration:none;white-space:nowrap}
  .back:hover{text-decoration:underline}
  .title{font-size:13px;font-weight:600;color:#111827;white-space:nowrap}
  .hint{font-size:12px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400;margin-left:8px}
  .scene-wrap{position:fixed;top:34px;left:0;right:0;bottom:0}
  canvas#scene{position:absolute;inset:0;display:block;width:100%;height:100%}
  .ctrlbar{position:fixed;left:0;right:0;bottom:0;min-height:92px;background:transparent;pointer-events:none;display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;gap:8px;padding:8px 10px;z-index:20}
  .ctrlbar>*{pointer-events:auto}
  .group{display:flex;flex-direction:column;gap:5px;background:rgba(255,255,255,.55);border-radius:10px;padding:6px 12px}
  .glabel{font-size:11px;color:#5b6472;white-space:nowrap;letter-spacing:.5px;line-height:1}
  .gctrl{display:flex;align-items:center;gap:6px;flex:1;min-height:28px}
  .gctrl label{font-size:13px;cursor:pointer;white-space:nowrap}
  button{border:0;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;background:#2563eb;color:#fff;transition:background .15s}
  button:hover{background:#1d4ed8}
  button.secondary{background:#6b7280}
  button.secondary:hover{background:#4b5563}
  button:disabled{background:#c3cad6;cursor:not-allowed}
  input[type=range]{width:120px;height:26px}
  select,button{min-height:26px}
  #ang-val{font-size:13px;min-width:34px;text-align:center;font-weight:600}
  .readout{font-size:13px;color:#2563eb;font-weight:600;white-space:nowrap}
html.pseudo-fs{width:100%;height:100%}
html.pseudo-fs body{position:fixed;top:0;left:0;right:0;bottom:0;width:100vw;height:100vh;z-index:2147483000;overflow:hidden}
</style>
</head>
<body>
<header>
  <div class="title">第2节 光的反射 <span id="hint" class="hint">点激光笔红钮/太阳开关光源；拖笔身改入射角</span></div>
  <a class="back" href="./index.html">← 返回实验卡页</a>
</header>
<div id="scene-wrap" class="scene-wrap">
  <canvas id="scene"></canvas>
</div>
<div class="ctrlbar">
  <div class="group">
    <div class="glabel">入射角</div>
    <div class="gctrl">
      <button id="ang-minus" class="secondary">−</button>
      <input id="ang-slider" type="range" min="0" max="80" step="1" value="45">
      <button id="ang-plus" class="secondary">+</button>
      <span id="ang-val">45°</span>
    </div>
  </div>
  <div class="group">
    <div class="glabel">折纸板</div>
    <div class="gctrl">
      <input id="fold-slider" type="range" min="0" max="85" step="1" value="0" style="width:90px">
      <span id="fold-val">0°</span>
    </div>
  </div>
  <div class="group">
    <div class="glabel">光源与面</div>
    <div class="gctrl">
      <label><input type="radio" name="beam-mode" value="single" checked> 单光线</label>
      <label><input type="radio" name="beam-mode" value="beam"> 平行光束</label>
      <select id="surface"><option value="smooth">平面镜</option><option value="rough">粗糙面</option></select>
      <input id="rough-slider" type="range" min="0" max="100" step="5" value="40" style="width:80px" disabled>
      <span id="rough-val">0</span>
    </div>
  </div>
  <div class="group">
    <div class="glabel">显示</div>
    <div class="gctrl">
      <label><input type="checkbox" id="cb-normal" checked> 法线</label>
      <label><input type="checkbox" id="cb-arc" checked> 角度弧</label>
      <label><input type="checkbox" id="cb-arrow"> 光线箭头</label>
      <label><input type="checkbox" id="cb-read" checked> 读数</label>
      <span class="readout">∠i=<span id="read-i">45°</span> ∠r=<span id="read-r">45°</span></span>
    </div>
  </div>
  <div class="group">
    <div class="glabel">演示</div>
    <div class="gctrl">
      <button id="btn-reverse" class="secondary" style="flex:1">光路可逆</button>
    </div>
  </div>
  <div class="group">
    <div class="glabel">系统</div>
    <div class="gctrl">
      <button id="btn-reset" class="secondary">重置</button>
      <button id="btn-mute">🔊</button>
      <button id="btn-full" class="secondary">全屏</button>
    </div>
  </div>
</div>
<script src="../_lib/v1/props.js?v=58"></script>
<script src="exp-reflect-audio.js?v=1"></script>
<script src="exp-reflect-render.js?v=14"></script>
<script src="exp-reflect-core.js?v=16"></script>
</body>
</html>
