<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      <nav id="mode-tabs">

      <iframe class="mode-frame" data-mode="sensor" data-src="exp-sensor.html" title="超声波传感器测速" allowfullscreen allow="fullscreen"></iframe>

  <script src="lab.js"></script>
