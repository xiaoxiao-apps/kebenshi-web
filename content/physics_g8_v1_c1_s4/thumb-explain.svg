<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfcf7"/><stop offset="1" stop-color="#e4e9dd"/>
    </linearGradient>
    <linearGradient id="table4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9b98c"/><stop offset="1" stop-color="#bd9a6b"/>
    </linearGradient>
    <linearGradient id="tape4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf3df"/><stop offset="1" stop-color="#efe3c4"/>
    </linearGradient>
  </defs>

  <!-- 亮底渐变 -->
  <rect width="640" height="360" fill="url(#bg4)"/>

  <!-- 木桌面 -->
  <rect x="0" y="252" width="640" height="108" fill="url(#table4)"/>
  <rect x="0" y="252" width="640" height="6" fill="#e6cba2"/>
  <g stroke="#b8946a" stroke-width="1.5" opacity="0.45">
    <line x1="0" y1="288" x2="640" y2="288"/>
    <line x1="0" y1="324" x2="640" y2="324"/>
  </g>

  <!-- 纸带阴影 -->
  <path d="M36 226 Q320 246 604 220 L604 252 Q320 278 36 258 Z" fill="#7a6244" opacity="0.25"/>
  <!-- 记录纸带（微弯长条，横贯画面） -->
  <path d="M36 208 Q320 228 604 202 L604 234 Q320 260 36 240 Z" fill="url(#tape4)" stroke="#d8c9a2" stroke-width="1.5"/>

  <!-- 打点计时器点迹：间距渐大（速度变大） -->
  <g fill="#33302a">
    <circle cx="86" cy="226.5" r="3.4"/>
    <circle cx="120" cy="228.6" r="3.4"/>
    <circle cx="158" cy="230.8" r="3.4"/>
    <circle cx="202" cy="233.0" r="3.4"/>
    <circle cx="252" cy="235.1" r="3.4"/>
    <circle cx="310" cy="236.8" r="3.4"/>
    <circle cx="376" cy="237.4" r="3.4"/>
    <circle cx="450" cy="235.8" r="3.4"/>
    <circle cx="532" cy="231.4" r="3.4"/>
  </g>

  <!-- 红色示意箭头：纸带运动方向 -->
  <g>
    <line x1="120" y1="164" x2="300" y2="164" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
    <polygon points="300,164 284,156 284,172" fill="#c0392b"/>
    <text x="316" y="170" font-family="-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="600" fill="#c0392b">拉动方向</text>
  </g>

  <!-- 间距对比标注（两段括号示意 Δs 变大） -->
  <g stroke="#2f6fb5" stroke-width="2" fill="none">
    <path d="M86 264 v10 M120 266 v10 M86 274 h34"/>
    <path d="M376 274 v10 M450 272 v10 M376 284 h74"/>
  </g>
  <text x="103" y="302" font-family="Helvetica,Arial,sans-serif" font-size="14" font-style="italic" fill="#2f6fb5" text-anchor="middle">Δs₁</text>
  <text x="413" y="312" font-family="Helvetica,Arial,sans-serif" font-size="14" font-style="italic" fill="#2f6fb5" text-anchor="middle">Δs₂ &gt; Δs₁</text>

  <!-- 说明 -->
  <text x="320" y="66" font-family="-apple-system,'PingFang SC',sans-serif" font-size="19" font-weight="700" fill="#33506b" text-anchor="middle">打点计时器纸带 · 点距渐大 = 速度变大</text>
  <text x="320" y="96" font-family="-apple-system,'PingFang SC',sans-serif" font-size="14" fill="#6c7a89" text-anchor="middle">相邻两点间的时间相等，用平均速度描述变速运动</text>
</svg>
