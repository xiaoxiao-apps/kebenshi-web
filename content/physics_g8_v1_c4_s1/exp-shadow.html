<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光影成像实验室 — 光的直线传播</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#e8f1f8;color:#1f2937;overflow:hidden}
  header{position:fixed;top:0;left:0;right:0;height:34px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#e8f1f8;border-bottom:1px solid rgba(0,0,0,0.08);z-index:10}
  .back{font-size:13px;color:#2563eb;text-decoration:none;white-space:nowrap}
  .back:hover{text-decoration:underline}
  .title{font-size:13px;font-weight:600;color:#111827;white-space:nowrap}
  .hint{font-size:12px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400;margin-left:8px}
  .scene-wrap{position:fixed;top:34px;left:0;right:0;bottom:0}
  canvas#scene{position:absolute;inset:0;display:block;width:100%;height:100%}
  .ctrlbar{position:fixed;left:0;right:0;bottom:0;height:16%;background:transparent;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;gap:10px;padding:0 16px 14px;z-index:20}
  .ctrlbar>*{pointer-events:auto}
  .group{background:rgba(255,255,255,0.25);border-radius:10px;padding:6px 10px;display:flex;align-items:center;gap:8px}
  label{font-size:13px;cursor:pointer}
  button{border:0;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;background:#2563eb;color:#fff;transition:background .15s}
  button:hover{background:#1d4ed8}
  button.secondary{background:#6b7280}
  button.secondary:hover{background:#4b5563}
  button:disabled{background:#c3cad6;cursor:not-allowed}
</style>
</head>
<body>
<header>
  <div class="title">实验② 光影成像实验室 <span id="hint" class="hint">点击蜡烛点燃，光幕出现火焰光斑；左右拖蜡烛/光屏改物距像距</span></div>
  <a class="back" href="./index.html">← 返回实验卡页</a>
</header>
<div class="scene-wrap">
  <canvas id="scene"></canvas>
</div>
<div class="ctrlbar">
  <div class="group">
    <button id="btn-reset" class="secondary">重置</button>
  </div>
  <div class="group" id="grp-mode">
    <label><input type="radio" name="mode" value="pinhole" checked> 小孔成像</label>
    <label><input type="radio" name="mode" value="hand"> 手影游戏</label>
  </div>
  <div class="group">
    <label><input type="checkbox" id="cb-ray" checked> 光线符号</label>
  </div>
  <div class="group" id="grp-hole">
    <label>孔径</label>
    <button id="hole-minus" class="secondary">−</button>
    <input id="hole-slider" type="range" min="8" max="40" step="2" value="14" style="width:90px">
    <button id="hole-plus" class="secondary">+</button>
    <span id="hole-val" style="font-size:12px;min-width:34px">14px</span>
  </div>
  <div class="group">
    <button id="btn-mute">🔊</button>
    <button id="btn-full" class="secondary">全屏</button>
  </div>
</div>
<script src="../_lib/v1/props.js?v=57"></script>
<script src="exp-shadow-audio.js?v=2"></script>
<script src="exp-shadow-core.js?v=81"></script>
</body>
</html>
