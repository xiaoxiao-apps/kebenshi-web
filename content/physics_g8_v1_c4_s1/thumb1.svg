    <rect x="48" y="-6" width="14" height="12" fill="#d1d5db"/>
    <rect x="4" y="-7" width="46" height="3" fill="rgba(255,255,255,.35)"/>
  </g>
  <line x1="108" y1="105" x2="270" y2="105" stroke="#ff3b30" stroke-width="5" opacity=".22" stroke-linecap="round"/>
  <line x1="108" y1="105" x2="270" y2="105" stroke="#ff3b30" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="145,100 155,105 145,110" fill="#22c55e"/>
  <polygon points="205,100 215,105 205,110" fill="#22c55e"/>
  <text x="160" y="165" text-anchor="middle" font-size="13" fill="#475569" font-family="Arial,sans-serif">介质中的直线传播</text>
</svg>
