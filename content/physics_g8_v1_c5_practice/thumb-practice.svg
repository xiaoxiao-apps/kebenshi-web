    <line x1="240" y1="198" x2="298" y2="222" stroke="#f59e0b" stroke-width="1.5"/>
    <path d="M268 186 Q274 210 268 234 Q262 210 268 186" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="283" y1="207" x2="283" y2="213" stroke="#475569" stroke-width="1"/>
    <text x="283" y="222" font-size="8" fill="#475569" text-anchor="middle">F</text>
    <line x1="240" y1="210" x2="240" y2="200" stroke="#dc2626" stroke-width="2"/>
