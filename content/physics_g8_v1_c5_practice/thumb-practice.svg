    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bgP)"/>
  <!-- 题卷 -->
  <rect x="150" y="66" width="340" height="228" rx="18" fill="#ffffff" stroke="#dbe4ee" stroke-width="2"/>
