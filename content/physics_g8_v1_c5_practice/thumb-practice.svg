    <text x="180" y="212" font-size="16" fill="#334155">2</text>
    <rect x="205" y="178" width="126" height="58" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="213" y1="210" x2="323" y2="210" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="240" y1="198" x2="268" y2="198" stroke="#f59e0b" stroke-width="1.5"/>
