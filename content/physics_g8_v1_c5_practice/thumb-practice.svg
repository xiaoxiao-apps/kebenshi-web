  <text x="320" y="42" font-size="26" font-weight="bold" fill="#b45309" text-anchor="middle" font-family="sans-serif">第五章「透镜及其应用」原创自测</text>
  <text x="320" y="332" font-size="16" fill="#64748b" text-anchor="middle" font-family="sans-serif">即时判分 · 逐题解析 · 一键重做</text>
