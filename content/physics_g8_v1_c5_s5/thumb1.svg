<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#101a2e"/><stop offset="100%" stop-color="#0a1220"/></linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#6a9ce0"/><stop offset="50%" stop-color="#4d7fd0"/><stop offset="100%" stop-color="#3b6bb8"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>
  <line x1="0" y1="96" x2="320" y2="96" stroke="#5b6b84" stroke-width="1" stroke-dasharray="10 4 2 4" opacity=".8"/>
  <!-- 远处物体：树剪影 -->
  <rect x="24" y="72" width="5" height="24" fill="#3f5a44"/>
  <path d="M26.5 34 L40 60 L33 60 L43 80 L10 80 L20 60 L13 60 Z" fill="#4a6b50"/>
  <!-- 物镜（大凸透镜） -->
  <path d="M118 40 C102 62 102 130 118 152 C134 130 134 62 118 40 Z" fill="url(#lens)" stroke="#1a1a1a" stroke-width="1.5" opacity=".95"/>
  <!-- 目镜（小凸透镜） -->
  <path d="M218 62 C208 76 208 116 218 130 C228 116 228 76 218 62 Z" fill="url(#lens)" stroke="#1a1a1a" stroke-width="1.5" opacity=".95"/>
  <!-- 光路（F4 按教材重绘）：平行入射→物镜折射后两折射线交于光轴上唯一一点（焦点 182,96）→直线传播至目镜→平行出射入眼；全链只在两镜面各折一次，无 x=217 二次弯折 -->
  <g filter="url(#glow)">
    <line x1="46" y1="78" x2="116" y2="78" stroke="#ff3b30" stroke-width="2"/>
    <line x1="116" y1="78" x2="218" y2="105.82" stroke="#ff3b30" stroke-width="2"/>
    <line x1="46" y1="114" x2="116" y2="114" stroke="#ff3b30" stroke-width="2"/>
    <line x1="116" y1="114" x2="218" y2="86.18" stroke="#ff3b30" stroke-width="2"/>
    <line x1="218" y1="105.82" x2="274" y2="105.82" stroke="#ff3b30" stroke-width="2"/>
    <line x1="218" y1="86.18" x2="274" y2="86.18" stroke="#ff3b30" stroke-width="2"/>
  </g>
  <!-- 中间像：倒立实箭头（像成在目镜前焦平面 x=182） -->
  <line x1="182" y1="96" x2="182" y2="112" stroke="#ffd166" stroke-width="2.5"/>
  <path d="M182 116 L177 106 L187 106 Z" fill="#ffd166"/>
  <!-- 眼 -->
  <ellipse cx="288" cy="100" rx="15" ry="14" fill="#e8eef7" stroke="#1a1a1a" stroke-width="1.2"/>
  <circle cx="284" cy="100" r="4.5" fill="#3b6bb8"/>
  <circle cx="284" cy="100" r="2" fill="#101a2e"/>
  <text x="118" y="172" text-anchor="middle" font-size="12" fill="#c7d4e8" font-family="Arial,sans-serif">物镜</text>
  <text x="218" y="172" text-anchor="middle" font-size="12" fill="#c7d4e8" font-family="Arial,sans-serif">目镜</text>
  <text x="160" y="20" text-anchor="middle" font-size="13" fill="#c7d4e8" font-family="Arial,sans-serif">望远镜组装台</text>
</svg>
