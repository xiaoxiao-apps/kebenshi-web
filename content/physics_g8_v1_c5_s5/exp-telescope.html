<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>望远镜组装台 — 跨学科实践：制作望远镜</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Yuanti SC","YouYuan","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f2ec;color:#3d3830;overflow:hidden}
  header{position:fixed;top:0;left:0;right:0;height:34px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f5f2ec;border-bottom:1px solid rgba(0,0,0,0.12);z-index:10}
  .back{font-size:13px;color:#2563eb;text-decoration:none;white-space:nowrap}
  .back:hover{text-decoration:underline}
  .title{font-size:13px;font-weight:600;color:#2b2620;white-space:nowrap}
  .scene-wrap{position:fixed;top:34px;left:0;right:0;bottom:0}
  canvas#scene{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
  .ctrlbar{position:fixed;left:0;right:0;bottom:0;min-height:96px;background:linear-gradient(to top,rgba(238,233,224,.80),rgba(238,233,224,.44) 70%,rgba(238,233,224,0));pointer-events:none;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:stretch;gap:6px;padding:8px 12px;font-family:"Yuanti SC","YouYuan","PingFang SC","Microsoft YaHei",sans-serif;z-index:20}
  .ctrlbar>*{pointer-events:auto}
  .group{display:flex;flex-direction:column;gap:4px;background:rgba(255,255,255,.86);border:1px solid #ddd5c4;border-radius:10px;padding:5px 9px;transition:opacity .3s ease,transform .3s ease}
  .glabel{font-size:14px;color:#8a7c66;white-space:nowrap;letter-spacing:.5px;line-height:1}
  .gctrl{display:flex;align-items:center;gap:6px;flex:1;min-height:40px}
  .gctrl label{font-size:14px;cursor:pointer;white-space:nowrap;color:#3d3830}
  button{border:0;border-radius:8px;padding:9px 13px;font-size:15px;font-family:inherit;cursor:pointer;background:#2563eb;color:#fff;transition:background .15s;white-space:nowrap}
  button:hover{background:#1d4ed8}
  button.secondary{background:#6b7280}
  button.secondary:hover{background:#4b5563}
  button.step{padding:6px 10px}
  button:disabled{opacity:.35;cursor:default}
  select{border:1px solid #94a3b8;border-radius:8px;padding:7px 8px;font-size:14px;font-family:inherit;background:linear-gradient(#fdfefe,#dbe4ee);color:#334155;cursor:pointer}
  /* 物理按压两态钮（照 c5s1/c5s3）：凸起渐变→按下内凹 */
  button#btn-table,button#btn-flow,button#btn-far,button#btn-near{border:1px solid #94a3b8;background:linear-gradient(#fdfefe,#dbe4ee);color:#334155;box-shadow:0 2px 3px rgba(30,41,59,.25);transition:all .12s}
  button#btn-table:hover,button#btn-flow:hover,button#btn-far:hover,button#btn-near:hover{background:linear-gradient(#f8fafc,#d2deeb)}
  button#btn-table.on,button#btn-flow.on,button#btn-far.on,button#btn-near.on{background:#b9c7d6;border-color:#64748b;box-shadow:inset 0 2px 5px rgba(30,41,59,.35);transform:translateY(1px)}
  input#rng-tube{width:150px;accent-color:#d97706}
  #lbl-tube{font-size:15px;color:#854d0e;min-width:92px;text-align:right;font-variant-numeric:tabular-nums}
  .ctrlbar.compact .glabel{font-size:14px}
  .ctrlbar.compact .gctrl{min-height:32px}
  .ctrlbar.compact .gctrl label{font-size:14px}
  .ctrlbar.compact button{padding:5px 7px;font-size:14px}
  .ctrlbar.compact select{padding:4px 5px;font-size:13px}
  .ctrlbar.compact input#rng-tube{width:110px}
  .ctrlbar.compact #lbl-tube{font-size:14px;min-width:0}
  /* 读数面板（幽灵化浮层，照 c5s3） */
  .rec-panel{display:none;position:absolute;top:12px;right:12px;min-width:340px;max-width:min(560px,92vw);background:rgba(255,255,255,0.45);border-radius:16px;padding:14px 18px;z-index:15}
  .rec-panel.show{display:block}
  .rec-panel .rp-title{font-size:20px;font-weight:600;color:#b45309;margin-bottom:8px}
  table.rec{border-collapse:collapse;font-size:16px;background:transparent;width:100%}
  table.rec th,table.rec td{border:none;border-bottom:1px solid rgba(0,0,0,.08);padding:7px 11px;text-align:left;white-space:nowrap;color:#1e293b}
  table.rec th{background:transparent;font-weight:400;color:#64748b;width:128px}
  table.rec td{font-weight:600}
  /* 橙色居中解说条 hint（照 c5s3 I7）：× 关闭=同分支不再自动重弹 */
  #toast{display:none;position:absolute;left:50%;top:4%;transform:translateX(-50%);max-width:70%;background:rgba(255,244,214,.96);border:1px solid #e0a20a;color:#5b3a00;font-size:17px;line-height:1.65;letter-spacing:.02em;font-weight:600;padding:12px 34px 12px 18px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:16;text-align:left}
  #toast.show{display:block}
  #toast svg{vertical-align:middle;margin:2px 4px}
  #toast-x{position:absolute;top:5px;right:11px;cursor:pointer;color:#8a7c66;font-size:19px;line-height:1;user-select:none}
  #toast-x:hover{color:#3d3830}
  html.pseudo-fs{width:100%;height:100%}
  html.pseudo-fs body{position:fixed;top:0;left:0;right:0;bottom:0;width:100vw;height:100vh;z-index:2147483000;overflow:hidden}
</style>
</head>
<body>
<header>
  <div class="title">第5章 第5节 跨学科实践：制作望远镜 · 望远镜组装台</div>
  <a class="back" href="./index.html">← 返回实验卡页</a>
</header>
<div class="scene-wrap">
<canvas id="scene"></canvas>
<div class="rec-panel" id="panel-read">
  <div class="rp-title">读数面板</div>
  <table class="rec"><tbody>
    <tr><th>物镜焦距 f物</th><td id="pr-fobj">—</td></tr>
    <tr><th>目镜焦距 f目</th><td id="pr-feye">—</td></tr>
    <tr><th>镜筒距离</th><td id="pr-tube">—</td></tr>
    <tr><th>放大倍率</th><td id="pr-mag">—</td></tr>
  </tbody></table>
</div>
<div id="toast"><span id="toast-txt"></span><span id="toast-x">×</span></div>
</div>
<div class="ctrlbar">
  <div class="group" id="grp-equip">
    <div class="glabel">器材</div>
    <div class="gctrl">
      <label>f物 <select id="sel-fobj"><option value="20" selected>20 cm</option><option value="30">30 cm</option></select></label>
      <label>f目 <select id="sel-feye"><option value="10" selected>10 cm</option><option value="15">15 cm</option></select></label>
    </div>
  </div>
  <div class="group" id="grp-tube">
    <div class="glabel">镜筒长度</div>
    <div class="gctrl">
      <button id="btn-tube-down" class="secondary step">◀</button>
      <input type="range" id="rng-tube" min="22" max="52" step="0.5" value="30">
      <span id="lbl-tube">L = 30.0 cm</span>
      <button id="btn-tube-up" class="secondary step">▶</button>
    </div>
  </div>
  <div class="group" id="grp-act">
    <div class="glabel">动作</div>
    <div class="gctrl">
      <button id="btn-far" class="on">物距最远</button>
      <button id="btn-near">物距较近</button>
    </div>
  </div>
  <div class="group" id="grp-show">
    <div class="glabel">显示</div>
    <div class="gctrl">
      <button id="btn-flow">光流</button>
    </div>
  </div>
  <div class="group" id="grp-sys">
    <div class="glabel">系统</div>
    <div class="gctrl">
      <button id="btn-table" class="on">读数面板</button>
      <button id="btn-reset" class="secondary">重置</button>
      <button id="btn-mute">🔊</button>
      <button id="btn-full" class="secondary">全屏</button>
    </div>
  </div>
</div>
<script src="../_lib/v1/props.js?v=96"></script>
<script src="../_lib/v1/props-optics.js?v=9"></script>
<script src="../_lib/v1/sfx.js?v=1"></script>
<script src="exp-telescope-core.js?v=2"></script>
</body>
</html>
