<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfdfe"/><stop offset="1" stop-color="#d8e6ef"/>
    </linearGradient>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8d4ee"/><stop offset="1" stop-color="#e2f0f8"/>
    </linearGradient>
    <linearGradient id="frame2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d7681"/><stop offset="1" stop-color="#4c545d"/>
    </linearGradient>
  </defs>

  <!-- 亮底渐变 -->
  <rect width="640" height="360" fill="url(#bg2)"/>

  <!-- 车厢窗框（第一人称内视角，静止主体） -->
  <rect x="44" y="28" width="552" height="286" rx="26" fill="url(#frame2)"/>
  <rect x="64" y="48" width="512" height="246" rx="16" fill="url(#sky2)"/>
  <!-- 玻璃斜向反光 -->
  <path d="M96 294 L240 48 L300 48 L156 294 Z" fill="#ffffff" opacity="0.22"/>
  <path d="M330 294 L474 48 L502 48 L358 294 Z" fill="#ffffff" opacity="0.12"/>

  <!-- 窗外远景：山与田野 -->
  <path d="M64 214 Q160 150 268 210 Q360 156 460 208 Q530 172 576 212 L576 294 L64 294 Z" fill="#9dc28a"/>
  <path d="M64 246 L576 246 L576 294 L64 294 Z" fill="#b7cf9a"/>
  <!-- 近处地面（车窗外掠过） -->
  <rect x="64" y="272" width="512" height="22" fill="#8a9c74"/>

  <!-- 电线杆两根（窗外景物，向左后方掠过的示意） -->
  <g fill="#5d4a38">
    <rect x="392" y="96" width="12" height="176"/>
    <rect x="368" y="118" width="60" height="8" rx="3"/>
    <rect x="374" y="140" width="48" height="7" rx="3"/>
  </g>
  <g fill="#6e5a46">
    <rect x="184" y="130" width="9" height="142"/>
    <rect x="166" y="148" width="45" height="6" rx="3"/>
  </g>
  <!-- 电线 -->
  <path d="M188 136 Q290 158 396 102" fill="none" stroke="#4a4f57" stroke-width="2"/>
  <path d="M190 152 Q292 176 396 124" fill="none" stroke="#4a4f57" stroke-width="1.6" opacity="0.8"/>

  <!-- 蓝色示意箭头：以车窗为参照物，电线杆向后运动 -->
  <g>
    <line x1="352" y1="84" x2="252" y2="84" stroke="#2f6fb5" stroke-width="4" stroke-linecap="round"/>
    <polygon points="252,84 268,76 268,92" fill="#2f6fb5"/>
    <line x1="164" y1="112" x2="112" y2="112" stroke="#2f6fb5" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
    <polygon points="112,112 124,106 124,118" fill="#2f6fb5" opacity="0.75"/>
  </g>

  <!-- 窗台与说明 -->
  <rect x="36" y="306" width="568" height="18" rx="8" fill="#59616b"/>
  <text x="320" y="348" font-family="-apple-system,'PingFang SC',sans-serif" font-size="17" font-weight="700" fill="#33506b" text-anchor="middle">选车窗为参照物 · 电线杆向后运动</text>
</svg>
