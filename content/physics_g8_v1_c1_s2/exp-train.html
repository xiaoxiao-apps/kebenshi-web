<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>实验：列车错觉 · 参照物选择</title>
<link rel="stylesheet" href="common.css">
<style>
  .hint-bar {
    background: var(--brown-bg); color: var(--brown);
    border: 1px solid rgba(139,105,20,.15); border-radius: 10px;
    padding: 10px 14px; font-size: 14px; line-height: 1.6;
    margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
  }
  .stage { position: relative; border-radius: 12px; overflow: hidden; background: #e8e2d8; }
  .stage canvas { display: block; width: 100%; height: 320px; }
  @media (max-width: 768px) { .stage canvas { height: 260px; } }
  .controls { margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .ref-pills { display: none; gap: 8px; align-items: center; }
  .ref-pills.show { display: flex; animation: pillsIn .25s ease; }
  @keyframes pillsIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .pill {
    border: none; border-radius: 99px; padding: 8px 16px; font-size: 14px; font-weight: 700;
    cursor: pointer; background: var(--card2); color: var(--ink); transition: all .25s;
  }
  .pill.active { background: var(--cyan-bg); color: var(--cyan); box-shadow: 0 0 0 2px var(--cyan-hi); }
  .conclusion {
    margin-top: 12px; padding: 16px; border-radius: 10px; background: #fff;
    border: 1px solid rgba(0,0,0,.08); font-size: 15px; line-height: 1.7;
    transform: translateY(20px); opacity: 0; transition: all .25s ease;
  }
  .conclusion.show { transform: translateY(0); opacity: 1; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 13px; font-weight: 700; margin-left: 6px; }
  .badge.still { background: var(--green-bg); color: var(--green); }
  .badge.move { background: var(--red-bg); color: var(--red); }
  #peekNote {
    margin-top: 10px; font-size: 15px; font-weight: 700; color: var(--brown);
    text-align: center; opacity: 0; transition: opacity .25s;
  }
  #peekNote.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
  <a class="back-btn" data-back href="experiment.html">‹ 返回实验区</a>
  <div class="page-header">
    <h1 class="page-title">列车错觉</h1>
    <p class="page-subtitle">先体验“自己的列车动了”的错觉，再找出原因。</p>
  </div>
  <div class="card">
    <h2>想想议议：并排列车 <span class="chip cyan">相对性</span></h2>
    <div class="hint-bar">你坐在停站的列车里，先体验一个错觉，再找原因。</div>
    <div class="fullscreen-wrap" id="fsTrainWrap">
      <button class="fullscreen-btn" id="fsTrainBtn" title="全屏">⛶</button>
      <div class="stage" id="trainStage">
        <canvas id="trainCv"></canvas>
      </div>
      <div id="peekNote"></div>
    </div>
    <div class="controls">
      <button class="btn btn-primary" id="mainBtn">▶ 坐在车厢里</button>
      <div class="ref-pills" id="refPills">
        <span style="font-size:13px;color:var(--ink2);">以谁为参照物？</span>
        <button class="pill active" data-ref="platform">🚉 站台</button>
        <button class="pill" data-ref="other">🚄 旁边列车</button>
      </div>
    </div>
    <div class="conclusion" id="conclusion"></div>
  </div>
</div>
<script src="fullscreen.js"></script>
<script src="exp-common.js"></script>
<script src="exp-back.js"></script>
<script>
(function(){
  'use strict';
  var cv = document.getElementById('trainCv');
  var ctx = cv.getContext('2d');
  var mainBtn = document.getElementById('mainBtn');
  var refPills = document.getElementById('refPills');
  var conclusion = document.getElementById('conclusion');
  var wrap = document.getElementById('fsTrainWrap');
  var peekNote = document.getElementById('peekNote');

  var ST = {
    SIT: 0,
    FEEL: 1,
    PEEK: 2,
    VERIFY: 3,
    CONCLUSION: 4
  };
  var state = { step: ST.SIT, ref: 'platform', otherX: 0, peekStart: 0 };
  var info = [];
  info[ST.SIT] = { text: '▶ 坐在车厢里', next: ST.FEEL };
  info[ST.FEEL] = { text: '🔍 凑近玻璃看站台', next: ST.PEEK };
  info[ST.PEEK] = { text: '⏳ 正在凑近…', next: ST.VERIFY };
  info[ST.VERIFY] = { text: '📖 结论', next: ST.CONCLUSION };
  info[ST.CONCLUSION] = { text: '⟲ 再体验一次', next: ST.SIT };

  var cvW = 300, cvH = 300;
  function fit(){
    var info = fitCanvas(cv, window.innerWidth <= 768 ? 260 : 320);
    ctx = info.ctx;
    cvW = info.w;
    cvH = info.h;
  }

  function norm(a, b){
    var dx = a[0]-b[0], dy = a[1]-b[1];
    var L = Math.sqrt(dx*dx + dy*dy) || 1;
    return [dx/L, dy/L];
  }
  function holeCorners(p){
    var s = [[0.30,0.12],[0.96,0.05],[0.96,0.68],[0.30,0.60]];
    var b = [[0,0],[1,0],[1,1],[0,1]];
    var pts = [];
    for (var i = 0; i < 4; i++) {
      pts.push([
        (s[i][0] + (b[i][0]-s[i][0]) * p) * cvW,
        (s[i][1] + (b[i][1]-s[i][1]) * p) * cvH
      ]);
    }
    return { pts: pts, r: 16 * (1 - p) };
  }
  function holePath(hole){
    var pts = hole.pts, r = hole.r;
    if (r <= 0.5) {
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (var i = 1; i < 4; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    } else {
      for (var j = 0; j < 4; j++) {
        var cur = pts[j], prv = pts[(j+3)%4], nxt = pts[(j+1)%4];
        var v1 = norm(prv, cur), v2 = norm(nxt, cur);
        var a = [cur[0]+v1[0]*r, cur[1]+v1[1]*r];
        var b2 = [cur[0]+v2[0]*r, cur[1]+v2[1]*r];
        if (j === 0) ctx.moveTo(a[0], a[1]); else ctx.lineTo(a[0], a[1]);
        ctx.quadraticCurveTo(cur[0], cur[1], b2[0], b2[1]);
      }
    }
    ctx.closePath();
  }

  function drawScene(){
    var w = cvW, h = cvH;

    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = '#e8e2d8'; ctx.fillRect(0,0,w,h);

    // ---- world: dusk side-view layers (platform never moves) ----
    var sky = ctx.createLinearGradient(0, 0, 0, h*0.42);
    sky.addColorStop(0, '#f7c877'); sky.addColorStop(1, '#fde8c8');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, w, h*0.42);
    var sunGlow = ctx.createRadialGradient(w*0.75, h*0.40, 0, w*0.75, h*0.40, w*0.3);
    sunGlow.addColorStop(0, 'rgba(255,190,90,0.5)'); sunGlow.addColorStop(1, 'rgba(255,190,90,0)');
    ctx.fillStyle = sunGlow; ctx.fillRect(0, 0, w, h*0.42);
    ctx.strokeStyle = '#6b5b45'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, h*0.10); ctx.lineTo(w, h*0.10);
    ctx.moveTo(0, h*0.16); ctx.lineTo(w, h*0.16); ctx.stroke();
    ctx.fillStyle = '#7a6a55'; ctx.fillRect(0, h*0.30, w, h*0.08);
    ctx.fillStyle = '#5f5240'; ctx.fillRect(0, h*0.375, w, 3);
    ctx.fillStyle = '#f5d9a8';
    for (var lx = 0.06; lx < 1; lx += 0.12) ctx.fillRect(w*lx, h*0.375, w*0.02, 3);
    ctx.fillStyle = '#8b7355';
    var pillars = [0.15, 0.38, 0.62, 0.85];
    for (var i = 0; i < 4; i++) ctx.fillRect(w*pillars[i]-7, h*0.38, 14, h*0.22);
    ctx.fillRect(w*0.50-1.5, h*0.34, 3, h*0.26);
    ctx.fillStyle = '#f5d9a8';
    ctx.beginPath(); ctx.ellipse(w*0.50-8, h*0.34, 7, 4, 0, 0, Math.PI*2);
    ctx.ellipse(w*0.50+8, h*0.34, 7, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#cbb9a2'; ctx.fillRect(0, h*0.60, w, h*0.14);
    ctx.fillStyle = '#8b7355'; ctx.fillRect(0, h*0.60, w, h*0.015);
    ctx.font = '12px sans-serif'; ctx.fillText('站台', w*0.16, h*0.68);
    ctx.fillStyle = '#9a8a76'; ctx.fillRect(0, h*0.74, w, h*0.26);
    ctx.fillStyle = '#857663';
    for (var sx = 0; sx < 1; sx += 0.06) ctx.fillRect(w*sx, h*0.78, w*0.025, h*0.14);
    ctx.fillStyle = '#4a4038'; ctx.fillRect(0, h*0.80, w, 3); ctx.fillRect(0, h*0.90, w, 3);
    ctx.fillStyle = '#c9bda9'; ctx.fillRect(0, h*0.80, w, 1); ctx.fillRect(0, h*0.90, w, 1);
    function drawTrain(ox, alpha) {
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#5c8ea3'; ctx.fillRect(ox, h*0.10, w*3.6, h*0.48);
      ctx.fillStyle = '#476e80'; ctx.fillRect(ox, h*0.10, w*3.6, h*0.02);
      ctx.fillStyle = '#a8d8ea';
      for (var k = 0; k < 16; k++) ctx.fillRect(ox + w*0.06 + k*w*0.22, h*0.18, w*0.13, h*0.18);
      ctx.fillStyle = '#476e80';
      for (var d = 0; d < 8; d++) ctx.fillRect(ox + w*0.44*d + w*0.20, h*0.18, 2, h*0.30);
      ctx.fillStyle = '#3f3f3f'; ctx.fillRect(ox, h*0.58, w*3.6, h*0.04);
      ctx.globalAlpha = 1;
    }
    var moving = state.step !== ST.SIT;
    if (moving) for (var g = 3; g >= 1; g--) drawTrain(state.otherX + g*12, 0.18);
    drawTrain(state.otherX, 1);
    if (state.step === ST.PEEK || state.step === ST.VERIFY || state.step === ST.CONCLUSION) {
      ctx.fillStyle = '#3a3a3a'; ctx.beginPath();
      ctx.arc(state.otherX + w*0.4, h*0.60, 14, 0, Math.PI*2);
      ctx.arc(state.otherX + w*1.6, h*0.60, 14, 0, Math.PI*2);
      ctx.fill();
    }

    // carriage inner wall mask: only the window opening reveals the scene
    var p = 0;
    if(state.step === ST.PEEK){
      p = (performance.now() - state.peekStart) / 1200;
      if(p > 1) p = 1;
      p = p < 0.5 ? 2*p*p : 1 - Math.pow(-2*p+2, 2)/2;
    } else if(state.step === ST.VERIFY || state.step === ST.CONCLUSION){
      p = 1;
    }
    var hole = holeCorners(p);
    ctx.fillStyle = '#efe9dd';
    ctx.beginPath();
    ctx.rect(0, 0, w, h);
    holePath(hole);
    ctx.fill('evenodd');
    if (p < 1) {
      ctx.fillStyle = '#e5d9c4';
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(w,0); ctx.lineTo(w,h*0.04); ctx.lineTo(0,h*0.14); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#f5d9a8';
      ctx.beginPath(); ctx.moveTo(w*0.05,h*0.045); ctx.lineTo(w*0.55,h*0.018); ctx.lineTo(w*0.55,h*0.030); ctx.lineTo(w*0.05,h*0.065); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(w*0.10,h*0.085); ctx.lineTo(w*0.60,h*0.040); ctx.lineTo(w*0.60,h*0.050); ctx.lineTo(w*0.10,h*0.105); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#efe9dd';
      ctx.beginPath(); ctx.moveTo(0,h*0.60); ctx.lineTo(w*0.30,h*0.60); ctx.lineTo(w*0.96,h*0.68); ctx.lineTo(w,h*0.68); ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#d8cbb4'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0,h*0.78); ctx.lineTo(w,h*0.82); ctx.stroke();
      ctx.fillStyle = '#c9a276'; ctx.strokeStyle = '#8b7355'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(w*0.01, h*0.50, w*0.13, h*0.50, 10); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.roundRect(w*0.03, h*0.44, w*0.09, h*0.07, 6); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.roundRect(w*0.15, h*0.46, w*0.11, h*0.40, 8); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.roundRect(w*0.165, h*0.41, w*0.08, h*0.06, 5); ctx.fill(); ctx.stroke();
      ctx.beginPath(); holePath(hole); ctx.strokeStyle = '#6b4f2a'; ctx.lineWidth = 10; ctx.stroke();
      ctx.beginPath(); holePath(hole); ctx.strokeStyle = '#b09468'; ctx.lineWidth = 2; ctx.stroke();
      ctx.save(); ctx.beginPath(); holePath(hole); ctx.clip();
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.beginPath(); ctx.moveTo(w*0.45,0); ctx.lineTo(w*0.60,0); ctx.lineTo(w*0.35,h); ctx.lineTo(w*0.20,h); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(w*0.70,0); ctx.lineTo(w*0.78,0); ctx.lineTo(w*0.53,h); ctx.lineTo(w*0.45,h); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  function update(dt){
    var w = cvW;
    var s = dt / 1000;
    if(state.step === ST.FEEL){
      state.otherX -= 0.35 * w * s;
    } else if(state.step === ST.VERIFY || state.step === ST.CONCLUSION){
      state.otherX -= 0.08 * w * s;
    }
    if(state.step === ST.SIT || state.step === ST.FEEL){
      // 车尾右缘不得低于 0.98w，SIT/FEEL 车窗内只见连续旁车
      state.otherX = Math.max(state.otherX, 0.98 * w - 3.6 * w);
    } else {
      // PEEK 起解除 clamp，车尾滑出揭示站台/立柱
      state.otherX = Math.max(state.otherX, -4.6 * w);
    }
    if(state.step === ST.PEEK){
      var p = (performance.now() - state.peekStart) / 1200;
      if(p >= 1){ setStep(ST.VERIFY); }
    }
  }

  var last = performance.now();
  var rafId = null;
  function loop(now){
    var dt = now - last; last = now;
    update(dt);
    drawScene();
    rafId = requestAnimationFrame(loop);
  }

  function setStep(next){
    state.step = next;
    if(next === ST.PEEK){
      state.peekStart = performance.now();
      mainBtn.disabled = true;
    } else {
      mainBtn.disabled = false;
    }
    if(next === ST.VERIFY){
      refPills.classList.add('show');
      peekNote.innerHTML = '站台没有动——是旁边的列车在后退。';
      peekNote.classList.add('show');
    }
    if(next === ST.SIT){
      state.otherX = 0;
      state.peekStart = 0;
      peekNote.innerHTML = '';
      peekNote.classList.remove('show');
      refPills.classList.remove('show');
      conclusion.classList.remove('show');
    }
    mainBtn.textContent = info[state.step].text;
    if(state.step === ST.CONCLUSION){ showConclusion(); }
    if(!rafId){ rafId = requestAnimationFrame(loop); }
  }
  mainBtn.addEventListener('click', function(){
    var cur = state.step;
    var next = info[cur].next;
    if(cur === ST.CONCLUSION) next = ST.SIT;
    setStep(next);
  });

  function showConclusion(){
    var refText = state.ref === 'platform' ? '站台' : '旁边列车';
    var result = state.ref === 'platform' ? '静止' : '运动';
    var badgeClass = state.ref === 'platform' ? 'still' : 'move';
    conclusion.innerHTML = '以【' + refText + '】为参照物，你乘坐的列车：<span class="badge ' + badgeClass + '">' + result + '</span><br><small>真相：自己的列车没动，是旁边列车在后退。</small>';
    conclusion.classList.add('show');
  }

  document.querySelectorAll('#refPills .pill').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('#refPills .pill').forEach(function(p){ p.classList.remove('active'); });
      btn.classList.add('active');
      state.ref = btn.dataset.ref;
      if(state.step === ST.VERIFY){ showConclusion(); }
    });
  });

  FullscreenHelper.bind(wrap, document.getElementById('fsTrainBtn'));
  window.addEventListener('resize', fit);
  fit();
  rafId = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
