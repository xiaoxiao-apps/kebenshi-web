<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>实验：列车错觉 · 参照物选择</title>
<link rel="stylesheet" href="common.css">
<style>
  .hint-bar {
    background: var(--brown-bg); color: var(--brown);
    border: 1px solid rgba(139,105,20,.15); border-radius: 10px;
    padding: 10px 14px; font-size: 14px; line-height: 1.6;
    margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
  }
  .stage { position: relative; border-radius: 12px; overflow: hidden; background: #e8e2d8; }
  .stage canvas { display: block; width: 100%; height: 320px; }
  @media (max-width: 768px) { .stage canvas { height: 260px; } }
  .controls { margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .ref-pills { display: none; gap: 8px; align-items: center; }
  .ref-pills.show { display: flex; animation: pillsIn .25s ease; }
  @keyframes pillsIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .pill {
    border: none; border-radius: 99px; padding: 8px 16px; font-size: 14px; font-weight: 700;
    cursor: pointer; background: var(--card2); color: var(--ink); transition: all .25s;
  }
  .pill.active { background: var(--cyan-bg); color: var(--cyan); box-shadow: 0 0 0 2px var(--cyan-hi); }
  .conclusion {
    margin-top: 12px; padding: 16px; border-radius: 10px; background: #fff;
    border: 1px solid rgba(0,0,0,.08); font-size: 15px; line-height: 1.7;
    transform: translateY(20px); opacity: 0; transition: all .25s ease;
  }
  .conclusion.show { transform: translateY(0); opacity: 1; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 13px; font-weight: 700; margin-left: 6px; }
  .badge.still { background: var(--green-bg); color: var(--green); }
  .badge.move { background: var(--red-bg); color: var(--red); }
  #peekNote {
    margin-top: 10px; font-size: 15px; font-weight: 700; color: var(--brown);
    text-align: center; opacity: 0; transition: opacity .25s;
  }
  #peekNote.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
  <a class="back-btn" data-back href="experiment.html">‹ 返回实验区</a>
  <div class="page-header">
    <h1 class="page-title">列车错觉</h1>
    <p class="page-subtitle">先体验“自己的列车动了”的错觉，再找出原因。</p>
  </div>
  <div class="card">
    <h2>想想议议：并排列车 <span class="chip cyan">相对性</span></h2>
    <div class="hint-bar">你坐在停站的列车里，先体验一个错觉，再找原因。</div>
    <div class="fullscreen-wrap" id="fsTrainWrap">
      <button class="fullscreen-btn" id="fsTrainBtn" title="全屏">⛶</button>
      <div class="stage" id="trainStage">
        <canvas id="trainCv"></canvas>
      </div>
      <div id="peekNote"></div>
    </div>
    <div class="controls">
      <button class="btn btn-primary" id="mainBtn">▶ 坐在车厢里</button>
      <div class="ref-pills" id="refPills">
        <span style="font-size:13px;color:var(--ink2);">以谁为参照物？</span>
        <button class="pill active" data-ref="platform">🚉 站台</button>
        <button class="pill" data-ref="other">🚄 旁边列车</button>
      </div>
    </div>
    <div class="conclusion" id="conclusion"></div>
  </div>
</div>
<script src="fullscreen.js"></script>
<script src="exp-common.js"></script>
<script src="exp-back.js"></script>
<script>
(function(){
  'use strict';
  var cv = document.getElementById('trainCv');
  var ctx = cv.getContext('2d');
  var mainBtn = document.getElementById('mainBtn');
  var refPills = document.getElementById('refPills');
  var conclusion = document.getElementById('conclusion');
  var wrap = document.getElementById('fsTrainWrap');
  var peekNote = document.getElementById('peekNote');

  var ST = {
    SIT: 0,
    FEEL: 1,
    PEEK: 2,
    VERIFY: 3,
    CONCLUSION: 4
  };
  var state = { step: ST.SIT, ref: 'platform', otherX: 0, peekStart: 0 };
  var info = [];
  info[ST.SIT] = { text: '▶ 坐在车厢里', next: ST.FEEL };
  info[ST.FEEL] = { text: '🔍 凑近玻璃看站台', next: ST.PEEK };
  info[ST.PEEK] = { text: '⏳ 正在凑近…', next: ST.VERIFY };
  info[ST.VERIFY] = { text: '📖 结论', next: ST.CONCLUSION };
  info[ST.CONCLUSION] = { text: '⟲ 再体验一次', next: ST.SIT };

  var cvW = 300, cvH = 300;
  function fit(){
    var info = fitCanvas(cv, window.innerWidth <= 768 ? 260 : 320);
    ctx = info.ctx;
    cvW = info.w;
    cvH = info.h;
  }

  function holeFor(step){
    if(step === ST.VERIFY || step === ST.CONCLUSION){
      return { x: 0, y: 0, w: cvW, h: cvH };
    }
    return { x: cvW*0.03, y: cvH*0.10, w: cvW*0.94, h: cvH*0.50 };
  }

  function drawScene(){
    var w = cvW, h = cvH;

    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = '#e8e2d8'; ctx.fillRect(0,0,w,h);

    // platform (fixed world coordinates, never moves)
    ctx.fillStyle = '#d4c5b0'; ctx.fillRect(0, h*0.72, w, h*0.08);
    ctx.fillStyle = '#a89878'; ctx.fillRect(0, h*0.715, w, 4);
    ctx.fillStyle = '#b5a48a';
    var pillars = [w*0.15, w*0.38, w*0.62, w*0.85];
    for(var i=0;i<pillars.length;i++){ ctx.fillRect(pillars[i]-8, h*0.45, 16, h*0.27); }
    ctx.fillStyle = '#8b7355'; ctx.font = '12px sans-serif';
    ctx.fillText('站台', pillars[0]+22, h*0.52);

    // other train (moves left as it departs)
    var ox = state.otherX;
    ctx.fillStyle = '#5c8ea3'; ctx.fillRect(ox, h*0.06, w*3.6, h*0.54);
    ctx.fillStyle = '#a8d8ea';
    for(var k=0;k<16;k++){ ctx.fillRect(ox + 40 + k*w*0.22, h*0.14, w*0.13, h*0.20); }
    if(state.step === ST.PEEK || state.step === ST.VERIFY || state.step === ST.CONCLUSION){
      ctx.fillStyle = '#3a3a3a'; ctx.beginPath();
      ctx.arc(ox + w*0.4, h*0.56, 16, 0, Math.PI*2);
      ctx.arc(ox + w*1.6, h*0.56, 16, 0, Math.PI*2);
      ctx.fill();
    }

    // carriage inner wall mask: only the window opening reveals the scene
    var small = holeFor(ST.SIT);
    var big = holeFor(ST.VERIFY);
    var p = 0;
    if(state.step === ST.PEEK){
      p = (performance.now() - state.peekStart) / 1200;
      if(p > 1) p = 1;
      p = p < 0.5 ? 2*p*p : 1 - Math.pow(-2*p+2, 2)/2;
    } else if(state.step === ST.VERIFY || state.step === ST.CONCLUSION){
      p = 1;
    }
    var hole = {
      x: small.x + (big.x - small.x) * p,
      y: small.y + (big.y - small.y) * p,
      w: small.w + (big.w - small.w) * p,
      h: small.h + (big.h - small.h) * p
    };
    ctx.fillStyle = '#efe9dd';
    ctx.beginPath();
    ctx.rect(0, 0, w, h);
    ctx.rect(hole.x, hole.y, hole.w, hole.h);
    ctx.fill('evenodd');

    // window frame around the opening
    ctx.strokeStyle = '#8b7355'; ctx.lineWidth = 8;
    ctx.strokeRect(hole.x, hole.y, hole.w, hole.h);
  }

  function update(dt){
    var w = cvW;
    var s = dt / 1000;
    if(state.step === ST.FEEL){
      state.otherX -= 0.35 * w * s;
    } else if(state.step === ST.VERIFY || state.step === ST.CONCLUSION){
      state.otherX -= 0.08 * w * s;
    }
    if(state.step === ST.SIT || state.step === ST.FEEL){
      // 车尾右缘不得低于 0.98w，SIT/FEEL 车窗内只见连续旁车
      state.otherX = Math.max(state.otherX, 0.98 * w - 3.6 * w);
    } else {
      // PEEK 起解除 clamp，车尾滑出揭示站台/立柱
      state.otherX = Math.max(state.otherX, -4.6 * w);
    }
    if(state.step === ST.PEEK){
      var p = (performance.now() - state.peekStart) / 1200;
      if(p >= 1){ setStep(ST.VERIFY); }
    }
  }

  var last = performance.now();
  var rafId = null;
  function loop(now){
    var dt = now - last; last = now;
    update(dt);
    drawScene();
    rafId = requestAnimationFrame(loop);
  }

  function setStep(next){
    state.step = next;
    if(next === ST.PEEK){
      state.peekStart = performance.now();
      mainBtn.disabled = true;
    } else {
      mainBtn.disabled = false;
    }
    if(next === ST.VERIFY){
      refPills.classList.add('show');
      peekNote.innerHTML = '站台没有动——是旁边的列车在后退。';
      peekNote.classList.add('show');
    }
    if(next === ST.SIT){
      state.otherX = 0;
      state.peekStart = 0;
      peekNote.innerHTML = '';
      peekNote.classList.remove('show');
      refPills.classList.remove('show');
      conclusion.classList.remove('show');
    }
    mainBtn.textContent = info[state.step].text;
    if(state.step === ST.CONCLUSION){ showConclusion(); }
    if(!rafId){ rafId = requestAnimationFrame(loop); }
  }
  mainBtn.addEventListener('click', function(){
    var cur = state.step;
    var next = info[cur].next;
    if(cur === ST.CONCLUSION) next = ST.SIT;
    setStep(next);
  });

  function showConclusion(){
    var refText = state.ref === 'platform' ? '站台' : '旁边列车';
    var result = state.ref === 'platform' ? '静止' : '运动';
    var badgeClass = state.ref === 'platform' ? 'still' : 'move';
    conclusion.innerHTML = '以【' + refText + '】为参照物，你乘坐的列车：<span class="badge ' + badgeClass + '">' + result + '</span><br><small>真相：自己的列车没动，是旁边列车在后退。</small>';
    conclusion.classList.add('show');
  }

  document.querySelectorAll('#refPills .pill').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('#refPills .pill').forEach(function(p){ p.classList.remove('active'); });
      btn.classList.add('active');
      state.ref = btn.dataset.ref;
      if(state.step === ST.VERIFY){ showConclusion(); }
    });
  });

  FullscreenHelper.bind(wrap, document.getElementById('fsTrainBtn'));
  window.addEventListener('resize', fit);
  fit();
  rafId = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
