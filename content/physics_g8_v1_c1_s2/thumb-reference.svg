<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#5ad7ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#5ad7ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 深底 -->
  <rect x="0" y="0" width="600" height="360" rx="0" fill="#0b0e13"/>
  <rect x="0" y="0" width="600" height="360" fill="url(#glow)"/>

  <!-- 路面 -->
  <g>
    <rect x="0" y="272" width="600" height="46" fill="#1a2233"/>
    <line x1="0" y1="272" x2="600" y2="272" stroke="#2f3c58" stroke-width="2"/>
    <line x1="0" y1="295" x2="600" y2="295" stroke="#5a6a85" stroke-width="3" stroke-dasharray="34 26"/>
    <rect x="0" y="318" width="600" height="42" fill="#10151f"/>
  </g>

  <!-- 路边树木（左） -->
  <g>
    <rect x="96" y="208" width="13" height="66" rx="3" fill="#3d3122"/>
    <circle cx="102" cy="192" r="34" fill="#27674f"/>
    <circle cx="88" cy="170" r="22" fill="#2f7d5f"/>
    <circle cx="118" cy="166" r="18" fill="#2f7d5f"/>
    <rect x="166" y="234" width="10" height="40" rx="3" fill="#3d3122"/>
    <circle cx="171" cy="220" r="24" fill="#27674f"/>
    <circle cx="160" cy="206" r="14" fill="#2f7d5f"/>
  </g>

  <!-- 行驶的小汽车（中，向右） -->
  <g>
    <!-- 速度线 -->
    <g stroke="#5ad7ff" stroke-width="4" stroke-linecap="round" opacity="0.7">
      <line x1="212" y1="236" x2="272" y2="236"/>
      <line x1="196" y1="252" x2="266" y2="252"/>
      <line x1="220" y1="268" x2="270" y2="268"/>
    </g>
    <!-- 车身 -->
    <rect x="288" y="238" width="156" height="36" rx="12" fill="#4a9eff"/>
    <rect x="326" y="210" width="80" height="32" rx="10" fill="#2a3550"/>
    <rect x="334" y="216" width="30" height="20" rx="4" fill="#5ad7ff"/>
    <rect x="370" y="216" width="30" height="20" rx="4" fill="#5ad7ff"/>
    <rect x="440" y="248" width="10" height="8" rx="3" fill="#e8bb5e"/>
    <!-- 车轮 -->
    <circle cx="324" cy="278" r="15" fill="#2b3242" stroke="#8fa2c0" stroke-width="3"/>
    <circle cx="324" cy="278" r="5" fill="#5ad7ff"/>
    <circle cx="410" cy="278" r="15" fill="#2b3242" stroke="#8fa2c0" stroke-width="3"/>
    <circle cx="410" cy="278" r="5" fill="#5ad7ff"/>
  </g>

  <!-- 站台与行人（右）+ 金色参照环 -->
  <g>
    <!-- 金色参照环：突出“选谁当标准” -->
    <circle cx="524" cy="228" r="56" fill="none" stroke="#d9a441" stroke-width="2" stroke-dasharray="7 7" opacity="0.65"/>
    <circle cx="524" cy="228" r="46" fill="none" stroke="#e8bb5e" stroke-width="3.5"/>
    <!-- 站台 -->
    <rect x="466" y="254" width="118" height="20" rx="4" fill="#2a3550" stroke="#2f3c58" stroke-width="2"/>
    <!-- 行人 -->
    <circle cx="524" cy="206" r="11" fill="#e8d5b0"/>
    <rect x="516" y="218" width="16" height="24" rx="7" fill="#e06a6a"/>
    <line x1="520" y1="242" x2="518" y2="256" stroke="#2b3242" stroke-width="5" stroke-linecap="round"/>
    <line x1="528" y1="242" x2="530" y2="256" stroke="#2b3242" stroke-width="5" stroke-linecap="round"/>
    <!-- 环顶金标 -->
    <circle cx="524" cy="172" r="5" fill="#e8bb5e"/>
  </g>

  <!-- 点缀星芒 -->
  <g fill="#5ad7ff" opacity="0.7">
    <circle cx="330" cy="72" r="3"/>
    <circle cx="66" cy="96" r="2.5"/>
    <circle cx="552" cy="120" r="2.5"/>
    <circle cx="240" cy="140" r="2"/>
  </g>
  <g fill="#e8bb5e" opacity="0.6">
    <circle cx="452" cy="88" r="2.5"/>
    <circle cx="128" cy="60" r="2"/>
  </g>
</svg>
