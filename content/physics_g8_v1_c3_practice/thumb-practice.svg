<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- c3 本章练习缩略图：题卷+温度计小图+红笔批改（原创矢量） -->
  <defs>
    <linearGradient id="bgP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#e8f0f8"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bgP)"/>
  <!-- 题卷 -->
  <rect x="150" y="66" width="340" height="228" rx="18" fill="#ffffff" stroke="#dbe4ee" stroke-width="2"/>
  <rect x="150" y="66" width="340" height="52" rx="18" fill="#f59e0b"/>
  <rect x="150" y="100" width="340" height="18" fill="#f59e0b"/>
  <text x="320" y="100" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="sans-serif">📝 本章练习 · 自测卷</text>
  <g font-family="sans-serif">
    <!-- 第1题：单选 ABCD -->
    <text x="180" y="160" font-size="16" fill="#334155">1</text>
    <circle cx="222" cy="155" r="11" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="222" y="160" font-size="12" fill="#64748b" text-anchor="middle">A</text>
    <circle cx="262" cy="155" r="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="262" y="160" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">B</text>
    <circle cx="302" cy="155" r="11" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="302" y="160" font-size="12" fill="#64748b" text-anchor="middle">C</text>
    <circle cx="342" cy="155" r="11" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="342" y="160" font-size="12" fill="#64748b" text-anchor="middle">D</text>
    <text x="400" y="161" font-size="17" fill="#16a34a" font-weight="bold">✓</text>
    <!-- 第2题：温度计读数小题 -->
    <text x="180" y="212" font-size="16" fill="#334155">2</text>
    <rect x="205" y="178" width="126" height="58" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="243" y="184" width="10" height="38" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <rect x="245.5" y="196" width="5" height="26" fill="#dc2626"/>
    <circle cx="248" cy="226" r="7" fill="#dc2626" stroke="#b91c1c" stroke-width="1"/>
    <g stroke="#64748b" stroke-width="1">
      <line x1="253" y1="190" x2="259" y2="190"/><line x1="253" y1="196" x2="257" y2="196"/>
      <line x1="253" y1="202" x2="259" y2="202"/><line x1="253" y1="208" x2="257" y2="208"/>
      <line x1="253" y1="214" x2="259" y2="214"/>
    </g>
    <text x="266" y="190" font-size="9" fill="#64748b">℃</text>
    <line x1="248" y1="196" x2="292" y2="196" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="296" y="200" font-size="11" font-weight="bold" fill="#dc2626">?</text>
    <text x="400" y="212" font-size="17" fill="#16a34a" font-weight="bold">✓</text>
    <!-- 第3题：填空判错 -->
    <text x="180" y="258" font-size="16" fill="#334155">3</text>
    <rect x="205" y="242" width="126" height="26" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="215" y="259" font-size="13" fill="#b91c1c" text-decoration="line-through">98 ℃</text>
    <text x="400" y="259" font-size="17" fill="#dc2626" font-weight="bold">✗</text>
    <text x="424" y="259" font-size="12" fill="#2563eb">重做</text>
  </g>
  <!-- 铅笔 -->
  <g transform="rotate(38 118 268)">
    <rect x="104" y="200" width="26" height="110" rx="4" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
    <polygon points="104,310 130,310 117,338" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
    <polygon points="112,328 122,328 117,338" fill="#334155"/>
    <rect x="104" y="200" width="26" height="18" rx="4" fill="#f87171" stroke="#b45309" stroke-width="2"/>
  </g>
  <!-- 星星 -->
  <g fill="#f59e0b">
    <polygon points="540,110 546,126 563,126 549,136 554,152 540,142 526,152 531,136 517,126 534,126"/>
    <polygon points="556,220 560,231 572,231 562,238 566,249 556,242 546,249 550,238 540,231 552,231" opacity=".7"/>
  </g>
  <text x="320" y="42" font-size="26" font-weight="bold" fill="#b45309" text-anchor="middle" font-family="sans-serif">第三章「物态变化」原创自测</text>
  <text x="320" y="332" font-size="16" fill="#64748b" text-anchor="middle" font-family="sans-serif">即时判分 · 逐题解析 · 一键重做</text>
</svg>
