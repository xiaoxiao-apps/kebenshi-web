<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本章练习 · 第三章 物态变化</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#0f1218; color:#f2f5fa; -webkit-font-smoothing:antialiased; min-height:100vh; overflow-y:auto; }
  .wrap { max-width:860px; margin:0 auto; padding:24px 16px 72px; }
  header h1 { font-size:26px; font-weight:800; letter-spacing:1px; }
  header .sub { margin-top:8px; font-size:13px; color:#9aa4b5; line-height:1.7; }
  .panel { position:sticky; top:0; z-index:5; background:#0f1218; padding:14px 0 10px; }
  .prog { height:8px; background:#1c222e; border-radius:99px; overflow:hidden; }
  .prog i { display:block; height:100%; width:0; background:linear-gradient(90deg,#5ad7ff,#58d68d); border-radius:99px; transition:width .3s; }
  .prog-txt { margin-top:6px; font-size:12px; color:#9aa4b5; display:flex; justify-content:space-between; }
  #totalScore { color:#ffd479; font-weight:700; display:none; }
  .sec-head { display:flex; align-items:center; gap:10px; margin:26px 0 14px; }
  .sec-head h2 { font-size:19px; font-weight:800; }
  .sec-head .chip { font-size:11px; font-weight:600; color:#5ad7ff; background:rgba(90,215,255,.14); padding:3px 10px; border-radius:99px; white-space:nowrap; }
  .qcard { background:#171c26; border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:16px 18px; margin-bottom:14px; }
  .qno { display:inline-flex; align-items:center; gap:8px; margin-bottom:10px; }
  .qno b { font-size:14px; color:#5ad7ff; }
  .qno span { font-size:11px; color:#6b7686; }
  .stem { font-size:15px; line-height:1.9; color:#eef2f8; margin-bottom:8px; }
  .qnote { font-size:12px; color:#9aa4b5; line-height:1.7; background:rgba(255,212,121,.08); border-left:3px solid #ffd479; padding:8px 10px; border-radius:0 8px 8px 0; margin-bottom:10px; }
  .figbox { background:#0b0e13; border:1px solid rgba(255,255,255,.06); border-radius:10px; padding:12px 8px 8px; margin-bottom:10px; overflow-x:auto; }
  .figbox svg { width:100%; height:auto; display:block; min-width:280px; }
  .figcap { font-size:11px; color:#6b7686; text-align:center; margin-top:6px; }
  .part { margin-top:10px; }
  .part .pp { font-size:13.5px; color:#d7dee9; line-height:1.8; margin-bottom:8px; }
  .opts { display:flex; flex-direction:column; gap:8px; }
  .opt { display:block; width:100%; text-align:left; background:#1c222e; border:1px solid rgba(255,255,255,.08); color:#eef2f8; padding:12px 14px; border-radius:10px; font-size:14px; line-height:1.7; cursor:pointer; transition:all .15s; min-height:44px; font-family:inherit; }
  .opt:hover { border-color:rgba(90,215,255,.45); }
  .opt.ok { background:rgba(88,214,141,.14); border-color:#58d68d; color:#7de8a8; }
  .opt.err { background:rgba(255,122,110,.12); border-color:#ff7a6e; color:#ff9d93; }
  .opt.dim { opacity:.45; cursor:default; }
  .blankrow { display:flex; flex-wrap:wrap; align-items:center; gap:8px; font-size:14px; color:#d7dee9; margin-bottom:8px; }
  .blankrow input { width:130px; padding:10px 12px; border-radius:8px; border:1px solid rgba(255,255,255,.15); font-size:15px; background:#0b0e13; color:#f2f5fa; min-height:44px; font-family:inherit; }
  .blankrow input:focus { outline:none; border-color:#5ad7ff; }
  .blankrow input.ok { border-color:#58d68d; background:rgba(88,214,141,.1); color:#7de8a8; }
  .blankrow input.err { border-color:#ff7a6e; background:rgba(255,122,110,.08); color:#ff9d93; }
  .btn { background:rgba(90,215,255,.14); color:#5ad7ff; border:1px solid rgba(90,215,255,.35); padding:11px 20px; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; min-height:44px; font-family:inherit; transition:all .15s; }
  .btn:hover { background:rgba(90,215,255,.24); }
  .btn:disabled { opacity:.4; cursor:default; }
  .btn.ghost { background:#1c222e; color:#9aa4b5; border-color:rgba(255,255,255,.1); }
  .btn.gold { background:rgba(255,212,121,.12); color:#ffd479; border-color:rgba(255,212,121,.35); }
  .fb { margin-top:10px; padding:11px 13px; border-radius:10px; font-size:13.5px; line-height:1.8; display:none; }
  .fb.ok { display:block; background:rgba(88,214,141,.12); border:1px solid rgba(88,214,141,.35); color:#7de8a8; }
  .fb.err { display:block; background:rgba(255,122,110,.1); border:1px solid rgba(255,122,110,.3); color:#ff9d93; }
  .fb .an { color:#d7dee9; margin-top:6px; }
  .ref { display:none; margin-top:10px; background:rgba(255,212,121,.07); border-left:3px solid #ffd479; padding:12px 14px; border-radius:0 10px 10px 0; font-size:13.5px; line-height:1.9; color:#d7dee9; }
  .ref.show { display:block; }
  .selfrow { display:none; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .selfrow.show { display:flex; }
  .selfrow .btn.done { pointer-events:none; }
  .badge { display:inline-block; margin-top:10px; font-size:12px; font-weight:700; padding:4px 12px; border-radius:99px; }
  .badge.ok { background:rgba(88,214,141,.15); color:#7de8a8; }
  .badge.rev { background:rgba(255,212,121,.12); color:#ffd479; }
  .foot { margin-top:30px; font-size:12px; color:#6b7686; line-height:1.8; border-top:1px dashed rgba(255,255,255,.12); padding-top:14px; }
  @media (max-width:560px){ .wrap{padding:16px 12px 56px;} header h1{font-size:21px;} .qcard{padding:14px;} .blankrow input{width:110px;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📝 本章练习</h1>
    <div class="sub">八年级上册 · 第三章 物态变化 ｜ 收录教材「练习与应用」原题：第1节「温度」4 题 + 第2节「熔化和凝固」5 题（第3~5节完成后在本页持续追加）</div>
  </header>
  <div class="panel">
    <div class="prog"><i id="progBar"></i></div>
    <div class="prog-txt"><span id="progTxt">已完成 0 / 9 题</span><span id="totalScore"></span></div>
  </div>
  <main id="quizRoot"></main>
  <div class="foot">题目文字依据 docs/c3s1-transcript.md、docs/c3s2-transcript.md 转录；插图均为程序化简图（原图细节以教材印刷为准）。开放题由参考答案自评计分。</div>
</div>
<script src="practice.js"></script>
</body>
</html>
