<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- c7_s2 弹力 缩略图（原创矢量：左=拉伸弹簧+拉力箭头，右=弹簧测力计+钩码） -->
  <rect x="0" y="0" width="640" height="360" fill="#fdfcf7"/>
  <rect x="0" y="300" width="640" height="60" fill="#c9a876"/>
  <rect x="0" y="300" width="640" height="8" fill="#b08a5a"/>
  <!-- 左：试验台架 + 拉伸弹簧 -->
  <rect x="60" y="52" width="220" height="12" rx="4" fill="#9aa1ab" stroke="#7d838c"/>
  <rect x="84" y="60" width="12" height="242" rx="4" fill="#9aa1ab" stroke="#7d838c"/>
  <rect x="40" y="292" width="140" height="12" rx="4" fill="#9aa1ab" stroke="#7d838c"/>
  <circle cx="170" cy="76" r="7" fill="none" stroke="#5b6068" stroke-width="4"/>
  <path d="M170 83
    C 196 92, 144 104, 170 113
    C 196 122, 144 134, 170 143
    C 196 152, 144 164, 170 173
    C 196 182, 144 194, 170 203
    C 196 212, 144 224, 170 233"
    fill="none" stroke="#5b6068" stroke-width="5" stroke-linecap="round"/>
  <line x1="170" y1="233" x2="170" y2="252" stroke="#5b6068" stroke-width="5"/>
  <path d="M170 258 a10 10 0 1 0 8 -6" fill="none" stroke="#5b6068" stroke-width="4.5"/>
  <!-- 拉力红箭头 -->
  <line x1="170" y1="266" x2="170" y2="330" stroke="#dc2626" stroke-width="7" stroke-linecap="round"/>
  <path d="M170 344 L158 320 L182 320 Z" fill="#dc2626"/>
  <text x="192" y="316" font-size="24" font-weight="700" fill="#dc2626" font-family="sans-serif">F 拉</text>
  <!-- 右：弹簧测力计 -->
  <circle cx="450" cy="56" r="8" fill="none" stroke="#5b6068" stroke-width="4"/>
  <line x1="450" y1="64" x2="450" y2="78" stroke="#5b6068" stroke-width="4"/>
  <rect x="414" y="78" width="72" height="160" rx="16" fill="#fbf7ea" stroke="#8a8266" stroke-width="3"/>
  <rect x="432" y="92" width="36" height="128" rx="4" fill="#ffffff" stroke="#b7ae92"/>
  <text x="450" y="88" font-size="14" font-weight="700" fill="#3f4650" text-anchor="middle" font-family="sans-serif">N</text>
  <g stroke="#3f4650" stroke-width="2">
    <line x1="462" y1="98" x2="452" y2="98"/><line x1="462" y1="122" x2="452" y2="122"/>
    <line x1="462" y1="146" x2="452" y2="146"/><line x1="462" y1="170" x2="452" y2="170"/>
    <line x1="462" y1="194" x2="452" y2="194"/><line x1="462" y1="214" x2="452" y2="214"/>
  </g>
  <text x="443" y="103" font-size="12" fill="#3f4650" text-anchor="middle" font-family="sans-serif">0</text>
  <text x="443" y="151" font-size="12" fill="#3f4650" text-anchor="middle" font-family="sans-serif">2</text>
  <text x="443" y="199" font-size="12" fill="#3f4650" text-anchor="middle" font-family="sans-serif">4</text>
  <line x1="434" y1="164" x2="466" y2="164" stroke="#d64545" stroke-width="3.5"/>
  <path d="M466 164 L456 158 L456 170 Z" fill="#d64545"/>
  <line x1="450" y1="238" x2="450" y2="254" stroke="#5b6068" stroke-width="4"/>
  <path d="M450 260 a10 10 0 1 0 8 -6" fill="none" stroke="#5b6068" stroke-width="4.5"/>
  <!-- 钩码 250g -->
  <path d="M450 268 L450 276" stroke="#6b7280" stroke-width="4"/>
  <circle cx="450" cy="272" r="6" fill="none" stroke="#6b7280" stroke-width="3.5"/>
  <rect x="426" y="278" width="48" height="52" rx="6" fill="url(#wg)" stroke="#5b6068" stroke-width="2"/>
  <ellipse cx="450" cy="280" rx="24" ry="5" fill="#e2e6ea" stroke="#5b6068" stroke-width="2"/>
  <text x="450" y="310" font-size="15" font-weight="700" fill="#3f4650" text-anchor="middle" font-family="sans-serif">250 g</text>
  <defs>
    <linearGradient id="wg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f979f"/><stop offset="0.45" stop-color="#d6dade"/><stop offset="1" stop-color="#7e868e"/>
    </linearGradient>
  </defs>
  <!-- 标题 -->
  <text x="320" y="34" font-size="20" font-weight="700" fill="#8a7c66" text-anchor="middle" font-family="sans-serif">弹性 · 塑性 · 弹簧测力计</text>
</svg>
