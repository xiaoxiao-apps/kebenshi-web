<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弹力 — 物理八年级</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:linear-gradient(180deg,#f7fbff 0%,#eef4f9 100%);color:#1f2937;min-height:100vh}
  .wrap{max-width:900px;margin:0 auto;padding:24px 18px}
  header{margin-bottom:24px}
  .chapter{font-size:13px;color:#2563eb;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  h1{font-size:26px;font-weight:800;color:#111827;margin:6px 0 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
  .card{background:#fff;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;text-decoration:none;color:inherit}
  .card:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(0,0,0,.10)}
  .thumb{width:100%;height:170px;background:#f1f5f9;display:flex;align-items:center;justify-content:center}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .info{padding:16px}
  .num{display:inline-block;background:#dbeafe;color:#1d4ed8;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;margin-bottom:8px}
  .name{font-size:17px;font-weight:700;color:#111827}
  .desc{font-size:13px;color:#6b7280;margin-top:6px;line-height:1.45}
</style>
<link rel="stylesheet" href="../_lib/guide/card-voice-badge.css?v=20261028v2">
</head>
<body>
<div class="wrap">
  <header>
    <div class="chapter">第7章 力</div>
    <h1>弹力</h1>
  </header>
  <div class="grid">
    <a class="card" href="exp-elastic.html">
      <div class="thumb"><img src="thumb1.svg" alt="弹性与弹性限度探究器"></div>
      <div class="info">
        <span class="num">实验</span>
        <div class="name">弹性与弹性限度探究器</div>
        <div class="desc">四位选手：弹簧、直尺、橡皮筋、橡皮泥。拉一拉再松手，对比谁恢复原状；打开超限度开关使劲拉，看弹簧超过弹性限度后的永久变形。</div>
        <span class="voice-badge">语音讲解</span>
      </div>
    </a>
    <a class="card" href="exp-springmeter.html">
      <div class="body" style="padding:26px 16px;">
        <div class="name">弹簧测力计实验室<span class="chip">⚖️</span></div>
        <div class="desc">竖直/水平双场景：调零、钩码步进挂、短振荡停稳读数、超5N拦截、感受1N/3N/5N、原长与平衡位参考线</div>
      </div>
      <div class="info" style="padding-top:0">
        <span class="num">实验</span>
        <span class="voice-badge">语音讲解</span>
      </div>
    </a>
  </div>
</div>
<script src="/content/_lib/mobile-guard.js?v=20261030v1" defer></script>
</body>
</html>
