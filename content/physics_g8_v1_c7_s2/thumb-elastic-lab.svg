<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfcf7"/>
      <stop offset="1" stop-color="#eef4f9"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c6e0f2" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#e2f1fb" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#b4d2ea" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0574a"/>
      <stop offset="1" stop-color="#b93a30"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4eeda"/>
      <stop offset="0.5" stop-color="#fbf7ea"/>
      <stop offset="1" stop-color="#e7dfc6"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f979f"/>
      <stop offset="0.45" stop-color="#d6dade"/>
      <stop offset="1" stop-color="#7e868e"/>
    </linearGradient>
    <clipPath id="bottleClip">
      <path d="M 168 128 L 168 152 A 62 58 0 1 0 232 152 L 232 128 Z"/>
    </clipPath>
  </defs>

  <rect width="640" height="360" rx="18" fill="url(#bg)"/>
  <rect x="0" y="292" width="640" height="68" fill="#d9c49a" opacity="0.55"/>
  <rect x="0" y="292" width="640" height="10" fill="#c4a97a" opacity="0.7"/>

  <!-- 左：玻璃瓶细管（微小形变放大法） -->
  <g>
    <!-- 细管 -->
    <rect x="191" y="34" width="18" height="86" rx="4" fill="#e2f0fa" stroke="#7fa8c4" stroke-width="3"/>
    <!-- 管内红色水柱（明显上升） -->
    <rect x="196" y="52" width="8" height="68" rx="3" fill="url(#water)"/>
    <!-- 水柱上升虚线标注 -->
    <line x1="222" y1="52" x2="266" y2="52" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 5"/>
    <line x1="222" y1="96" x2="252" y2="96" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="M 244 56 L 244 92" stroke="#b45309" stroke-width="2.5"/>
    <path d="M 244 56 L 239 65 L 249 65 Z" fill="#b45309"/>
    <!-- 橡胶塞 -->
    <path d="M 176 120 L 224 120 L 219 134 L 181 134 Z" fill="#4b3a2f"/>
    <ellipse cx="200" cy="120" rx="24" ry="6" fill="#5d4a3c"/>
    <!-- 瓶颈 -->
    <rect x="184" y="130" width="32" height="26" fill="url(#glass)" stroke="#7fa8c4" stroke-width="3"/>
    <!-- 瓶身 -->
    <ellipse cx="200" cy="212" rx="62" ry="58" fill="url(#glass)" stroke="#7fa8c4" stroke-width="4"/>
    <!-- 瓶内红水 -->
    <g clip-path="url(#bottleClip)">
      <rect x="138" y="176" width="124" height="100" fill="url(#water)"/>
    </g>
    <ellipse cx="200" cy="178" rx="16" ry="5" fill="#ef6a5c"/>
    <!-- 瓶身高光 -->
    <path d="M 158 232 A 46 44 0 0 1 166 182" stroke="#ffffff" stroke-opacity="0.85" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- 捏力箭头（两侧向内） -->
    <g stroke="#dc2626" stroke-width="5" stroke-linecap="round">
      <line x1="94" y1="212" x2="126" y2="212"/>
      <line x1="306" y1="212" x2="274" y2="212"/>
    </g>
    <path d="M 132 212 L 120 205 L 120 219 Z" fill="#dc2626"/>
    <path d="M 268 212 L 280 205 L 280 219 Z" fill="#dc2626"/>
  </g>

  <!-- 右：弹簧测力计（挂钩码） -->
  <g>
    <!-- 顶环 -->
    <circle cx="452" cy="46" r="11" fill="none" stroke="#5b6068" stroke-width="5"/>
    <line x1="452" y1="57" x2="452" y2="72" stroke="#5b6068" stroke-width="5"/>
    <!-- 壳体 -->
    <rect x="422" y="72" width="60" height="170" rx="14" fill="url(#panel)" stroke="#8a8266" stroke-width="3"/>
    <!-- 刻度窗 -->
    <rect x="432" y="86" width="40" height="140" rx="4" fill="#ffffff" stroke="#b7ae92" stroke-width="2"/>
    <!-- 主刻度 0..5 + 小格 -->
    <g stroke="#3f4650">
      <line x1="466" y1="92" x2="454" y2="92" stroke-width="2.5"/>
      <line x1="466" y1="119" x2="454" y2="119" stroke-width="2.5"/>
      <line x1="466" y1="146" x2="454" y2="146" stroke-width="2.5"/>
      <line x1="466" y1="173" x2="454" y2="173" stroke-width="2.5"/>
      <line x1="466" y1="200" x2="454" y2="200" stroke-width="2.5"/>
      <line x1="466" y1="220" x2="458" y2="220" stroke-width="1.6"/>
      <line x1="466" y1="106" x2="458" y2="106" stroke-width="1.6"/>
      <line x1="466" y1="132" x2="458" y2="132" stroke-width="1.6"/>
      <line x1="466" y1="160" x2="458" y2="160" stroke-width="1.6"/>
      <line x1="466" y1="186" x2="458" y2="186" stroke-width="1.6"/>
    </g>
    <g font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3f4650" text-anchor="middle">
      <text x="444" y="96">0</text>
      <text x="444" y="123">1</text>
      <text x="444" y="150">2</text>
      <text x="444" y="177">3</text>
      <text x="444" y="204">4</text>
      <text x="444" y="224">5</text>
    </g>
    <text x="452" y="82" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#3f4650" text-anchor="middle">N</text>
    <!-- 内部弹簧（伸长联动示意） -->
    <path d="M 452 90 q 10 6 0 12 q -10 6 0 12 q 10 6 0 12 q -10 6 0 12 q 10 6 0 12 q -10 6 0 12 q 10 6 0 12" fill="none" stroke="#6b7280" stroke-width="3"/>
    <!-- 指针（指 2.4N） -->
    <line x1="434" y1="156.8" x2="468" y2="156.8" stroke="#d64545" stroke-width="3"/>
    <path d="M 468 156.8 L 458 152 L 458 161.6 Z" fill="#d64545"/>
    <!-- 底钩 -->
    <line x1="452" y1="242" x2="452" y2="254" stroke="#5b6068" stroke-width="4"/>
    <path d="M 452 254 a 9 9 0 1 0 9 9" fill="none" stroke="#5b6068" stroke-width="4"/>
    <!-- 钩码 100g×2 -->
    <g>
      <path d="M 461 263 a 6 6 0 1 1 -6 6" fill="none" stroke="#6b7280" stroke-width="3"/>
      <rect x="440" y="270" width="26" height="26" rx="4" fill="url(#metal)" stroke="#5b6068" stroke-width="2"/>
      <ellipse cx="453" cy="271" rx="13" ry="4" fill="#e2e6ea" stroke="#5b6068" stroke-width="1.5"/>
      <text x="453" y="288" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="bold" fill="#3f4650" text-anchor="middle">100g</text>
    </g>
    <!-- 量程标注 -->
    <text x="524" y="92" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="600" fill="#64748b">量程 0~5N</text>
    <text x="524" y="114" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="600" fill="#64748b">分度值 0.2N</text>
    <text x="524" y="150" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#b45309">读数 2.4N</text>
  </g>

  <!-- 底部主题字 -->
  <text x="320" y="336" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="800" fill="#5b4630" text-anchor="middle">弹力实验室 · 微小形变放大法 × 弹簧测力计</text>
</svg>
