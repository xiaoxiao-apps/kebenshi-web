<script>

 */
const QUESTIONS = [
  // —— 第1节 力（9 题） ——
  { id:'c7s1q1', section:'力', no:'第1题', points:10,
    stem:'羽毛球比赛中，球拍击中羽毛球，球被击飞出去。关于球拍对羽毛球的这个力，施力物体和受力物体分别是：',
    parts:[
      { kind:'choice',
        opts:['球拍、羽毛球','羽毛球、球拍','球拍、运动员的手','羽毛球、球网'], answer:0,
        analysis:'施加力的物体是<b>施力物体</b>，受到力的物体是<b>受力物体</b>。这个力是球拍打在球上的，所以施力物体是<b>球拍</b>，受力物体是<b>羽毛球</b>。' }
    ] },

  { id:'c7s1q2', section:'力', no:'第2题', points:10,
    stem:'关于力，下列说法正确的是：',
    parts:[
      { kind:'choice',
        opts:['只有人和动物才能对物体施加力','物体间不接触就一定没有力的作用，接触了就一定有力的作用','推土机推土时，土是施力物体，推土机是受力物体','力是物体对物体的作用，施力物体同时也是受力物体'], answer:3,
        analysis:'力是<b>物体对物体的作用</b>，不能脱离物体存在；物体也可以施力（推土机推土、磁体吸引铁钉），磁体不接触铁钉也能施力，故 A、B 错；推土机推土时<b>推土机是施力物体、土是受力物体</b>，C 说反了；物体间力的作用是<b>相互的</b>，施力物体同时也是受力物体，<b>D 正确</b>。' }
    ] },

  { id:'c7s1q3', section:'力', no:'第3题', points:10,
    stem:'下列现象中，主要体现「力可以改变物体的运动状态」的是：',
    parts:[
      { kind:'choice',
        opts:['守门员把飞来的足球一脚踢出','用力捏橡皮泥，橡皮泥上留下指印','射箭运动员把弓拉弯','人坐在沙发上，沙发垫凹陷下去'], answer:0,
        analysis:'足球由飞向球门变为被踢飞出去，<b>运动快慢和方向都改变了</b>——这是力改变物体的<b>运动状态</b>；捏橡皮泥留指印、拉弯弓、沙发垫凹陷，都是力使物体<b>发生形变</b>。' }
    ] },

  { id:'c7s1q4', section:'力', no:'第4题', points:12,
    stem:'厨房里，王师傅用手一捏包子皮，皮上就留下了指印；放学路上，小诚骑自行车捏闸，车慢慢停了下来。请用「力的作用效果」完成下面两个填空。',
    note:'两空均即时判分（每空6分），等价表述均认可。',
    parts:[
      { kind:'blank', q:'① 捏包子皮留下指印，说明力可以：', blanks:[
        { label:'力的作用效果', answer:['使物体发生形变','使物体形变','让物体发生形变','让物体形变','改变物体的形状','使物体的形状发生改变','形变','发生改变形变','使物体形状改变'], unit:'' }],
        analysis:'指印=形状变化 → 力可以<b>使物体发生形变</b>。' },
      { kind:'blank', q:'② 捏闸后车慢慢停下，说明力可以：', blanks:[
        { label:'力的作用效果', answer:['改变物体的运动状态','改变物体运动状态','使物体的运动状态发生改变','让物体的运动状态改变','改变运动状态'], unit:'' }],
        analysis:'车由运动变为静止（快慢改变）→ 力可以<b>改变物体的运动状态</b>。' }
    ] },

  { id:'c7s1q5', section:'力', no:'第5题', points:10,
    stem:'教室的门上标出了 A、B、C 三个推门位置：A 离门轴最远，C 离门轴最近。用同样大小的力、沿同样垂直于门面的方向推门，在 A 处最容易把门推关上，在 C 处最费劲。这说明力的作用效果与哪个因素有关？',
    parts:[
      { kind:'choice',
        opts:['力的大小','力的方向','力的作用点','推门的时间'], answer:2,
        analysis:'三处推门的<b>大小、方向都相同</b>，不同的只是力作用的<b>位置</b>——作用点离门轴越远越省力。这说明力的作用效果与<b>作用点</b>有关（大小、方向、作用点合称力的三要素）。' }
    ] },

  { id:'c7s1q6', section:'力', no:'第6题', points:10,
    stem:'小强用扳手拧螺母：沿垂直于扳手柄的方向用力，很容易拧动；顺着扳手手柄的方向推，几乎拧不动。两次用力的大小和作用点都相同，只是方向不同，效果却大不一样。这说明力的作用效果与力的什么有关？',
    parts:[
      { kind:'choice',
        opts:['大小','方向','作用点','单位'], answer:1,
        analysis:'大小、作用点相同，只改变<b>方向</b>，效果完全不同 → 力的作用效果与力的<b>方向</b>有关。' }
    ] },

  { id:'c7s1q7', section:'力', no:'第7题', points:10,
    stem:'关于力的示意图的画法，下列说法正确的是：',
    parts:[
      { kind:'choice',
        opts:['线段的箭头表示力的方向','线段画得越长，表示力越小','线段的起点只能画在物体的重心上','必须用数值和单位标出力的大小，否则示意图无效'], answer:0,
        analysis:'示意图中<b>箭头表示力的方向</b>，A 正确；同一图中力越大线段画得越<b>长</b>，B 说反了；线段的<b>起点或终点</b>表示作用点，不是只能画在重心，C 错；力的大小<b>可以</b>用数值和单位标出，不是必须，D 错。' }
    ] },

  { id:'c7s1q8', section:'力', no:'第8题', points:12,
    stem:'一盏吊灯用一根电线悬吊在天花板上，静止时电线对吊灯的拉力是 3 N。下面四幅简图分别画出了吊灯所受这个拉力的示意图，其中画得正确的是哪一幅？',
    note:'下方简图为程序化绘制（甲/乙/丙/丁四幅候选示意图）。单选即时判分。',
    fig:'lampForce4',
    parts:[
      { kind:'choice', q:'画得正确的是：',
        opts:['甲','乙','丙','丁'], answer:0,
        analysis:'电线对吊灯的拉力<b>沿电线竖直向上</b>，作用点在灯与电线相连处：<b>甲正确</b>（箭头向上、起点在作用点、标注 F=3 N）；乙箭头向下（方向错）；丙箭头斜向（方向错）；丁标注 30 N（大小标错，应为 3 N）。' }
    ] },

  { id:'c7s1q9', section:'力', no:'第9题', points:10,
    stem:'小月穿着旱冰鞋站在光滑的地面上，双手用力推墙，结果自己向后滑离了墙面。这个现象主要说明了：',
    parts:[
      { kind:'choice',
        opts:['物体间力的作用是相互的','墙对人的力大于人对墙的力','只有墙是施力物体，人只是受力物体','力只能使物体发生形变'], answer:0,
        analysis:'人推墙时，人对墙施加了力，<b>墙同时也对人施加了力</b>，正是这个力使人向后滑动——说明<b>物体间力的作用是相互的</b>，施力物体同时也是受力物体；相互的两个力作用在不同物体上，人由此改变了运动状态，B、C、D 均错。' }
    ] },

  // —— 第2节 弹力（2 题） ——
  { id:'c7s2q1', section:'弹力', no:'第1题', points:10,
    stem:'把一只茶杯放在水平桌面上静止，桌面对茶杯有一个向上的支持力。这个支持力属于：',
    parts:[
      { kind:'choice',
        opts:['重力','弹力','磁力','摩擦力'], answer:1,
        analysis:'茶杯压桌面，桌面发生<b>微小形变</b>；桌面要恢复原状，就对与它接触的茶杯产生向上的力——这就是<b>弹力</b>。支持力、压力都属于弹力。' }
    ] },

  { id:'c7s2q2', section:'弹力', no:'第2题', points:12,
    stem:'实验室里有一只弹簧测力计，测量范围 0~5 N，每一小格表示 0.2 N。用它测量力之前和测量时，遇到下面两种情况，请作答。',
    note:'①单选、②填空（读数从下方程序化简图中读出），均即时判分（每空6分）。',
    fig:'meterRead',
    parts:[
      { kind:'choice', q:'① 测量前发现指针没有指在零刻度线上，正确的做法是：',
        opts:['直接测量，读数时把偏差加回去','先把指针调到零刻度线处，再进行测量','把弹簧剪短一截再测','用手把指针按回零刻度线后马上测量'], answer:1,
        analysis:'使用弹簧测力计前要先<b>检查指针是否指零，不指零要先调零</b>，否则读数全是错的；A、C、D 的做法都会破坏测量或损坏仪器。' },
      { kind:'blank', q:'② 调零后测一个静止物体的拉力，指针位置见上方简图，读数是：', blanks:[
        { label:'测力计读数', answer:['2.6','2.6N','2.6 N','2.6牛','2.6牛顿'], unit:'N' }],

        analysis:'<b>G=mg</b>=3.2 kg×10 N/kg=<b>32 N</b>。' }

  { id:'c7s3q2', section:'重力', no:'第2题', points:12,
    stem:'月球对物体的吸引力比地球小得多，月球上的 g月 取 1.6 N/kg。一辆月球车在月球上受到月球的吸引力（月面「重力」）为 1920 N。',

        { label:'月球车的质量 m', answer:['1200','1200kg','1200 kg','1200千克','1.2×10³','1.2×10^3','1.2×10³kg','1.2x10^3kg'], unit:'kg' }],

    stem:'建筑工人砌墙时，常在墙边悬挂一根细线，线下端吊一个重物，用它来检查墙面是否竖直。这种做法利用的是：',

      { kind:'choice',
        opts:['重力的方向总是竖直向下的','重力的方向总是垂直于墙面的','重力的方向总是垂直于地面的','重力的大小跟质量成正比'], answer:0,
        analysis:'细线下端吊重物静止时，细线沿<b>重力的方向</b>——<b>竖直向下</b>（指向地心），这就是<b>铅垂线</b>。墙面与铅垂线平行即竖直。注意「竖直向下」<b>不等于</b>「垂直于墙面/地面」——地面倾斜时二者方向并不相同，B、C 错；D 说法本身正确但与检查墙面竖直无关。' }
    ] }

]; // 闭合 QUESTIONS 数组（共 14 题：力×9、弹力×2、重力×3；总分 148）

/* ===== 状态与持久化 ===== */
const STORAGE_KEY = 'c7_practice_state_v1';
let STATE = { scores: {}, done: {}, choice: {}, blank: {}, open: {} };

function initState() {
  const defaults = { scores: {}, done: {}, choice: {}, blank: {}, open: {} };
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    STATE = Object.assign({}, defaults, saved);
  } catch (e) { STATE = defaults; }
  ['scores', 'done', 'choice', 'blank', 'open'].forEach(k => { if (!STATE[k]) STATE[k] = {}; });
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); } catch (e) {}
}
function findQ(qid) { return QUESTIONS.find(q => q.id === qid); }
function partPoints(q, pi) {
  const n = q.parts && q.parts.length ? q.parts.length : 1;
  return Math.round(q.points / n);
}
function norm(s) {
  return String(s == null ? '' : s).replace(/[＋]/g, '+').replace(/[－]/g, '-').replace(/[。．]/g, '').replace(/\s/g, '').trim();
}
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function $1(sel, el) { return (el || document).querySelector(sel); }
function $all(sel, el) { return Array.from((el || document).querySelectorAll(sel)); }

/* ===== 程序化插图（亮底简图） ===== */
const FIGURES = {
  lampForce4: svgLampForce4,
  meterRead: svgMeterRead
};

/* 吊灯拉力示意图四联（甲=正确；乙=方向向下；丙=方向斜向；丁=大小标错30N） */
function lampPanel(dx, tag, arrow, label) {
  const cx = dx + 80;
  let s = `<g transform="translate(0,0)">`;
  s += `<text x="${dx + 8}" y="18" fill="#334155" font-size="13" font-weight="700">${tag}</text>`;
  // 天花板（斜纹）
  s += `<rect x="${dx + 16}" y="24" width="128" height="8" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>`;
  for (let i = 0; i < 8; i++) s += `<line x1="${dx + 22 + i * 16}" y1="24" x2="${dx + 14 + i * 16}" y2="16" stroke="#94a3b8" stroke-width="1"/>`;
  // 电线
  s += `<line x1="${cx}" y1="32" x2="${cx}" y2="100" stroke="#475569" stroke-width="2"/>`;
  // 吊灯（灯罩梯形+灯泡）
  s += `<path d="M${cx - 26} 128 L${cx - 12} 100 L${cx + 12} 100 L${cx + 26} 128 Z" fill="#fde68a" stroke="#b45309" stroke-width="2"/>`;
  s += `<circle cx="${cx}" cy="136" r="7" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>`;
  // 箭头（起点在灯顶作用点）
  if (arrow === 'up') {
    s += `<line x1="${cx}" y1="98" x2="${cx}" y2="48" stroke="#dc2626" stroke-width="3.5"/>`;
    s += `<polygon points="${cx},38 ${cx - 6},52 ${cx + 6},52" fill="#dc2626"/>`;
  } else if (arrow === 'down') {
    s += `<line x1="${cx}" y1="98" x2="${cx}" y2="158" stroke="#dc2626" stroke-width="3.5"/>`;
    s += `<polygon points="${cx},168 ${cx - 6},154 ${cx + 6},154" fill="#dc2626"/>`;
  } else if (arrow === 'diag') {
    s += `<line x1="${cx}" y1="98" x2="${cx + 34}" y2="64" stroke="#dc2626" stroke-width="3.5"/>`;
    s += `<polygon points="${cx + 41},57 ${cx + 25},62 ${cx + 36},73" fill="#dc2626"/>`;
  }
  s += `<text x="${cx + 12}" y="${arrow === 'down' ? 150 : 70}" fill="#dc2626" font-size="12" font-weight="700">${label}</text>`;
  return s + `</g>`;
}
function svgLampForce4() {
  const s = lampPanel(0, '甲', 'up', 'F=3 N')
    + lampPanel(175, '乙', 'down', 'F=3 N')
    + lampPanel(350, '丙', 'diag', 'F=3 N')
    + lampPanel(525, '丁', 'up', 'F=30 N');
  return `<svg viewBox="0 0 700 190" role="img" aria-label="吊灯拉力示意图四选一">${s}</svg>`
    + `<div class="figcap">电线对吊灯拉力 3 N 的四幅候选示意图</div>`;
}

/* 弹簧测力计读数简图（量程0~5N，每小格0.2N，指针指2.6N） */
function svgMeterRead() {
  const x0 = 130, w = 60;          // 表身
  const yTop = 40, yBot = 170;     // 刻度0~5N 区间
  const yFor = v => yTop + v * (yBot - yTop) / 5;
  let s = '';
  // 吊环+表身+挂钩
  s += `<circle cx="${x0 + w / 2}" cy="24" r="9" fill="none" stroke="#475569" stroke-width="3"/>`;
  s += `<rect x="${x0}" y="34" width="${w}" height="${yBot + 16 - 34}" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>`;
  s += `<line x1="${x0 + w / 2}" y1="${yBot + 16}" x2="${x0 + w / 2}" y2="${yBot + 34}" stroke="#475569" stroke-width="3"/>`;
  s += `<path d="M${x0 + w / 2} ${yBot + 34} q-10 8 0 14 q10 6 0 -4" fill="none" stroke="#475569" stroke-width="3"/>`;
  // 刻度：主刻1N（带数字）、副刻0.2N
  for (let i = 0; i <= 25; i++) {
    const v = i * 0.2, y = yFor(v), major = i % 5 === 0;
    s += `<line x1="${x0 + w - (major ? 22 : 12)}" y1="${y}" x2="${x0 + w - 4}" y2="${y}" stroke="${major ? '#334155' : '#94a3b8'}" stroke-width="${major ? 2 : 1}"/>`;
    if (major) s += `<text x="${x0 + 8}" y="${y + 4}" fill="#334155" font-size="12" font-weight="600">${v}</text>`;
  }
  s += `<text x="${x0 + w / 2 - 5}" y="${yTop - 6}" fill="#64748b" font-size="12">N</text>`;
  // 指针（2.6N）
  const yp = yFor(2.6);
  s += `<line x1="${x0 + 4}" y1="${yp}" x2="${x0 + w - 4}" y2="${yp}" stroke="#dc2626" stroke-width="2.5"/>`;
  s += `<polygon points="${x0 + w + 14},${yp} ${x0 + w + 2},${yp - 6} ${x0 + w + 2},${yp + 6}" fill="#dc2626"/>`;
  s += `<text x="${x0 + w + 20}" y="${yp + 4}" fill="#dc2626" font-size="12" font-weight="700">指针</text>`;
  return `<svg viewBox="0 0 320 230" role="img" aria-label="弹簧测力计读数简图">${s}</svg>`
    + `<div class="figcap">弹簧测力计简图（测量范围 0~5 N，每小格 0.2 N）</div>`;
}

/* ===== 渲染引擎 ===== */
function renderFig(fig) {
  if (!fig || !FIGURES[fig]) return '';
  return `<div class="figbox">${FIGURES[fig]()}</div>`;
}
function renderPart(q, pi) {
  const p = q.parts[pi];
  const key = `${q.id}_${pi}`;
  const head = p.q ? `<div class="pp"><b>${esc(p.q)}</b></div>` : '';
  if (p.kind === 'choice') {
    const opts = p.opts.map((opt, idx) =>
      `<button class="opt" data-qid="${q.id}" data-pi="${pi}" data-idx="${idx}">${['A','B','C','D'][idx]}. ${esc(opt)}</button>`
    ).join('');
    return `<div class="part" data-key="${key}">${head}<div class="opts">${opts}</div><div class="fb" data-role="fb"></div></div>`;
  }
  if (p.kind === 'blank') {
    const rows = p.blanks.map((b, bi) =>
      `<div class="blankrow"><span>${esc(b.label)}：</span><input type="text" class="blank-inp" data-bi="${bi}" data-qid="${q.id}" data-pi="${pi}" placeholder="作答"${b.unit ? ` aria-label="${esc(b.label)}"` : ''}><span>${esc(b.unit || '')}</span></div>`
    ).join('');
    return `<div class="part" data-key="${key}">${head}${rows}<button class="btn blank-check" data-qid="${q.id}" data-pi="${pi}">提交答案</button><div class="fb" data-role="fb"></div></div>`;
  }
  return '';
}
function renderQuestion(q) {
  return `<div class="qcard" id="${q.id}">
    <div class="qno"><b>${esc(q.no)}</b><span>(${q.points}分)</span><button class="redo-q" data-qid="${q.id}">重做本题</button></div>
    <div class="stem">${esc(q.stem)}</div>
    ${q.note ? `<div class="qnote">${esc(q.note)}</div>` : ''}
    ${renderFig(q.fig)}
    ${q.parts.map((_, pi) => renderPart(q, pi)).join('')}
  </div>`;
}
function renderQuiz() {
  const root = document.getElementById('quizRoot');
  if (!root) return;
  const order = [];
  const groups = {};
  QUESTIONS.forEach(q => {
    if (!groups[q.section]) { groups[q.section] = []; order.push(q.section); }
    groups[q.section].push(q);
  });
  root.innerHTML = order.map(sec =>
    `<section class="sec">`
    + `<div class="sec-head"><h2>${esc(sec)}</h2><span class="chip">${groups[sec].length} 题</span></div>`
    + groups[sec].map(renderQuestion).join('')
    + `</section>`
  ).join('');
  bindEvents();
  restoreUI();
  updateProgress();
}

/* ===== 判分与交互 ===== */
function showFb(el, ok, html) {
  const fb = $1('[data-role="fb"]', el);
  if (!fb) return;
  fb.className = 'fb ' + (ok ? 'ok' : 'err');
  fb.innerHTML = (ok ? '✅ 回答正确' : '❌ 回答错误') + '<div class="an"><b>解析：</b>' + html + '</div>';
}
function setChoiceUI(el, part, chosenIdx) {
  const correctIdx = part.answer;
  $all('.opt', el).forEach(btn => {
    const idx = +btn.dataset.idx;
    btn.disabled = true;
    btn.classList.remove('ok', 'err', 'dim');
    if (idx === correctIdx) btn.classList.add('ok');
    else if (idx === chosenIdx) btn.classList.add('err');
    else btn.classList.add('dim');
  });
  showFb(el, chosenIdx === correctIdx, part.analysis);
}
function setBlankUI(el, part, vals) {
  const inputs = $all('.blank-inp', el);
  let allOk = true;
  inputs.forEach((inp, bi) => {
    inp.value = (vals && vals[bi]) || '';
    const accepted = part.blanks[bi].answer.map(norm);
    const ok = accepted.includes(norm(inp.value));
    inp.classList.toggle('ok', ok);
    inp.classList.toggle('err', !ok);
    inp.readOnly = true;
    if (!ok) allOk = false;
  });
  const btn = $1('.blank-check', el);
  if (btn) btn.disabled = true;
  showFb(el, allOk, part.analysis);
}
function restoreUI() {
  Object.keys(STATE.done).forEach(key => {
    if (!STATE.done[key]) return;
    const sep = key.lastIndexOf('_');
    const qid = key.slice(0, sep), pi = +key.slice(sep + 1);
    const q = findQ(qid);
    if (!q) return;
    const part = q.parts[pi];
    const el = $1(`.part[data-key="${key}"]`);
    if (!el) return;
    if (part.kind === 'choice') setChoiceUI(el, part, STATE.choice[key]);
    else if (part.kind === 'blank') setBlankUI(el, part, STATE.blank[key]);
  });
}

function bindEvents() {
  $all('.opt').forEach(btn => btn.addEventListener('click', onChoiceClick));
  $all('.blank-check').forEach(btn => btn.addEventListener('click', onBlankCheck));
  $all('.redo-q').forEach(btn => btn.addEventListener('click', onRedoQuestion));
}
function onChoiceClick(e) {
  const btn = e.currentTarget;
  if (btn.disabled) return;
  const qid = btn.dataset.qid, pi = +btn.dataset.pi, idx = +btn.dataset.idx;
  const q = findQ(qid), part = q.parts[pi];
  const key = `${qid}_${pi}`;
  STATE.choice[key] = idx;
  STATE.done[key] = true;
  STATE.scores[qid] = STATE.scores[qid] || {};
  STATE.scores[qid][pi] = (idx === part.answer) ? partPoints(q, pi) : 0;
  saveState();
  setChoiceUI(btn.closest('.part'), part, idx);
  updateProgress();
}
function onBlankCheck(e) {
  const btn = e.currentTarget;
  const qid = btn.dataset.qid, pi = +btn.dataset.pi;
  const q = findQ(qid), part = q.parts[pi];
  const el = btn.closest('.part');
  const inputs = $all('.blank-inp', el);
  const vals = [];
  let allOk = true;
  inputs.forEach((inp, bi) => {
    vals[bi] = inp.value;
    const accepted = part.blanks[bi].answer.map(norm);
    const ok = accepted.includes(norm(inp.value));
    inp.classList.toggle('ok', ok);
    inp.classList.toggle('err', !ok);
    inp.readOnly = true;
    if (!ok) allOk = false;
  });
  const key = `${qid}_${pi}`;
  STATE.blank[key] = vals;
  STATE.done[key] = true;
  STATE.scores[qid] = STATE.scores[qid] || {};
  STATE.scores[qid][pi] = allOk ? partPoints(q, pi) : 0;
  saveState();
  btn.disabled = true;
  setBlankUI(el, part, vals);
  updateProgress();
}
/* 重做本题：清空该题全部 part 状态后整页重渲染（restoreUI 恢复其余题） */
function onRedoQuestion(e) {
  const qid = e.currentTarget.dataset.qid;
  const q = findQ(qid);
  if (!q) return;
  q.parts.forEach((_, pi) => {
    const key = `${qid}_${pi}`;
    delete STATE.done[key]; delete STATE.choice[key]; delete STATE.blank[key];
  });
  delete STATE.scores[qid];
  saveState();
  renderQuiz();
  const card = document.getElementById(qid);
  if (card && card.scrollIntoView) card.scrollIntoView({ block: 'center' });
}
/* 重做全部：清空整个存档 */
function onRedoAll() {
  STATE = { scores: {}, done: {}, choice: {}, blank: {}, open: {} };
  saveState();
  renderQuiz();
  window.scrollTo({ top: 0 });
}
function updateProgress() {
  let doneCount = 0, total = 0;
  QUESTIONS.forEach(q => {
    const allDone = q.parts.every((_, pi) => STATE.done[`${q.id}_${pi}`]);
    if (allDone) doneCount++;
    q.parts.forEach((_, pi) => {
      total += ((STATE.scores[q.id] || {})[pi] || 0);
    });
  });
  const progBar = document.getElementById('progBar');
  const progTxt = document.getElementById('progTxt');
  const totalScore = document.getElementById('totalScore');
  if (progBar) progBar.style.width = (doneCount / QUESTIONS.length * 100) + '%';
  if (progTxt) progTxt.textContent = `已完成 ${doneCount} / ${QUESTIONS.length} 题`;
  if (totalScore) {
    totalScore.style.display = 'inline';
    totalScore.textContent = `总分 ${total} 分`;
  }
  const root = document.getElementById('quizRoot');
  let summary = document.getElementById('allDoneSummary');
  if (doneCount === QUESTIONS.length && root && !summary) {
    summary = document.createElement('div');
    summary.id = 'allDoneSummary';
    summary.className = 'qcard';
    summary.innerHTML = `<div class="stem">🎉 本章练习全部完成！</div><div class="pp">${QUESTIONS.length} / ${QUESTIONS.length} 题已作答，当前总得分 <b style="color:#b45309">${total} 分</b>。继续加油！</div>`;
    root.appendChild(summary);
  } else if (summary) {
    summary.querySelector('b').textContent = total + ' 分';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  initState();
  renderQuiz();
  const redoAll = document.getElementById('redoAll');
  if (redoAll) redoAll.addEventListener('click', onRedoAll);
});
</script>
