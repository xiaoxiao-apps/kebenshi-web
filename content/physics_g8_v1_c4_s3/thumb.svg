<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 226" width="400" height="226">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf2fb"/><stop offset="1" stop-color="#d8e6f5"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bfdbfe" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#eff6ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#93c5fd" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="flame" cx="0.5" cy="0.7" r="0.6">
      <stop offset="0" stop-color="#fff7cc"/><stop offset="0.55" stop-color="#ffb020"/>
      <stop offset="1" stop-color="#ff7a00"/>
    </radialGradient>
  </defs>

  <rect width="400" height="226" fill="url(#bg)"/>
  <!-- 桌面 -->
  <rect x="0" y="184" width="400" height="14" fill="#e3d3ab"/>
  <rect x="0" y="198" width="400" height="28" fill="#cdb589"/>
  <!-- 白纸 -->
  <rect x="112" y="176" width="176" height="10" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

  <!-- 物像连线虚线 + 垂直标记 -->
  <line x1="120" y1="112" x2="280" y2="112" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M200 112 h14 v14" fill="none" stroke="#2563eb" stroke-width="1.6"/>

  <!-- 玻璃板（平面镜） -->
  <rect x="193" y="52" width="14" height="126" fill="url(#glass)" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="184" y="176" width="32" height="8" rx="2" fill="#94a3b8"/>
  <text x="200" y="44" font-size="13" font-family="sans-serif" fill="#1d4ed8" text-anchor="middle" font-weight="700">玻璃板</text>

  <!-- 物蜡烛（板前，点燃） -->
  <g>
    <rect x="111" y="126" width="18" height="52" rx="3" fill="#fdf6e3" stroke="#d6c9a8" stroke-width="1.2"/>
    <line x1="120" y1="126" x2="120" y2="118" stroke="#3f3f46" stroke-width="2.4" stroke-linecap="round"/>
    <ellipse cx="120" cy="110" rx="7" ry="11" fill="url(#flame)"/>
    <ellipse cx="120" cy="112" rx="3" ry="5.5" fill="#fff3bf"/>
    <text x="120" y="200" font-size="12" font-family="sans-serif" fill="#374151" text-anchor="middle">蜡烛</text>
  </g>

  <!-- 虚像（板后对称，半透明） -->
  <g opacity="0.42">
    <rect x="271" y="126" width="18" height="52" rx="3" fill="#fdf6e3" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="280" y1="126" x2="280" y2="118" stroke="#3f3f46" stroke-width="2.4" stroke-linecap="round"/>
    <ellipse cx="280" cy="110" rx="7" ry="11" fill="url(#flame)"/>
  </g>
  <rect x="265" y="96" width="30" height="84" rx="4" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="280" y="200" font-size="12" font-family="sans-serif" fill="#64748b" text-anchor="middle">虚像</text>

  <!-- 等距标注 -->
  <g stroke="#0f766e" stroke-width="1.4" fill="none">
    <line x1="120" y1="166" x2="193" y2="166"/>
    <line x1="207" y1="166" x2="280" y2="166"/>
    <line x1="120" y1="161" x2="120" y2="171"/>
    <line x1="280" y1="161" x2="280" y2="171"/>
  </g>
  <text x="156" y="161" font-size="11" font-family="sans-serif" fill="#0f766e" text-anchor="middle">物距</text>
  <text x="244" y="161" font-size="11" font-family="sans-serif" fill="#0f766e" text-anchor="middle">像距</text>
</svg>
