<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#e8f1f8"/></linearGradient>
    <linearGradient id="mir" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfe4f0"/><stop offset=".45" stop-color="#f2f9fd"/><stop offset="1" stop-color="#b7d4e6"/></linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- 桌面 -->
  <rect x="0" y="302" width="640" height="58" fill="#e3d3ab"/>
  <rect x="0" y="302" width="640" height="6" fill="#d4c193"/>
  <!-- 中央立式平面镜（竖直，含支架） -->
  <g>
    <rect x="304" y="58" width="32" height="240" rx="5" fill="#8a5a2f" stroke="#6b4423" stroke-width="3"/>
    <rect x="311" y="66" width="18" height="224" rx="3" fill="url(#mir)"/>
    <rect x="288" y="294" width="64" height="12" rx="4" fill="#6b4423"/>
  </g>
  <!-- 镜前实物：白底字母 F 卡片（正立） -->
  <g>
    <rect x="128" y="128" width="116" height="140" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
    <g fill="#1d4ed8">
      <rect x="156" y="152" width="16" height="92"/>
      <rect x="156" y="152" width="62" height="15"/>
      <rect x="156" y="192" width="46" height="13"/>
    </g>
    <rect x="150" y="268" width="72" height="10" rx="3" fill="#94a3b8"/>
    <text x="186" y="300" font-size="14" fill="#41566b" font-family="sans-serif" text-anchor="middle">物（正立 F）</text>
  </g>
  <!-- 镜中虚像：左右颠倒的 F（半透明，画在镜面右侧） -->
  <g opacity=".5">
    <rect x="396" y="128" width="116" height="140" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <g fill="#1d4ed8">
      <rect x="468" y="152" width="16" height="92"/>
      <rect x="422" y="152" width="62" height="15"/>
      <rect x="438" y="192" width="46" height="13"/>
    </g>
  </g>
  <text x="454" y="300" font-size="14" fill="#41566b" font-family="sans-serif" text-anchor="middle">虚像（左右对调 · 正立等大）</text>
  <!-- 物像对称示意：等距标注 -->
  <g stroke="#0f766e" stroke-width="2" fill="none">
    <line x1="186" y1="96" x2="304" y2="96"/>
    <line x1="336" y1="96" x2="454" y2="96"/>
    <line x1="186" y1="90" x2="186" y2="102"/>
    <line x1="454" y1="90" x2="454" y2="102"/>
  </g>
  <text x="245" y="88" font-size="13" fill="#0f766e" font-family="sans-serif" text-anchor="middle">物距</text>
  <text x="395" y="88" font-size="13" fill="#0f766e" font-family="sans-serif" text-anchor="middle">像距（相等）</text>
  <!-- 一条对称轴虚线 -->
  <line x1="320" y1="40" x2="320" y2="330" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="9 7" opacity=".6"/>
</svg>
