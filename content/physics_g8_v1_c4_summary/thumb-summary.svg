<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdfbf5"/><stop offset="1" stop-color="#efe7d4"/></linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#faf6ec"/></linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- 摊开笔记本 -->
  <rect x="44" y="62" width="552" height="252" rx="12" fill="#b9762f"/>
  <rect x="54" y="72" width="532" height="232" rx="6" fill="url(#page)"/>
  <!-- 中缝装订 -->
  <rect x="312" y="72" width="16" height="232" fill="#e7dcc4"/>
  <g stroke="#cbb894" stroke-width="2">
    <line x1="312" y1="96" x2="328" y2="96"/><line x1="312" y1="140" x2="328" y2="140"/>
    <line x1="312" y1="184" x2="328" y2="184"/><line x1="312" y1="228" x2="328" y2="228"/>
    <line x1="312" y1="272" x2="328" y2="272"/>
  </g>
  <!-- 页面淡横线 -->
  <g stroke="#e8eff8" stroke-width="2">
    <line x1="74" y1="128" x2="300" y2="128"/><line x1="74" y1="172" x2="300" y2="172"/>
    <line x1="74" y1="216" x2="300" y2="216"/><line x1="74" y1="260" x2="300" y2="260"/>
    <line x1="340" y1="150" x2="566" y2="150"/><line x1="340" y1="184" x2="566" y2="184"/>
    <line x1="340" y1="218" x2="566" y2="218"/><line x1="340" y1="252" x2="566" y2="252"/>
  </g>
  <!-- 左页：光的反射光路（手绘感线稿） -->
  <line x1="96" y1="256" x2="284" y2="256" stroke="#b9762f" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#d2a35c" stroke-width="2">
    <line x1="106" y1="258" x2="98" y2="270"/><line x1="138" y1="258" x2="130" y2="270"/>
    <line x1="170" y1="258" x2="162" y2="270"/><line x1="202" y1="258" x2="194" y2="270"/>
    <line x1="234" y1="258" x2="226" y2="270"/><line x1="266" y1="258" x2="258" y2="270"/>
  </g>
  <line x1="190" y1="256" x2="190" y2="146" stroke="#8a93a0" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="120" y1="186" x2="190" y2="256" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="185,251 172,246 179,238" fill="#dc2626"/>
  <line x1="190" y1="256" x2="260" y2="186" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="255,191 248,184 256,180" fill="#2563eb"/>
  <path d="M190 230 A26 26 0 0 0 172 238" fill="none" stroke="#dc2626" stroke-width="2"/>
  <path d="M190 230 A26 26 0 0 1 208 238" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="226" font-size="14" fill="#dc2626" font-family="sans-serif">∠i</text>
  <text x="214" y="226" font-size="14" fill="#2563eb" font-family="sans-serif">∠r</text>
  <text x="196" y="144" font-size="13" fill="#8a93a0" font-family="sans-serif">法线</text>
  <!-- 右页：公式与笔记 -->
  <text x="340" y="124" font-size="20" font-weight="700" fill="#b9762f" font-family="sans-serif">光的反射定律</text>
  <text x="340" y="178" font-size="16" fill="#3f4a5a" font-family="sans-serif">反射角 = 入射角（∠r = ∠i）</text>
  <text x="340" y="212" font-size="16" fill="#3f4a5a" font-family="sans-serif">三线共面 · 法线居中 · 光路可逆</text>
  <text x="340" y="246" font-size="16" fill="#3f4a5a" font-family="sans-serif">平面镜：正立等大虚像，像距=物距</text>
  <line x1="340" y1="270" x2="500" y2="270" stroke="#cdd6e2" stroke-width="2" stroke-linecap="round"/>
  <!-- 标题与脚注 -->
  <text x="320" y="42" font-size="24" font-weight="700" fill="#8a531d" text-anchor="middle" font-family="sans-serif">光现象 · 本章小结</text>
  <text x="320" y="338" font-size="14" fill="#9a8f7c" text-anchor="middle" font-family="sans-serif">反射 / 折射 / 平面镜成像 知识速记</text>
</svg>
