<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- c4 本章小结缩略图：知识清单卡+反射/折射光路（三线+法线）（原创矢量） -->
  <defs>
    <linearGradient id="bgS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#e8f0f8"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bgS)"/>
  <!-- 知识清单卡 -->
  <rect x="60" y="72" width="330" height="216" rx="18" fill="#ffffff" stroke="#dbe4ee" stroke-width="2"/>
  <rect x="60" y="72" width="330" height="52" rx="18" fill="#2563eb"/>
  <rect x="60" y="106" width="330" height="18" fill="#2563eb"/>
  <text x="225" y="106" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="sans-serif">📋 本章小结</text>
  <!-- 清单行：勾+文字条 -->
  <g font-family="sans-serif">
    <circle cx="96" cy="164" r="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <path d="M91 164 l4 4 l7 -8" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <text x="118" y="170" font-size="17" fill="#334155">直线传播 · 光速 · 小孔</text>
    <circle cx="96" cy="208" r="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <path d="M91 208 l4 4 l7 -8" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <text x="118" y="214" font-size="17" fill="#334155">反射定律 · 镜面漫面</text>
    <circle cx="96" cy="252" r="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <path d="M91 252 l4 4 l7 -8" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <text x="118" y="258" font-size="17" fill="#334155">折射 · 平面镜成像</text>
  </g>
  <!-- 右侧：反射/折射光路 -->
  <g font-family="sans-serif">
    <rect x="435" y="205" width="188" height="100" fill="#dbeafe"/>
    <line x1="530" y1="96" x2="530" y2="296" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
    <line x1="435" y1="205" x2="623" y2="205" stroke="#475569" stroke-width="2.5"/>
    <line x1="450" y1="115" x2="530" y2="205" stroke="#f59e0b" stroke-width="3.5"/>
    <polygon points="528,203 515,196 522,189" fill="#f59e0b"/>
    <line x1="530" y1="205" x2="610" y2="115" stroke="#f59e0b" stroke-width="3.5"/>
    <polygon points="578,151 575,162 568,155" fill="#f59e0b"/>
    <line x1="530" y1="205" x2="568" y2="295" stroke="#16a34a" stroke-width="3.5"/>
    <polygon points="550,252 541,245 551,241" fill="#16a34a"/>
    <text x="542" y="108" font-size="13" fill="#64748b">法线</text>
    <text x="452" y="152" font-size="13" font-weight="bold" fill="#b45309">入射</text>
    <text x="586" y="140" font-size="13" font-weight="bold" fill="#b45309">反射</text>
    <text x="576" y="272" font-size="13" font-weight="bold" fill="#15803d">折射</text>
    <text x="447" y="196" font-size="13" fill="#64748b">空气</text>
    <text x="447" y="230" font-size="13" fill="#1d4ed8">水</text>
  </g>
  <text x="320" y="44" font-size="26" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="sans-serif">第四章「光现象」知识速记</text>
  <text x="320" y="330" font-size="16" fill="#64748b" text-anchor="middle" font-family="sans-serif">纯概念零题目 · 配套题目见本章练习</text>
</svg>
