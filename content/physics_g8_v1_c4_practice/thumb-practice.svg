<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdfbf5"/><stop offset="1" stop-color="#efe7d4"/></linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fbf7ee"/></linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- 答题纸 -->
  <rect x="118" y="52" width="404" height="256" rx="8" fill="url(#sheet)" stroke="#e0d6c2" stroke-width="2"/>
  <line x1="168" y1="52" x2="168" y2="308" stroke="#eaa9a9" stroke-width="2"/>
  <g stroke="#d8e6f3" stroke-width="2">
    <line x1="178" y1="100" x2="500" y2="100"/><line x1="178" y1="144" x2="500" y2="144"/>
    <line x1="178" y1="188" x2="500" y2="188"/><line x1="178" y1="232" x2="500" y2="232"/>
    <line x1="178" y1="276" x2="500" y2="276"/>
  </g>
  <g font-size="16" fill="#9aa3ad" font-family="sans-serif">
    <text x="138" y="100">1</text><text x="138" y="144">2</text>
    <text x="138" y="188">3</text><text x="138" y="232">4</text>
  </g>
  <!-- 手写答案条 -->
  <g stroke="#aab2c0" stroke-width="5" stroke-linecap="round">
    <line x1="186" y1="94" x2="300" y2="94"/><line x1="186" y1="138" x2="280" y2="138"/>
    <line x1="186" y1="226" x2="296" y2="226"/>
  </g>
  <!-- 判分：勾 / 叉 -->
  <path d="M330 92 l9 11 l17 -22" fill="none" stroke="#2e9e44" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M330 130 l22 22 M352 130 l-22 22" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  <path d="M330 224 l9 11 l17 -22" fill="none" stroke="#2e9e44" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 本章专属判分标记：光的反射小光路（第3题作答） -->
  <g>
    <line x1="196" y1="200" x2="284" y2="200" stroke="#b9762f" stroke-width="3" stroke-linecap="round"/>
    <line x1="240" y1="200" x2="240" y2="166" stroke="#9aa3ad" stroke-width="2" stroke-dasharray="5 4"/>
    <line x1="212" y1="172" x2="240" y2="200" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="240" y1="200" x2="268" y2="172" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M330 180 l9 11 l17 -22" fill="none" stroke="#2e9e44" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- 评分圈 -->
  <circle cx="466" cy="86" r="27" fill="none" stroke="#dc2626" stroke-width="3.5"/>
  <path d="M453 86 l10 12 l18 -24" fill="none" stroke="#2e9e44" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 铅笔（无脸） -->
  <g transform="translate(404,300) rotate(-30)">
    <rect x="0" y="0" width="22" height="24" rx="9" fill="#ef9a9a" stroke="#c07b76" stroke-width="2"/>
    <rect x="22" y="0" width="16" height="24" fill="#cbc4b4" stroke="#9a9384" stroke-width="2"/>
    <rect x="38" y="0" width="82" height="24" fill="#e8a93d" stroke="#b8862f" stroke-width="2"/>
    <rect x="38" y="8" width="82" height="8" fill="#f4cd7c"/>
    <polygon points="120,0 150,12 120,24" fill="#f0d3a5" stroke="#b8862f" stroke-width="2"/>
    <polygon points="141,8 150,12 141,16" fill="#3a3a3a"/>
  </g>
  <!-- 标题与脚注 -->
  <text x="320" y="40" font-size="24" font-weight="700" fill="#8a531d" text-anchor="middle" font-family="sans-serif">光现象 · 本章练习</text>
  <text x="320" y="338" font-size="14" fill="#9a8f7c" text-anchor="middle" font-family="sans-serif">考点作答 · 判分订正 · 配套本章小结</text>
</svg>
