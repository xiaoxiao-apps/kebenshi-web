<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- c3 本章小结缩略图：知识清单卡+六态循环环/熔化曲线小图（原创矢量） -->
  <defs>
    <linearGradient id="bgS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#e8f0f8"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bgS)"/>
  <!-- 知识清单卡 -->
  <rect x="60" y="72" width="330" height="216" rx="18" fill="#ffffff" stroke="#dbe4ee" stroke-width="2"/>
  <rect x="60" y="72" width="330" height="52" rx="18" fill="#2563eb"/>
  <rect x="60" y="106" width="330" height="18" fill="#2563eb"/>
  <text x="225" y="106" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="sans-serif">📋 本章小结</text>
  <!-- 清单行：勾+文字条 -->
  <g font-family="sans-serif">
    <circle cx="96" cy="164" r="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <path d="M91 164 l4 4 l7 -8" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <text x="118" y="170" font-size="17" fill="#334155">温度 · 温度计 · 使用</text>
    <circle cx="96" cy="208" r="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <path d="M91 208 l4 4 l7 -8" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <text x="118" y="214" font-size="17" fill="#334155">熔化凝固 · 晶体熔点</text>
    <circle cx="96" cy="252" r="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <path d="M91 252 l4 4 l7 -8" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <text x="118" y="258" font-size="17" fill="#334155">汽化液化 · 升华凝华</text>
  </g>
  <!-- 右上：六态循环环（固液气+双向箭头） -->
  <g font-family="sans-serif">
    <line x1="502" y1="178" x2="558" y2="178" stroke="#475569" stroke-width="2"/>
    <polygon points="502,178 510,174 510,182" fill="#475569"/>
    <polygon points="558,178 550,174 550,182" fill="#475569"/>
    <line x1="515" y1="125" x2="493" y2="157" stroke="#475569" stroke-width="2"/>
    <polygon points="493,157 494,148 501,153" fill="#475569"/>
    <polygon points="515,125 507,129 514,134" fill="#475569"/>
    <line x1="545" y1="125" x2="567" y2="157" stroke="#475569" stroke-width="2"/>
    <polygon points="567,157 566,148 559,153" fill="#475569"/>
    <polygon points="545,125 553,129 546,134" fill="#475569"/>
    <circle cx="530" cy="104" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <text x="530" y="110" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">固</text>
    <circle cx="478" cy="178" r="24" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5"/>
    <text x="478" y="184" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">液</text>
    <circle cx="582" cy="178" r="24" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="582" y="184" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">气</text>
    <text x="495" y="140" font-size="11" fill="#64748b" text-anchor="middle">熔化·凝固</text>
    <text x="530" y="166" font-size="11" fill="#64748b" text-anchor="middle">汽化·液化</text>
    <text x="567" y="140" font-size="11" fill="#64748b" text-anchor="middle">升华·凝华</text>
  </g>
  <!-- 右下：晶体熔化曲线小图 -->
  <g font-family="sans-serif">
    <text x="530" y="228" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">晶体熔化曲线</text>
    <line x1="450" y1="240" x2="450" y2="302" stroke="#64748b" stroke-width="2"/>
    <line x1="450" y1="302" x2="612" y2="302" stroke="#64748b" stroke-width="2"/>
    <line x1="450" y1="270" x2="606" y2="270" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M455 298 L492 270 L528 270 L572 244" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <text x="466" y="244" font-size="11" fill="#64748b">T/℃</text>
    <text x="588" y="316" font-size="11" fill="#64748b">时间</text>
    <text x="510" y="262" font-size="11" fill="#b45309" text-anchor="middle">熔点·吸热温度不变</text>
  </g>
  <text x="320" y="44" font-size="26" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="sans-serif">第三章「物态变化」知识速记</text>
  <text x="320" y="330" font-size="16" fill="#64748b" text-anchor="middle" font-family="sans-serif">纯概念零题目 · 配套题目见本章练习</text>
</svg>
